<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
<title>NOCHES EN LA ARENA 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-dark: #1e1e1e;
        --clay-primary: #b04a2c;
        --clay-dark: #7a2a16;
        --zinc-700: #3f3f46;
        --zinc-800: #27272a;
        --gold: #e2b05f;
        --silver: #c0c0c0;
        --bronze: #cd7f32;
        --text-gray: #a1a1aa;
    }

    * {
        box-sizing: border-box;
    }

    body {
        background-color: #121212;
        background-image:
            linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
            url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
        color: #ffffff;
        font-family: 'Montserrat', sans-serif;
        margin: 0;
        padding: 20px;
        overflow-x: hidden;
    }

    header {
        text-align: center;
        background: linear-gradient(to right, transparent, rgba(176, 74, 44, 0.2), transparent);
        padding: 20px;
        border-bottom: 1px solid var(--clay-primary);
        margin-bottom: 30px;
    }

    .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }

    h1 {
        font-family: 'Oswald', sans-serif;
        font-size: 3rem;
        margin: 0;
        letter-spacing: 2px;
        color: #ddd;
    }

    .subtitle {
        color: var(--gold);
        letter-spacing: 4px;
        text-transform: uppercase;
        font-size: 1rem;
    }

    .main-layout {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
    }

    .setup-panel {
        background: var(--zinc-800);
        border-radius: 12px;
        padding: 20px;
        width: 320px;
        border: 1px solid var(--clay-primary);
    }

    .groups-panel {
        flex: 1;
        min-width: 400px;
    }

    .group-card {
        background: #252525;
        border-radius: 8px;
        margin-bottom: 20px;
        border: 1px solid #444;
        overflow: hidden;
    }

    .group-header {
        background: #333;
        padding: 10px;
        color: var(--gold);
        font-weight: bold;
        text-align: center;
        border-bottom: 1px solid var(--clay-primary);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8rem;
    }

    th {
        background: #1a1a1a;
        padding: 8px;
        color: var(--text-gray);
    }

    td {
        padding: 8px;
        text-align: center;
        border-bottom: 1px solid #333;
    }

    .match-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
        border-bottom: 1px solid #222;
        gap: 8px;
    }

    .bracket-container {
        display: flex;
        gap: 30px;
        padding: 20px;
        background: rgba(0,0,0,0.3);
        border-radius: 15px;
        overflow-x: auto;
        position: relative;
        justify-content: flex-start;
    }

    .round-column {
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        gap: 20px;
        position: relative;
        min-width: 220px;
    }

    .round-column.is-final {
        min-width: 320px;
    }

    .round-title {
        text-align: center;
        color: var(--gold);
        font-family: 'Oswald', sans-serif;
        margin-bottom: 10px;
        letter-spacing: 1px;
    }

    .bracket-match {
        width: 220px;
        background: #2a2a2a;
        border-radius: 4px;
        border: 1px solid #444;
        position: relative;
        z-index: 2;
    }

    .round-column.is-final .bracket-match {
        width: 320px;
    }

    .player-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        height: 40px;
    }

    .player-row:first-child {
        border-bottom: 1px solid #333;
    }

    .player-name {
        font-size: 0.85rem;
        font-weight: bold;
        color: #e0e0e0;
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
    }

    .seed-label {
        background: var(--clay-primary);
        font-size: 0.65rem;
        padding: 2px 5px;
        border-radius: 2px;
    }

    .score-input {
        width: 45px;
        background: #000;
        border: 1px solid var(--zinc-700);
        color: var(--gold);
        text-align: center;
        border-radius: 3px;
        height: 28px;
    }

    .score-container-multi {
        display: flex;
        gap: 4px;
    }

    .score-input-multi {
        width: 32px;
        background: #000;
        border: 1px solid var(--zinc-700);
        color: var(--gold);
        text-align: center;
        border-radius: 3px;
        height: 28px;
        font-size: 0.8rem;
    }

    .score-input-multi:focus, .score-input:focus {
        outline: 1px solid var(--gold);
    }

    .score-input-multi:disabled, .score-input:disabled {
        background: #1a1a1a;
        color: #555;
        cursor: not-allowed;
    }

    /* ESTILOS DEL PODIO */
    #podium-box {
        margin-top: 30px;
        padding: 30px;
        background: #252525;
        border: 2px solid var(--gold);
        text-align: center;
        border-radius: 12px;
        display: none;
    }

    .podium-title {
        color: var(--gold);
        font-weight: bold;
        letter-spacing: 2px;
        font-family: 'Oswald', sans-serif;
        font-size: 1.5rem;
        margin-bottom: 25px;
    }

    .podium-container {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 20px;
        padding-top: 20px;
    }

    .podium-step {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 130px;
        transition: transform 0.3s ease;
    }

    .podium-step:hover {
        transform: translateY(-5px);
    }

    .podium-trophy {
        font-size: 3rem;
        margin-bottom: 8px;
        position: relative;
    }

    .podium-trophy::after {
        content: attr(data-pos);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -55%);
        font-size: 0.9rem;
        font-weight: 900;
        font-family: 'Oswald', sans-serif;
        color: #121212;
    }

    .podium-step.first .podium-trophy {
        font-size: 4rem;
    }

    .podium-step.first .podium-trophy::after {
        font-size: 1.1rem;
        top: 52%;
    }

    .podium-name {
        font-size: 0.9rem;
        font-weight: bold;
        color: #fff;
        margin-top: 8px;
        word-break: break-word;
        background: #1a1a1a;
        padding: 6px 10px;
        border-radius: 4px;
        width: 100%;
        border: 1px solid #444;
    }

    .podium-step.first .podium-name {
        border-color: var(--gold);
        color: var(--gold);
    }

    .podium-step.second .podium-name {
        border-color: var(--silver);
    }

    .podium-step.third .podium-name {
        border-color: var(--bronze);
    }

    textarea,
    select,
    input[type="text"],
    input[type="number"] {
        background: #111;
        border: 1px solid #444;
        color: white;
        padding: 8px;
        border-radius: 4px;
        width: 100%;
    }

    .section-subtitle {
        color: var(--gold);
        font-size: 0.85rem;
        font-weight: bold;
        margin-top: 15px;
        margin-bottom: 5px;
        border-bottom: 1px solid #444;
        padding-bottom: 3px;
    }

    button {
        background: var(--clay-primary);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        margin-top: 15px;
        text-transform: uppercase;
        transition: 0.2s;
    }

    button:hover {
        background: var(--clay-dark);
    }

    #btnNuevoTorneo {
        width: auto;
        margin-top: 0;
    }

    .hidden {
        display: none !important;
    }

    @media (max-width: 768px) {
        body { padding: 10px; }
        h1 { font-size: 1.8rem; }
        .subtitle { font-size: 0.8rem; letter-spacing: 2px; }
        .header-top { justify-content: center; }
        .setup-panel { width: 100%; }
        .groups-panel { min-width: 100%; }
        .match-item { font-size: 0.75rem; gap: 5px; }
        .match-item span { font-size: 0.7rem !important; }
        .score-input { width: 40px; font-size: 0.8rem; }
        table { font-size: 0.7rem; }
        th, td { padding: 5px; }
        .bracket-container { flex-direction: row; overflow-x: auto; gap: 20px; padding: 15px; }
        .round-column { min-width: 200px; gap: 15px; }
        .bracket-match { width: 100%; }
        .round-title { font-size: 0.9rem; }
        .player-name { font-size: 0.75rem; }
        #podium-box { padding: 20px; }
        .podium-container { gap: 10px; }
        .podium-step { width: 100px; }
    }

    @media (max-width: 480px) {
        .match-item { flex-wrap: wrap; justify-content: center; }
        .player-name { font-size: 0.7rem; }
        .score-input { width: 35px; height: 30px; }
        button { padding: 10px; font-size: 0.85rem; }
    }
</style>
</head>

<body>

<header>
    <div class="header-top">
        <div>
            <h1 id="title-display">NOCHES EN LA ARENA 2026</h1>
            <div class="subtitle" id="subtitle-display">Club de Tenis Legends Fuentes</div>
        </div>
        <button id="btnNuevoTorneo" onclick="nuevoTorneo()">
            🏆 Nuevo torneo
        </button>
    </div>
</header>

<div class="main-layout">

    <div id="setup-panel" class="setup-panel">
        <h3 style="margin-top:0; color:var(--gold);">Configuración del Torneo</h3>
        
        <label style="font-size:0.8rem;">Nombre del Campeonato</label>
        <input type="text" id="tournament-title-input" value="Torneo xxx Club de Tenis Legends Fuentes">

        <div class="section-subtitle">Jugadores y Grupos</div>

        <label style="font-size:0.8rem;">Jugadores (uno por línea)</label>
        <textarea id="player-names" rows="8">Nadal
Djokovic
Alcaraz
Sinner
Federer
Zverev
Ruud
Tsitsipas</textarea>
        
        <label style="font-size:0.8rem; margin-top:10px; display:block;">Número de Grupos</label>
        <select id="num-groups">
            <option value="1">1 Grupo</option>
            <option value="2">2 Grupos</option>
            <option value="3">3 Grupos</option>
            <option value="4" selected>4 Grupos</option>
            <option value="5">5 Grupos</option>
            <option value="6">6 Grupos</option>
        </select>

        <label style="font-size:0.8rem; margin-top:10px; display:block;">Clasificados por Grupo</label>
        <select id="qualified-per-group">
            <option value="1">1 Jugador</option>
            <option value="2" selected>2 Jugadores</option>
            <option value="3">3 Jugadores</option>
        </select>

        <label style="font-size:0.8rem; margin-top:10px; display:block;">Cabezas de Serie</label>
        <select id="seeds-toggle" onchange="toggleSeedsInput()">
            <option value="no" selected>Desactivado (Sorteo total)</option>
            <option value="yes">Activado (Sorteo dirigido)</option>
        </select>

        <div id="seeds-count-box" class="hidden">
            <label style="font-size:0.8rem; margin-top:10px; display:block;">Nº de Cabezas de Serie (Primeros de la lista)</label>
            <input type="number" id="num-seeds" min="1" value="4">
        </div>

        <div class="section-subtitle">Formato de Sets por Fase</div>

        <label style="font-size:0.8rem; display:block;">Fase de Grupos</label>
        <select id="sets-groups">
            <option value="1" selected>Al mejor de 1 Set</option>
            <option value="3">Al mejor de 3 Sets</option>
        </select>

        <label style="font-size:0.8rem; margin-top:8px; display:block;">Semifinales / Cuadro</label>
        <select id="sets-semis">
            <option value="1" selected>Al mejor de 1 Set</option>
            <option value="3">Al mejor de 3 Sets</option>
        </select>

        <label style="font-size:0.8rem; margin-top:8px; display:block;">3º y 4º Puesto</label>
        <select id="sets-34">
            <option value="1" selected>Al mejor de 1 Set</option>
            <option value="3">Al mejor de 3 Sets</option>
        </select>

        <label style="font-size:0.8rem; margin-top:8px; display:block;">Gran Final</label>
        <select id="sets-final">
            <option value="1">Al mejor de 1 Set</option>
            <option value="3" selected>Al mejor de 3 Sets</option>
        </select>
        
        <button onclick="iniciarTorneo()">Generar Torneo</button>
    </div>

    <div id="tournament-view" class="hidden" style="width:100%;">
        <div class="main-layout">
            <div id="groups-area" class="groups-panel"></div>
            <div id="bracket-area" style="width:100%;">
                <div id="bracket-view" class="bracket-container"></div>
                <div id="podium-box">
                    <div class="podium-title">PODIO FINAL DEL TORNEO</div>
                    <div class="podium-container">
                        <div class="podium-step second">
                            <div class="podium-trophy" data-pos="2º">🏆</div>
                            <div style="font-size:0.75rem; color:var(--silver);">2º PUESTO</div>
                            <div id="podium-2" class="podium-name">-</div>
                        </div>
                        <div class="podium-step first">
                            <div class="podium-trophy" data-pos="1º">🏆</div>
                            <div style="font-size:0.75rem; color:var(--gold);">CAMPEÓN</div>
                            <div id="podium-1" class="podium-name">-</div>
                        </div>
                        <div class="podium-step third">
                            <div class="podium-trophy" data-pos="3º">🏆</div>
                            <div style="font-size:0.75rem; color:var(--bronze);">3º PUESTO</div>
                            <div id="podium-3" class="podium-name">-</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>
<script>

// ===============================
// FIREBASE REALTIME DATABASE
// ===============================
const firebaseConfig = {
    apiKey: "AIzaSyChJBr9Sc400fQWAAUbD0GdkemqSen1wco",
    authDomain: "noches-en-la-arena-3.firebaseapp.com",
    databaseURL: "https://noches-en-la-arena-3-default-rtdb.firebaseio.com",
    projectId: "noches-en-la-arena-3",
    storageBucket: "noches-en-la-arena-3.firebasestorage.app",
    messagingSenderId: "61926357219",
    appId: "1:61926357219:web:40f9f362b0d1fc08fc6dd6"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const torneoRef = database.ref("torneoArena2026");
let firebaseReady = false;
let firebaseInitialised = false;
let firebaseApplyingRemote = false;
let pendingFirebaseSave = false;
let lastRemoteJSON = null;

let tournament = {
    title: "Torneo xxx Club de Tenis Legends Fuentes",
    groups: [],
    bracket: [],
    thirdPlaceMatch: { p1: null, p2: null, sets: [{s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null}] },
    finalGroup: null, 
    semifinalA3: null, 
    setsConfig: {
        groups: 1,
        semis: 1,
        third4th: 1,
        final: 3
    }
};

function toggleSeedsInput() {
    const isSeeds = document.getElementById('seeds-toggle').value === 'yes';
    document.getElementById('seeds-count-box').classList.toggle('hidden', !isSeeds);
}

// ===============================
// GUARDADO AUTOMÁTICO
// ===============================

function guardarTorneo() {
    const estado = {
        tournament: tournament,
        numGroups: document.getElementById('num-groups').value,
        qualified: document.getElementById('qualified-per-group').value
    };

    const estadoJSON = JSON.stringify(estado);
    localStorage.setItem("torneoArena2026", estadoJSON);

    if (!firebaseReady) {
        pendingFirebaseSave = true;
        return;
    }

    if (firebaseApplyingRemote) return;

    pendingFirebaseSave = false;
    torneoRef.set({
        estado: estadoJSON,
        actualizado: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
        lastRemoteJSON = estadoJSON;
    }).catch(error => {
        console.error("Error al guardar en Firebase Realtime Database:", error);
    });
}

function cargarTorneo() {
    const datos = localStorage.getItem("torneoArena2026");
    if (!datos) return false;

    try {
        const estado = JSON.parse(datos);
        tournament = estado.tournament;
        
        if (!tournament.title) tournament.title = "Torneo xxx Club de Tenis Legends Fuentes";
        if (!tournament.setsConfig) {
            tournament.setsConfig = { groups: 1, semis: 1, third4th: 1, final: 3 };
        }
        if (!tournament.thirdPlaceMatch) {
            tournament.thirdPlaceMatch = { p1: null, p2: null, sets: [{s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null}] };
        }

        document.getElementById('num-groups').value = estado.numGroups;
        document.getElementById('qualified-per-group').value = estado.qualified;
        document.getElementById('tournament-title-input').value = tournament.title;

        document.getElementById('title-display').innerText = tournament.title;

        return true;
    } catch (e) {
        console.error(e);
        return false;
    }
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function iniciarTorneo() {
    const names = document
        .getElementById('player-names')
        .value
        .split('\n')
        .map(n => n.trim())
        .filter(n => n);

    const nGroups = parseInt(document.getElementById('num-groups').value);
    const qualified = parseInt(document.getElementById('qualified-per-group').value);
    const titleVal = document.getElementById('tournament-title-input').value.trim();
    
    tournament.title = titleVal || "Torneo xxx Club de Tenis Legends Fuentes";
    document.getElementById('title-display').innerText = tournament.title;

    tournament.setsConfig = {
        groups: parseInt(document.getElementById('sets-groups').value),
        semis: parseInt(document.getElementById('sets-semis').value),
        third4th: parseInt(document.getElementById('sets-34').value),
        final: parseInt(document.getElementById('sets-final').value)
    };

    if (names.length < nGroups * qualified) {
        alert(`Se necesitan al menos ${nGroups * qualified} jugadores (${nGroups} grupos x ${qualified} clasificados). Actual: ${names.length}`);
        return;
    }

    const useSeeds = document.getElementById('seeds-toggle').value === 'yes';
    const numSeeds = useSeeds ? parseInt(document.getElementById('num-seeds').value) : 0;

    let seedsList = [];
    let regularsList = [];

    if (useSeeds && numSeeds > 0) {
        seedsList = names.slice(0, numSeeds);
        regularsList = names.slice(numSeeds);
    } else {
        regularsList = [...names];
    }

    shuffle(regularsList);

    tournament.groups = Array.from({ length: nGroups }, (_, i) => ({
        id: String.fromCharCode(65 + i),
        players: [],
        matches: []
    }));

    // Repartir Cabezas de Serie
    seedsList.forEach((seedName, i) => {
        tournament.groups[i % nGroups].players.push({
            name: seedName,
            isSeed: true,
            won: 0,
            gf: 0,
            gc: 0,
            diff: 0
        });
    });

    // Repartir el resto equilibradamente (Soporta grupos asimétricos)
    regularsList.forEach(regName => {
        let minGroup = tournament.groups.reduce((min, g) => g.players.length < min.players.length ? g : min, tournament.groups[0]);
        minGroup.players.push({
            name: regName,
            isSeed: false,
            won: 0,
            gf: 0,
            gc: 0,
            diff: 0
        });
    });

    // Generar Enfrentamientos
    tournament.groups.forEach(group => {
        for (let i = 0; i < group.players.length; i++) {
            for (let j = i + 1; j < group.players.length; j++) {
                group.matches.push({
                    p1: group.players[i].name,
                    p2: group.players[j].name,
                    sets: [ {s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null} ]
                });
            }
        }
    });

    tournament.bracket = [];
    tournament.thirdPlaceMatch = { p1: null, p2: null, sets: [{s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null}] };
    tournament.finalGroup = null;
    tournament.semifinalA3 = null;

    render();

    document.getElementById('setup-panel').classList.add('hidden');
    document.getElementById('tournament-view').classList.remove('hidden');

    guardarTorneo();
}

function updateGroupScore(gIdx, mIdx, setIdx, pNum, val) {
    const group = tournament.groups[gIdx];
    const match = group.matches[mIdx];
    const parsedVal = val === "" ? null : parseInt(val);

    if (parsedVal !== null && (isNaN(parsedVal) || parsedVal < 0)) {
        alert("Número inválido");
        render();
        return;
    }

    if (pNum === 1) match.sets[setIdx].s1 = parsedVal;
    else match.sets[setIdx].s2 = parsedVal;

    // Recalcular estadísticas del grupo
    group.players.forEach(p => { p.won = 0; p.gf = 0; p.gc = 0; p.diff = 0; });

    const maxSets = tournament.setsConfig.groups === 3 ? 3 : 1;

    group.matches.forEach(m => {
        let p1TotalGames = 0, p2TotalGames = 0;
        let p1SetsWon = 0, p2SetsWon = 0;
        let played = false;

        for (let s = 0; s < maxSets; s++) {
            const v1 = m.sets[s].s1;
            const v2 = m.sets[s].s2;
            if (v1 !== null && v2 !== null) {
                played = true;
                p1TotalGames += v1;
                p2TotalGames += v2;
                if (v1 > v2) p1SetsWon++;
                else if (v2 > v1) p2SetsWon++;
            }
        }

        if (played) {
            const p1 = group.players.find(p => p.name === m.p1);
            const p2 = group.players.find(p => p.name === m.p2);

            p1.gf += p1TotalGames; p1.gc += p2TotalGames;
            p2.gf += p2TotalGames; p2.gc += p1TotalGames;

            if (p1SetsWon > p2SetsWon) p1.won++;
            else if (p2SetsWon > p1SetsWon) p2.won++;

            p1.diff = p1.gf - p1.gc;
            p2.diff = p2.gf - p2.gc;
        }
    });

    group.players.sort((a, b) => b.won - a.won || b.diff - a.diff || b.gf - a.gf);

    checkKnockoutStart();
    guardarTorneo();
    render();
}

function isGroupMatchFinished(m, numSets) {
    if (numSets === 1) {
        return m.sets[0].s1 !== null && m.sets[0].s2 !== null;
    } else {
        let p1 = 0, p2 = 0;
        for (let s = 0; s < 3; s++) {
            if (m.sets[s].s1 !== null && m.sets[s].s2 !== null) {
                if (m.sets[s].s1 > m.sets[s].s2) p1++;
                else if (m.sets[s].s2 > m.sets[s].s1) p2++;
                if (p1 === 2 || p2 === 2) return true;
            }
        }
        return false;
    }
}

function checkKnockoutStart() {
    const numSets = tournament.setsConfig.groups;
    const allDone = tournament.groups.every(group =>
        group.matches.every(m => isGroupMatchFinished(m, numSets))
    );
    
    if (allDone && tournament.bracket.length === 0 && !tournament.finalGroup && !tournament.semifinalA3) {
        const qualifiedCount = parseInt(document.getElementById('qualified-per-group').value);
        let qualifiedList = [];

        tournament.groups.forEach(group => {
            for (let i = 0; i < qualifiedCount; i++) {
                if (group.players[i]) {
                    qualifiedList.push({
                        name: group.players[i].name,
                        label: `${group.id}${i + 1}`
                    });
                }
            }
        });

        const totalQ = qualifiedList.length;
        if (totalQ === 0) return;

        // CASO ESPECIAL: 3 GRUPOS + 2 CLASIFICADOS = 6 JUGADORES
        if (tournament.groups.length === 3 && qualifiedCount === 2 && totalQ === 6) {
            const a = qualifiedList;
            tournament.semifinalA3 = {
                matches: [
                    { p1: a[0].name, p2: a[3].name, label1: a[0].label, label2: a[3].label, sets: [{s1:null, s2:null},{s1:null, s2:null},{s1:null, s2:null}] },
                    { p1: a[2].name, p2: a[5].name, label1: a[2].label, label2: a[5].label, sets: [{s1:null, s2:null},{s1:null, s2:null},{s1:null, s2:null}] },
                    { p1: a[4].name, p2: a[1].name, label1: a[4].label, label2: a[1].label, sets: [{s1:null, s2:null},{s1:null, s2:null},{s1:null, s2:null}] }
                ]
            };
            return;
        }

        // CASO 1: EXACTAMENTE 3 CLASIFICADOS -> TRIANGULAR FINAL
        if (totalQ === 3) {
            let players = qualifiedList.map(p => ({ name: p.name, won: 0, gf: 0, gc: 0, diff: 0 }));
            let matches = [];
            for (let i = 0; i < players.length; i++) {
                for (let j = i + 1; j < players.length; j++) {
                    matches.push({ p1: players[i].name, p2: players[j].name, sets: [{s1:null, s2:null},{s1:null, s2:null},{s1:null, s2:null}] });
                }
            }
            tournament.finalGroup = { players, matches };
            return;
        }

        // CASO 2: EXACTAMENTE 2 CLASIFICADOS -> GRAN FINAL DIRECTA
        if (totalQ === 2) {
            tournament.bracket = [[
                {
                    p1: qualifiedList[0].name,
                    p2: qualifiedList[1].name,
                    label1: qualifiedList[0].label,
                    label2: qualifiedList[1].label,
                    sets: [{s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null}]
                }
            ]];
            return;
        }

        // CASO 3: ELIMINATORIAS DIRECTAS (4 O MÁS)
        let targetSize = 2;
        while (targetSize < totalQ) {
            targetSize *= 2;
        }

        let firstRound = [];
        let numMatches = targetSize / 2;

        for (let i = 0; i < numMatches; i++) {
            let p1Obj = qualifiedList[i] || null;
            let p2Obj = qualifiedList[targetSize - 1 - i] || null;

            firstRound.push({
                p1: p1Obj ? p1Obj.name : null,
                p2: p2Obj ? p2Obj.name : null,
                label1: p1Obj ? p1Obj.label : "BYE",
                label2: p2Obj ? p2Obj.label : "BYE",
                sets: [{s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null}]
            });
        }

        tournament.bracket = [firstRound];
        let size = Math.ceil(firstRound.length / 2);

        while (size >= 1) {
            tournament.bracket.push(
                Array.from({ length: size }, () => ({
                    p1: null, p2: null,
                    sets: [{s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null}]
                }))
            );
            if (size === 1) break;
            size = Math.ceil(size / 2);
        }
    }
}

function getMatchWinner(match, maxSets) {
    if (!match.p1 || !match.p2) return null;
    let p1 = 0, p2 = 0;
    const req = maxSets === 3 ? 2 : 1;

    for (let s = 0; s < maxSets; s++) {
        const v1 = match.sets[s].s1;
        const v2 = match.sets[s].s2;
        if (v1 !== null && v2 !== null) {
            if (v1 > v2) p1++;
            else if (v2 > v1) p2++;
            if (p1 === req) return match.p1;
            if (p2 === req) return match.p2;
        }
    }
    return null;
}

function getMatchLoser(match, maxSets) {
    const winner = getMatchWinner(match, maxSets);
    if (!winner) return null;
    return winner === match.p1 ? match.p2 : match.p1;
}

function updateSemifinalLosers() {
    if (tournament.bracket.length < 2) return;
    const semiRoundIdx = tournament.bracket.length - 2;
    const semis = tournament.bracket[semiRoundIdx];
    const maxSets = tournament.setsConfig.semis;
    
    let losers = [];
    if (semis && semis.length === 2) {
        semis.forEach(semi => {
            losers.push(getMatchLoser(semi, maxSets));
        });
    } else {
        losers = [null, null];
    }
    
    tournament.thirdPlaceMatch.p1 = losers[0];
    tournament.thirdPlaceMatch.p2 = losers[1];
    if (!losers[0] || !losers[1]) {
        tournament.thirdPlaceMatch.sets = [{s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null}];
    }
}

function updateBracketScore(rIdx, mIdx, setIdx, pNum, val) {
    const match = tournament.bracket[rIdx][mIdx];
    const parsedVal = val === "" ? null : parseInt(val);

    if (parsedVal !== null && (isNaN(parsedVal) || parsedVal < 0)) {
        alert("Número inválido");
        render();
        return;
    }

    match.sets[setIdx][pNum === 1 ? 's1' : 's2'] = parsedVal;

    const diff = tournament.bracket.length - rIdx;
    const maxSets = diff === 1 ? tournament.setsConfig.final : tournament.setsConfig.semis;
    const winner = getMatchWinner(match, maxSets);

    if (rIdx < tournament.bracket.length - 1) {
        const nextMatchIdx = Math.floor(mIdx / 2);
        const nextMatch = tournament.bracket[rIdx + 1][nextMatchIdx];
        if (mIdx % 2 === 0) nextMatch.p1 = winner;
        else nextMatch.p2 = winner;

        if (!winner) {
            limpiarAdelante(rIdx, mIdx);
        }
    }

    updateSemifinalLosers();
    guardarTorneo();
    render();
}

function updateThirdPlaceScore(setIdx, pNum, val) {
    const match = tournament.thirdPlaceMatch;
    const parsedVal = val === "" ? null : parseInt(val);

    if (parsedVal !== null && (isNaN(parsedVal) || parsedVal < 0)) {
        alert("Número inválido");
        render();
        return;
    }

    match.sets[setIdx][pNum === 1 ? 's1' : 's2'] = parsedVal;
    guardarTorneo();
    render();
}

function updateSemifinalA3Score(mIdx, setIdx, pNum, val) {
    const match = tournament.semifinalA3.matches[mIdx];
    const parsedVal = val === "" ? null : parseInt(val);

    if (parsedVal !== null && (isNaN(parsedVal) || parsedVal < 0)) {
        alert("Número inválido");
        render();
        return;
    }

    match.sets[setIdx][pNum === 1 ? 's1' : 's2'] = parsedVal;

    const maxSets = tournament.setsConfig.semis;
    const allDone = tournament.semifinalA3.matches.every(m => getMatchWinner(m, maxSets) !== null);

    if (allDone && !tournament.finalGroup) {
        const winners = tournament.semifinalA3.matches.map(m => getMatchWinner(m, maxSets));
        const players = winners.map(name => ({ name, won: 0, gf: 0, gc: 0, diff: 0 }));
        const matches = [];
        for (let i = 0; i < players.length; i++) {
            for (let j = i + 1; j < players.length; j++) {
                matches.push({ p1: players[i].name, p2: players[j].name, sets: [{s1:null, s2:null},{s1:null, s2:null},{s1:null, s2:null}] });
            }
        }
        tournament.finalGroup = { players, matches };
    }

    guardarTorneo();
    render();
}

function updateFinalGroupScore(mIdx, setIdx, pNum, val) {
    const match = tournament.finalGroup.matches[mIdx];
    const parsedVal = val === "" ? null : parseInt(val);

    if (parsedVal !== null && (isNaN(parsedVal) || parsedVal < 0)) {
        alert("Número inválido");
        render();
        return;
    }

    match.sets[setIdx][pNum === 1 ? 's1' : 's2'] = parsedVal;

    const fg = tournament.finalGroup;
    fg.players.forEach(p => { p.won = 0; p.gf = 0; p.gc = 0; p.diff = 0; });

    const maxSets = tournament.setsConfig.final;

    fg.matches.forEach(m => {
        let p1Total = 0, p2Total = 0, p1S = 0, p2S = 0, played = false;
        for (let s = 0; s < maxSets; s++) {
            const v1 = m.sets[s].s1;
            const v2 = m.sets[s].s2;
            if (v1 !== null && v2 !== null) {
                played = true;
                p1Total += v1; p2Total += v2;
                if (v1 > v2) p1S++; else if (v2 > v1) p2S++;
            }
        }
        if (played) {
            const p1 = fg.players.find(p => p.name === m.p1);
            const p2 = fg.players.find(p => p.name === m.p2);
            p1.gf += p1Total; p1.gc += p2Total;
            p2.gf += p2Total; p2.gc += p1Total;
            if (p1S > p2S) p1.won++; else if (p2S > p1S) p2.won++;
            p1.diff = p1.gf - p1.gc;
            p2.diff = p2.gf - p2.gc;
        }
    });

    fg.players.sort((a, b) => b.won - a.won || b.diff - a.diff || b.gf - a.gf);

    guardarTorneo();
    render();
}

function limpiarAdelante(rIdx, mIdx) {
    if (rIdx >= tournament.bracket.length - 1) return;
    const nextMatchIdx = Math.floor(mIdx / 2);
    const nextMatch = tournament.bracket[rIdx + 1][nextMatchIdx];
    if (mIdx % 2 === 0) nextMatch.p1 = null;
    else nextMatch.p2 = null;
    nextMatch.sets = [{s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null}];
    
    limpiarAdelante(rIdx + 1, nextMatchIdx);
}

function actualizarPodio() {
    const box = document.getElementById('podium-box');
    const el1 = document.getElementById('podium-1');
    const el2 = document.getElementById('podium-2');
    const el3 = document.getElementById('podium-3');

    // CASO 1: TRIANGULAR FINAL
    if (tournament.finalGroup) {
        const fg = tournament.finalGroup;
        const maxSets = tournament.setsConfig.final;
        const allMatchesDone = fg.matches.every(m => isGroupMatchFinished(m, maxSets));
        if (allMatchesDone && fg.players.length === 3) {
            el1.innerText = fg.players[0].name;
            el2.innerText = fg.players[1].name;
            el3.innerText = fg.players[2].name;
            box.style.display = "block";
        } else {
            box.style.display = "none";
        }
        return;
    }

    if (tournament.bracket.length === 0) {
        box.style.display = "none";
        return;
    }

    // CASO 2: CUADRO ELIMINATORIO
    const finalRoundIdx = tournament.bracket.length - 1;
    const finalMatch = tournament.bracket[finalRoundIdx][0];
    const maxSetsFinal = tournament.setsConfig.final;

    const champion = getMatchWinner(finalMatch, maxSetsFinal);
    const runnerUp = getMatchLoser(finalMatch, maxSetsFinal);

    let thirdPlace = "-";
    const tm = tournament.thirdPlaceMatch;
    if (tm) {
        const winner3rd = getMatchWinner(tm, tournament.setsConfig.third4th);
        if (winner3rd) thirdPlace = winner3rd;
    }

    if (champion && runnerUp) {
        el1.innerText = champion;
        el2.innerText = runnerUp;
        el3.innerText = thirdPlace;
        box.style.display = "block";
    } else {
        box.style.display = "none";
    }
}

function renderScoreInputsHTML(setsArray, maxSets, onChangeCallbackStr) {
    let html = `<div class="score-container-multi">`;
    for (let s = 0; s < maxSets; s++) {
        const v1 = setsArray[s].s1 !== null ? setsArray[s].s1 : '';
        const v2 = setsArray[s].s2 !== null ? setsArray[s].s2 : '';
        html += `<input type="number" min="0" placeholder="S${s+1}" class="score-input-multi" value="${v1}" onchange="${onChangeCallbackStr}(${s}, 1, this.value)">`;
    }
    html += `</div>`;
    return html;
}

function renderScoreInputsP2HTML(setsArray, maxSets, onChangeCallbackStr) {
    let html = `<div class="score-container-multi">`;
    for (let s = 0; s < maxSets; s++) {
        const v2 = setsArray[s].s2 !== null ? setsArray[s].s2 : '';
        html += `<input type="number" min="0" placeholder="S${s+1}" class="score-input-multi" value="${v2}" onchange="${onChangeCallbackStr}(${s}, 2, this.value)">`;
    }
    html += `</div>`;
    return html;
}

                    </div>
                `;
                col.appendChild(matchDiv);
            });
            bView.appendChild(col);
        });

        // TERCER Y CUARTO PUESTO
        if (tournament.bracket.length >= 2) {
            const col3 = document.createElement('div');
            col3.className = "round-column";
            col3.innerHTML = `<div class="round-title">3º Y 4º PUESTO</div>`;
            
            const matchDiv = document.createElement('div');
            matchDiv.className = "bracket-match";
            const tm = tournament.thirdPlaceMatch;
            const name1 = tm.p1 ? escapeHTML(tm.p1) : "(Perd. Semifinal)";
            const name2 = tm.p2 ? escapeHTML(tm.p2) : "(Perd. Semifinal)";
            const maxSets34 = tournament.setsConfig.third4th;

            let inputs1HTML = '', inputs2HTML = '';
            if (maxSets34 === 1) {
                inputs1HTML = `<input type="number" min="0" class="score-input" value="${tm.sets[0].s1 !== null ? tm.sets[0].s1 : ''}" ${!tm.p1 || !tm.p2 ? 'disabled' : ''} onchange="updateThirdPlaceScore(0, 1, this.value)">`;
                inputs2HTML = `<input type="number" min="0" class="score-input" value="${tm.sets[0].s2 !== null ? tm.sets[0].s2 : ''}" ${!tm.p1 || !tm.p2 ? 'disabled' : ''} onchange="updateThirdPlaceScore(0, 2, this.value)">`;
            } else {
                inputs1HTML = renderScoreInputsHTML(tm.sets, 3, 'updateThirdPlaceScore');
                inputs2HTML = renderScoreInputsP2HTML(tm.sets, 3, 'updateThirdPlaceScore');
            }
            
            matchDiv.innerHTML = `
                <div class="player-row">
                    <span class="player-name">${name1}</span>
                    ${inputs1HTML}
                </div>
                <div class="player-row">
                    <span class="player-name">${name2}</span>
                    ${inputs2HTML}
                </div>
            `;
            col3.appendChild(matchDiv);
            bView.appendChild(col3);
        }
    }

    actualizarPodio();
}

// ===============================
// NUEVO TORNEO
// ===============================

function nuevoTorneo() {
    const confirmar = confirm(
        "¿Seguro que quieres comenzar un nuevo torneo?\n\nSe borrarán todos los resultados y jugadores actuales."
    );

    if (!confirmar) return;

    localStorage.removeItem("torneoArena2026");

    torneoRef.remove()
        .then(() => {
            location.reload();
        })
        .catch(error => {
            console.error("Error al borrar el torneo compartido de Firebase:", error);
            alert("No se ha podido borrar el torneo compartido. Comprueba la conexión e inténtalo de nuevo.");
        });
}

function escapeHTML(str) {
    if (!str) return "";
    return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

// ===============================
// RECUPERAR TORNEO AL ABRIR
// ===============================

window.addEventListener("load", () => {
    if (cargarTorneo()) {
        document.getElementById('setup-panel').classList.add('hidden');
        document.getElementById('tournament-view').classList.remove('hidden');
        render();
    }

    torneoRef.on('value', snapshot => {
        const remote = snapshot.val();
        const eraLecturaInicial = !firebaseInitialised;
        firebaseInitialised = true;

        if (remote && typeof remote.estado === 'string') {
            const remoteJSON = remote.estado;
            lastRemoteJSON = remoteJSON;

            const localJSON = localStorage.getItem("torneoArena2026");
            if (remoteJSON !== localJSON) {
                try {
                    const estado = JSON.parse(remoteJSON);
                    firebaseApplyingRemote = true;
                    tournament = estado.tournament;

                    if (!tournament.title) tournament.title = "Torneo xxx Club de Tenis Legends Fuentes";
                    if (!tournament.setsConfig) {
                        tournament.setsConfig = { groups: 1, semis: 1, third4th: 1, final: 3 };
                    }
                    if (!tournament.thirdPlaceMatch) {
                        tournament.thirdPlaceMatch = { p1: null, p2: null, sets: [{s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null}] };
                    }
                    if (!Object.prototype.hasOwnProperty.call(tournament, "semifinalA3")) {
                        tournament.semifinalA3 = null;
                    }
                    if (!tournament.bracket) tournament.bracket = [];
                    if (!tournament.groups) tournament.groups = [];

                    document.getElementById('num-groups').value = estado.numGroups ?? document.getElementById('num-groups').value;
                    document.getElementById('qualified-per-group').value = estado.qualified ?? document.getElementById('qualified-per-group').value;
                    document.getElementById('title-display').innerText = tournament.title;

                    localStorage.setItem("torneoArena2026", remoteJSON);
                    document.getElementById('setup-panel').classList.add('hidden');
                    document.getElementById('tournament-view').classList.remove('hidden');
                    render();
                } catch (e) {
                    console.error("Error al aplicar el estado recibido de Firebase:", e);
                } finally {
                    firebaseApplyingRemote = false;
                }
            }

            firebaseReady = true;

            if (pendingFirebaseSave && !firebaseApplyingRemote) {
                pendingFirebaseSave = false;
                guardarTorneo();
            }
        } else {
            firebaseReady = true;

            if (eraLecturaInicial) {
                const localJSON = localStorage.getItem("torneoArena2026");

                if (localJSON) {
                    pendingFirebaseSave = false;
                    torneoRef.set({
                        estado: localJSON,
                        actualizado: firebase.database.ServerValue.TIMESTAMP
                    }).then(() => {
                        lastRemoteJSON = localJSON;
                    }).catch(error => {
                        console.error("Error al publicar el torneo inicial en Firebase:", error);
                    });
                }
            } else {
                localStorage.removeItem("torneoArena2026");
                tournament = {
                    title: "Torneo xxx Club de Tenis Legends Fuentes",
                    groups: [],
                    bracket: [],
                    thirdPlaceMatch: { p1: null, p2: null, sets: [{s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null}] },
                    finalGroup: null,
                    semifinalA3: null,
                    setsConfig: { groups: 1, semis: 1, third4th: 1, final: 3 }
                };
                pendingFirebaseSave = false;
                lastRemoteJSON = null;

                document.getElementById('setup-panel').classList.remove('hidden');
                document.getElementById('tournament-view').classList.add('hidden');
            }
        }
    }, error => {
        console.error("Error de sincronización con Firebase Realtime Database:", error);
        firebaseReady = false;
    });
});
</script>
