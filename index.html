<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
<title>NOCHES EN LA ARENA 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500&display=swap" rel="stylesheet">
<!-- SheetJS para Exportación a Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
    :root {
        --bg-dark: #1e1e1e;
        --clay-primary: #b04a2c;
        --clay-dark: #7a2a16;
        --zinc-700: #3f3f46;
        --zinc-800: #27272a;
        --gold: #e2b05f;
        --silver: #c0c0c0;
        --bronze: #cd7f32;
        --text-gray: #a1a1aa;
    }

    * {
        box-sizing: border-box;
    }

    body {
        background-color: #121212;
        background-image:
            linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
            url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
        color: #ffffff;
        font-family: 'Montserrat', sans-serif;
        margin: 0;
        padding: 20px;
        overflow-x: hidden;
    }

    header {
        text-align: center;
        background: linear-gradient(to right, transparent, rgba(176, 74, 44, 0.2), transparent);
        padding: 20px;
        border-bottom: 1px solid var(--clay-primary);
        margin-bottom: 30px;
    }

    .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }

    .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
    }

    h1 {
        font-family: 'Oswald', sans-serif;
        font-size: 3rem;
        margin: 0;
        letter-spacing: 2px;
        color: #ddd;
    }

    .subtitle {
        color: var(--gold);
        letter-spacing: 4px;
        text-transform: uppercase;
        font-size: 1rem;
    }

    .main-layout {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
    }

    .setup-panel {
        background: var(--zinc-800);
        border-radius: 12px;
        padding: 20px;
        width: 300px;
        border: 1px solid var(--clay-primary);
    }

    .groups-panel {
        flex: 1;
        min-width: 400px;
    }

    .group-card {
        background: #252525;
        border-radius: 8px;
        margin-bottom: 20px;
        border: 1px solid #444;
        overflow: hidden;
    }

    .group-header {
        background: #333;
        padding: 10px;
        color: var(--gold);
        font-weight: bold;
        text-align: center;
        border-bottom: 1px solid var(--clay-primary);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8rem;
    }

    th {
        background: #1a1a1a;
        padding: 8px;
        color: var(--text-gray);
    }

    td {
        padding: 8px;
        text-align: center;
        border-bottom: 1px solid #333;
    }

    .match-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
        border-bottom: 1px solid #222;
        gap: 8px;
    }

    .bracket-container {
        display: flex;
        gap: 30px;
        padding: 20px;
        background: rgba(0,0,0,0.3);
        border-radius: 15px;
        overflow-x: auto;
        position: relative;
        justify-content: flex-start;
    }

    .round-column {
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        gap: 20px;
        position: relative;
        min-width: 320px;
    }

    .round-column.is-final {
        min-width: 320px;
    }

    .round-title {
        text-align: center;
        color: var(--gold);
        font-family: 'Oswald', sans-serif;
        margin-bottom: 10px;
        letter-spacing: 1px;
    }

    .bracket-match {
        width: 320px;
        background: #2a2a2a;
        border-radius: 4px;
        border: 1px solid #444;
        position: relative;
        z-index: 2;
    }

    .round-column.is-final .bracket-match {
        width: 320px;
    }

    .player-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        height: 40px;
    }

    .player-row:first-child {
        border-bottom: 1px solid #333;
    }

    .player-name {
        font-size: 0.85rem;
        font-weight: bold;
        color: #e0e0e0;
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
    }

    .seed-label {
        background: var(--clay-primary);
        font-size: 0.65rem;
        padding: 2px 5px;
        border-radius: 2px;
    }

    .score-input {
        width: 45px;
        background: #000;
        border: 1px solid var(--zinc-700);
        color: var(--gold);
        text-align: center;
        border-radius: 3px;
        height: 28px;
    }

    .score-container-final {
        display: flex;
        gap: 4px;
    }

    .score-input-final {
        width: 32px;
        background: #000;
        border: 1px solid var(--zinc-700);
        color: var(--gold);
        text-align: center;
        border-radius: 3px;
        height: 28px;
        font-size: 0.8rem;
    }

    .score-input-final:focus, .score-input:focus {
        outline: 1px solid var(--gold);
    }

    /* CAMBIO APLICADO: Texto en blanco con opacidad total cuando el input está deshabilitado */
    .score-input-final:disabled, .score-input:disabled {
        background: #1a1a1a;
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
        opacity: 1 !important;
        cursor: not-allowed;
    }

    /* ESTILOS DEL PODIO */
    #podium-box {
        margin-top: 30px;
        padding: 30px;
        background: #252525;
        border: 2px solid var(--gold);
        text-align: center;
        border-radius: 12px;
        display: none;
    }

    .podium-title {
        color: var(--gold);
        font-weight: bold;
        letter-spacing: 2px;
        font-family: 'Oswald', sans-serif;
        font-size: 1.5rem;
        margin-bottom: 25px;
    }

    .podium-container {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 20px;
        padding-top: 20px;
    }

    .podium-step {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 130px;
        transition: transform 0.3s ease;
    }

    .podium-step:hover {
        transform: translateY(-5px);
    }

    .podium-trophy {
        font-size: 3rem;
        margin-bottom: 8px;
        position: relative;
    }

    .podium-trophy::after {
        content: attr(data-pos);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -55%);
        font-size: 0.9rem;
        font-weight: 900;
        font-family: 'Oswald', sans-serif;
        color: #121212;
    }

    .podium-step.first .podium-trophy {
        font-size: 4rem;
    }

    .podium-step.first .podium-trophy::after {
        font-size: 1.1rem;
        top: 52%;
    }

    .podium-name {
        font-size: 0.9rem;
        font-weight: bold;
        color: #fff;
        margin-top: 8px;
        word-break: break-word;
        background: #1a1a1a;
        padding: 6px 10px;
        border-radius: 4px;
        width: 100%;
        border: 1px solid #444;
    }

    .podium-step.first .podium-name {
        border-color: var(--gold);
        color: var(--gold);
    }

    .podium-step.second .podium-name {
        border-color: var(--silver);
    }

    .podium-step.third .podium-name {
        border-color: var(--bronze);
    }

    textarea,
    select,
    input[type="text"],
    input[type="number"] {
        background: #111;
        border: 1px solid #444;
        color: white;
        padding: 8px;
        border-radius: 4px;
        width: 100%;
    }

    button {
        background: var(--clay-primary);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
        text-transform: uppercase;
        transition: 0.2s;
    }

    button:hover {
        background: var(--clay-dark);
    }

    #btnNuevoTorneo, .btn-action {
        width: auto;
        margin-top: 0;
    }

    .btn-admin-active {
        background: #27ae60 !important;
    }

    .hidden {
        display: none !important;
    }

    .config-label {
        font-size: 0.8rem;
        margin-top: 12px;
        display: block;
    }

    .checkbox-container {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        margin-top: 12px;
        cursor: pointer;
    }

    .checkbox-container input {
        width: auto;
        cursor: pointer;
    }

    @media (max-width: 768px) {
        body {
            padding: 10px;
        }
        
        h1 {
            font-size: 1.8rem;
        }
        
        .subtitle {
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .header-top {
            justify-content: center;
        }

        .setup-panel {
            width: 100%;
        }
        
        .groups-panel {
            min-width: 100%;
        }
        
        .match-item {
            font-size: 0.75rem;
            gap: 5px;
        }
        
        .match-item span {
            font-size: 0.7rem !important;
        }
        
        .score-input {
            width: 40px;
            font-size: 0.8rem;
        }
        
        table {
            font-size: 0.7rem;
        }
        
        th, td {
            padding: 5px;
        }
        
        .bracket-container {
            flex-direction: row;
            overflow-x: auto;
            gap: 20px;
            padding: 15px;
        }
        
        .round-column {
            min-width: 280px;
            gap: 15px;
        }
        
        .bracket-match {
            width: 100%;
        }
        
        .round-title {
            font-size: 0.9rem;
        }
        
        .player-name {
            font-size: 0.75rem;
        }
        
        #podium-box {
            padding: 20px;
        }

        .podium-container {
            gap: 10px;
        }

        .podium-step {
            width: 100px;
        }
    }
    
    @media (max-width: 480px) {
        .match-item {
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .player-name {
            font-size: 0.7rem;
        }
        
        .score-input {
            width: 35px;
            height: 30px;
        }
        
        button {
            padding: 10px;
            font-size: 0.85rem;
        }
    }
</style>
</head>

<body>

<header>
    <div class="header-top">
        <div>
            <h1 id="header-title">CLUB DE TENIS LEGENDS FUENTES</h1>
            
        </div>
        <div class="header-actions">
            <button id="btnAdmin" class="btn-action" onclick="toggleAdmin()">🔒 Modo Admin</button>
            <button id="btnExportar" class="btn-action" onclick="exportarExcel()">📊 Exportar Excel</button>
            <button id="btnNuevoTorneo" class="btn-action" onclick="nuevoTorneo()">🏆 Nuevo torneo</button>
        </div>
    </div>
</header>

<div class="main-layout">

    <div id="setup-panel" class="setup-panel">
        <h3 style="margin-top:0;">Configuración</h3>
        
        <label class="config-label">Nombre del Torneo</label>
        <input type="text" id="tournament-name" value="Torneo NOCHES EN LA ARENA 2026 Club de Tenis Legends Fuentes" />

        <label class="config-label">Jugadores (uno por línea)</label>
        <textarea id="player-names" rows="8">Nadal
Djokovic
Alcaraz
Sinner
Federer
Zverev
Ruud
Tsitsipas</textarea>
        
        <label class="checkbox-container">
            <input type="checkbox" id="use-seeds" />
            <span>Cabezas de serie (los primeros N de la lista)</span>
        </label>

        <label class="config-label">Número de Grupos</label>
        <select id="num-groups">
            <option value="1">1 Grupo</option>
            <option value="2">2 Grupos</option>
            <option value="3">3 Grupos</option>
            <option value="4" selected>4 Grupos</option>
            <option value="5">5 Grupos</option>
            <option value="6">6 Grupos</option>
        </select>

        <label class="config-label">Clasificados por Grupo</label>
        <select id="qualified-per-group">
            <option value="1">1 Jugador</option>
            <option value="2" selected>2 Jugadores</option>
            <option value="3">3 Jugadores</option>
        </select>

        <label class="config-label">Formato: Fase de Grupos</label>
        <select id="sets-groups">
            <option value="1" selected>1 Set</option>
            <option value="3">Mejor de 3 Sets</option>
        </select>

        <!-- CAMBIO APLICADO: Selectores de sets separados por cada ronda de eliminatorias -->
        <label class="config-label">Formato: Octavos de Final</label>
        <select id="sets-octavos">
            <option value="1">1 Set</option>
            <option value="3" selected>Mejor de 3 Sets</option>
        </select>

        <label class="config-label">Formato: Cuartos de Final</label>
        <select id="sets-cuartos">
            <option value="1">1 Set</option>
            <option value="3" selected>Mejor de 3 Sets</option>
        </select>

        <label class="config-label">Formato: Semifinales</label>
        <select id="sets-semis">
            <option value="1">1 Set</option>
            <option value="3" selected>Mejor de 3 Sets</option>
        </select>

        <label class="config-label">Formato: 3º y 4º Puesto</label>
        <select id="sets-third">
            <option value="1">1 Set</option>
            <option value="3" selected>Mejor de 3 Sets</option>
        </select>

        <label class="config-label">Formato: Gran Final</label>
        <select id="sets-final">
            <option value="1">1 Set</option>
            <option value="3" selected>Mejor de 3 Sets</option>
        </select>
        
        <button id="btnIniciar" onclick="iniciarTorneo()">Generar Cuadro</button>
    </div>

    <div id="tournament-view" class="hidden" style="width:100%;">
        <div class="main-layout">
            <div id="groups-area" class="groups-panel"></div>
            <div id="bracket-area" style="width:100%;">
                <div id="bracket-view" class="bracket-container"></div>
                <div id="podium-box">
                    <div class="podium-title">PODIO FINAL DEL TORNEO</div>
                    <div class="podium-container">
                        <div class="podium-step second">
                            <div class="podium-trophy" data-pos="2º">🏆</div>
                            <div style="font-size:0.75rem; color:var(--silver);">2º PUESTO</div>
                            <div id="podium-2" class="podium-name">-</div>
                        </div>
                        <div class="podium-step first">
                            <div class="podium-trophy" data-pos="1º">🏆</div>
                            <div style="font-size:0.75rem; color:var(--gold);">CAMPEÓN</div>
                            <div id="podium-1" class="podium-name">-</div>
                        </div>
                        <div class="podium-step third">
                            <div class="podium-trophy" data-pos="3º">🏆</div>
                            <div style="font-size:0.75rem; color:var(--bronze);">3º PUESTO</div>
                            <div id="podium-3" class="podium-name">-</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>
<script>

// ===============================
// FIREBASE REALTIME DATABASE
// ===============================
const firebaseConfig = {
    apiKey: "AIzaSyChJBr9Sc400fQWAAUbD0GdkemqSen1wco",
    authDomain: "noches-en-la-arena-3.firebaseapp.com",
    databaseURL: "https://noches-en-la-arena-3-default-rtdb.firebaseio.com",
    projectId: "noches-en-la-arena-3",
    storageBucket: "noches-en-la-arena-3.firebasestorage.app",
    messagingSenderId: "61926357219",
    appId: "1:61926357219:web:40f9f362b0d1fc08fc6dd6"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const torneoRef = database.ref("torneoArena2026");
let firebaseReady = false;
let firebaseInitialised = false;
let firebaseApplyingRemote = false;
let pendingFirebaseSave = false;
let lastRemoteJSON = null;

// MODO ADMIN
let isAdmin = false;
const ADMIN_PASS = "1234";

let tournament = {
    name: "Torneo NOCHES EN LA ARENA 2026 Club de Tenis Legends Fuentes",
    groups: [],
    bracket: [],
    thirdPlaceMatch: { p1: null, p2: null, sets: [{s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null}] },
    finalGroup: null,
    semifinalA3: null,
    settings: {
        setsGroups: 1,
        setsOctavos: 3,
        setsCuartos: 3,
        setsSemis: 3,
        setsThird: 3,
        setsFinal: 3
    }
};

function initSetsArray(maxSets) {
    return Array.from({ length: maxSets }, () => ({ s1: null, s2: null }));
}

function updateHeaderTitle() {
    const titleEl = document.getElementById('header-title');
    if (tournament.name) {
        titleEl.innerText = tournament.name;
    }
}

function toggleAdmin() {
    if (isAdmin) {
        isAdmin = false;
        document.getElementById('btnAdmin').innerText = "🔒 Modo Admin";
        document.getElementById('btnAdmin').classList.remove('btn-admin-active');
        render();
    } else {
        const pass = prompt("Ingrese la clave de administrador:");
        if (pass === ADMIN_PASS) {
            isAdmin = true;
            document.getElementById('btnAdmin').innerText = "🔓 Modo Admin Activado";
            document.getElementById('btnAdmin').classList.add('btn-admin-active');
            render();
        } else if (pass !== null) {
            alert("Clave incorrecta");
        }
    }
}

// ===============================
// GUARDADO AUTOMÁTICO
// ===============================

function guardarTorneo() {
    const estado = {
        tournament: tournament,
        numGroups: document.getElementById('num-groups').value,
        qualified: document.getElementById('qualified-per-group').value,
        useSeeds: document.getElementById('use-seeds').checked
    };

    const estadoJSON = JSON.stringify(estado);
    localStorage.setItem("torneoArena2026", estadoJSON);

    if (!firebaseReady) {
        pendingFirebaseSave = true;
        return;
    }

    if (firebaseApplyingRemote) return;

    pendingFirebaseSave = false;
    torneoRef.set({
        estado: estadoJSON,
        actualizado: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
        lastRemoteJSON = estadoJSON;
    }).catch(error => {
        console.error("Error al guardar en Firebase Realtime Database:", error);
    });
}

function cargarTorneo() {
    const datos = localStorage.getItem("torneoArena2026");
    if (!datos) return false;

    try {
        const estado = JSON.parse(datos);
        tournament = estado.tournament;
        if (!tournament.thirdPlaceMatch) {
            tournament.thirdPlaceMatch = { p1: null, p2: null, sets: [{s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null}] };
        }
        if (!tournament.settings) {
            tournament.settings = { setsGroups: 1, setsOctavos: 3, setsCuartos: 3, setsSemis: 3, setsThird: 3, setsFinal: 3 };
        }

        document.getElementById('tournament-name').value = tournament.name || "Torneo NOCHES EN LA ARENA 2026 Club de Tenis Legends Fuentes";
        document.getElementById('num-groups').value = estado.numGroups;
        document.getElementById('qualified-per-group').value = estado.qualified;
        document.getElementById('use-seeds').checked = !!estado.useSeeds;
        document.getElementById('sets-groups').value = tournament.settings.setsGroups || 1;
        document.getElementById('sets-octavos').value = tournament.settings.setsOctavos || 3;
        document.getElementById('sets-cuartos').value = tournament.settings.setsCuartos || 3;
        document.getElementById('sets-semis').value = tournament.settings.setsSemis || 3;
        document.getElementById('sets-third').value = tournament.settings.setsThird || 3;
        document.getElementById('sets-final').value = tournament.settings.setsFinal || 3;

        updateHeaderTitle();
        return true;
    } catch (e) {
        console.error(e);
        return false;
    }
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function iniciarTorneo() {
    if (!isAdmin) {
        alert("Debes activar el Modo Admin para generar un nuevo torneo.");
        return;
    }
    const nameInput = document.getElementById('tournament-name').value.trim();
    tournament.name = nameInput || "Torneo NOCHES EN LA ARENA 2026 Club de Tenis Legends Fuentes";
    updateHeaderTitle();

    const names = document
        .getElementById('player-names')
        .value
        .split('\n')
        .map(n => n.trim())
        .filter(n => n);

    const nGroups = parseInt(document.getElementById('num-groups').value);
    const qualified = parseInt(document.getElementById('qualified-per-group').value);
    const useSeeds = document.getElementById('use-seeds').checked;

    tournament.settings = {
        setsGroups: parseInt(document.getElementById('sets-groups').value),
        setsOctavos: parseInt(document.getElementById('sets-octavos').value),
        setsCuartos: parseInt(document.getElementById('sets-cuartos').value),
        setsSemis: parseInt(document.getElementById('sets-semis').value),
        setsThird: parseInt(document.getElementById('sets-third').value),
        setsFinal: parseInt(document.getElementById('sets-final').value)
    };

    if (names.length < nGroups) {
        alert(`Debes ingresar al menos ${nGroups} jugadores para ${nGroups} grupos.`);
        return;
    }

    tournament.groups = Array.from({ length: nGroups }, (_, i) => ({
        id: String.fromCharCode(65 + i),
        players: [],
        matches: []
    }));

    let seeds = [];
    let rest = [];

    if (useSeeds) {
        seeds = names.slice(0, nGroups);
        rest = names.slice(nGroups);
    } else {
        rest = [...names];
    }

    shuffle(rest);

    seeds.forEach((seed, i) => {
        tournament.groups[i].players.push({
            name: seed,
            won: 0,
            gf: 0,
            gc: 0,
            diff: 0
        });
    });

    rest.forEach((player, i) => {
        const targetGroupIndex = (seeds.length + i) % nGroups;
        tournament.groups[targetGroupIndex].players.push({
            name: player,
            won: 0,
            gf: 0,
            gc: 0,
            diff: 0
        });
    });

    tournament.groups.forEach(group => {
        const maxSets = tournament.settings.setsGroups;
        for (let i = 0; i < group.players.length; i++) {
            for (let j = i + 1; j < group.players.length; j++) {
                group.matches.push({
                    p1: group.players[i].name,
                    p2: group.players[j].name,
                    sets: initSetsArray(maxSets)
                });
            }
        }
    });

    tournament.bracket = [];
    tournament.thirdPlaceMatch = { p1: null, p2: null, sets: initSetsArray(tournament.settings.setsThird) };
    tournament.finalGroup = null;
    tournament.semifinalA3 = null;

    render();

    document.getElementById('setup-panel').classList.add('hidden');
    document.getElementById('tournament-view').classList.remove('hidden');

    guardarTorneo();
}

function isMatchFinished(match, maxSets) {
    if (!match || !match.sets) return false;
    const required = maxSets === 1 ? 1 : 2;
    let w1 = 0, w2 = 0;
    for (let s = 0; s < match.sets.length; s++) {
        const v1 = match.sets[s].s1;
        const v2 = match.sets[s].s2;
        if (v1 !== null && v2 !== null) {
            if (v1 > v2) w1++;
            else if (v2 > v1) w2++;
            if (w1 === required || w2 === required) return true;
        }
    }
    return false;
}

function getMatchWinnerLoser(match, maxSets) {
    if (!match || !match.sets) return { winner: null, loser: null };
    const required = maxSets === 1 ? 1 : 2;
    let w1 = 0, w2 = 0;
    for (let s = 0; s < match.sets.length; s++) {
        const v1 = match.sets[s].s1;
        const v2 = match.sets[s].s2;
        if (v1 !== null && v2 !== null) {
            if (v1 > v2) w1++;
            else if (v2 > v1) w2++;
            if (w1 === required) return { winner: match.p1, loser: match.p2 };
            if (w2 === required) return { winner: match.p2, loser: match.p1 };
        }
    }
    return { winner: null, loser: null };
}

// FUNCIÓN AUXILIAR PARA OBTENER LOS SETS SEGÚN LA RONDA
function getSetsForRound(rIdx, totalRounds) {
    const diff = totalRounds - rIdx;
    if (diff === 1) return tournament.settings.setsFinal;
    if (diff === 2) return tournament.settings.setsSemis;
    if (diff === 3) return tournament.settings.setsCuartos;
    return tournament.settings.setsOctavos;
}

// CAMBIO APLICADO: Detección si un partido de 3 sets se resuelve en 2-0 para deshabilitar Set 3
function isSet3Disabled(sets) {
    if (!sets || sets.length < 2) return false;
    const s11 = sets[0].s1, s12 = sets[0].s2;
    const s21 = sets[1].s1, s22 = sets[1].s2;
    if (s11 !== null && s12 !== null && s21 !== null && s22 !== null) {
        if ((s11 > s12 && s21 > s22) || (s12 > s11 && s22 > s21)) {
            return true;
        }
    }
    return false;
}

function updateGroupScore(gIdx, mIdx, inputElement) {
    if (!isAdmin) return;
    const match = tournament.groups[gIdx].matches[mIdx];
    const maxSets = tournament.settings.setsGroups;
    const matchDiv = inputElement.closest('.match-item');

    if (maxSets === 1) {
        const inputs = matchDiv.querySelectorAll('.score-input');
        const s1Val = inputs[0].value === "" ? null : parseInt(inputs[0].value);
        const s2Val = inputs[1].value === "" ? null : parseInt(inputs[1].value);

        if ((s1Val !== null && (isNaN(s1Val) || s1Val < 0)) || (s2Val !== null && (isNaN(s2Val) || s2Val < 0))) {
            alert("No se permiten puntuaciones negativas");
            render();
            return;
        }
        match.sets[0].s1 = s1Val;
        match.sets[0].s2 = s2Val;
    } else {
        const rows = matchDiv.querySelectorAll('.score-container-final');
        const inputsP1 = rows[0].querySelectorAll('.score-input-final');
        const inputsP2 = rows[1].querySelectorAll('.score-input-final');

        for (let s = 0; s < 3; s++) {
            const v1Val = inputsP1[s].value !== "" ? parseInt(inputsP1[s].value) : null;
            const v2Val = inputsP2[s].value !== "" ? parseInt(inputsP2[s].value) : null;

            if ((v1Val !== null && (isNaN(v1Val) || v1Val < 0)) || (v2Val !== null && (isNaN(v2Val) || v2Val < 0))) {
                alert("Puntuación inválida");
                render();
                return;
            }
            match.sets[s].s1 = v1Val;
            match.sets[s].s2 = v2Val;
        }
    }

    const group = tournament.groups[gIdx];
    group.players.forEach(player => { player.won = 0; player.gf = 0; player.gc = 0; player.diff = 0; });

    group.matches.forEach(m => {
        let p1W = 0, p2W = 0;
        m.sets.forEach(st => {
            if (st.s1 !== null && st.s2 !== null) {
                const p1 = group.players.find(p => p.name === m.p1);
                const p2 = group.players.find(p => p.name === m.p2);
                p1.gf += st.s1; p1.gc += st.s2;
                p2.gf += st.s2; p2.gc += st.s1;
                if (st.s1 > st.s2) p1W++;
                else if (st.s2 > st.s1) p2W++;
            }
        });
        const req = maxSets === 1 ? 1 : 2;
        if (p1W === req) group.players.find(p => p.name === m.p1).won++;
        else if (p2W === req) group.players.find(p => p.name === m.p2).won++;

        group.players.forEach(p => p.diff = p.gf - p.gc);
    });

    group.players.sort((a, b) => b.won - a.won || b.diff - a.diff || b.gf - a.gf);

    checkKnockoutStart();
    guardarTorneo();
    render();
}

function checkKnockoutStart() {
    const setsG = tournament.settings.setsGroups;
    const allDone = tournament.groups.every(group =>
        group.matches.every(match => isMatchFinished(match, setsG))
    );
    
    if (allDone && tournament.bracket.length === 0 && !tournament.finalGroup && !tournament.semifinalA3) {
        const qualifiedCount = parseInt(document.getElementById('qualified-per-group').value);
        let qualifiedList = [];

        tournament.groups.forEach(group => {
            for (let i = 0; i < qualifiedCount; i++) {
                if (group.players[i]) {
                    qualifiedList.push({
                        name: group.players[i].name,
                        label: `${group.id}${i + 1}`
                    });
                }
            }
        });

        const totalQ = qualifiedList.length;
        if (totalQ === 0) return;

        if (tournament.groups.length === 3 && qualifiedCount === 2 && totalQ === 6) {
            const a = qualifiedList;
            tournament.semifinalA3 = {
                matches: [
                    { p1: a[0].name, p2: a[3].name, label1: a[0].label, label2: a[3].label, sets: initSetsArray(tournament.settings.setsSemis) },
                    { p1: a[2].name, p2: a[5].name, label1: a[2].label, label2: a[5].label, sets: initSetsArray(tournament.settings.setsSemis) },
                    { p1: a[4].name, p2: a[1].name, label1: a[4].label, label2: a[1].label, sets: initSetsArray(tournament.settings.setsSemis) }
                ]
            };
            return;
        }

        if (totalQ === 3) {
            let players = qualifiedList.map(p => ({ name: p.name, won: 0, gf: 0, gc: 0, diff: 0 }));
            let matches = [];
            for (let i = 0; i < players.length; i++) {
                for (let j = i + 1; j < players.length; j++) {
                    matches.push({ p1: players[i].name, p2: players[j].name, sets: initSetsArray(tournament.settings.setsFinal) });
                }
            }
            tournament.finalGroup = { players, matches };
            return;
        }

        if (totalQ === 2) {
            tournament.bracket = [[
                {
                    p1: qualifiedList[0].name,
                    p2: qualifiedList[1].name,
                    label1: qualifiedList[0].label,
                    label2: qualifiedList[1].label,
                    sets: initSetsArray(tournament.settings.setsFinal)
                }
            ]];
            return;
        }

        let targetSize = 2;
        while (targetSize < totalQ) {
            targetSize *= 2;
        }

        let firstRound = [];
        let numMatches = targetSize / 2;

        let totalRoundsTemp = Math.log2(targetSize);
        let firstRoundSets = getSetsForRound(0, totalRoundsTemp);

        for (let i = 0; i < numMatches; i++) {
            let p1Obj = qualifiedList[i] || null;
            let p2Obj = qualifiedList[targetSize - 1 - i] || null;

            firstRound.push({
                p1: p1Obj ? p1Obj.name : null,
                p2: p2Obj ? p2Obj.name : null,
                label1: p1Obj ? p1Obj.label : "BYE",
                label2: p2Obj ? p2Obj.label : "BYE",
                sets: initSetsArray(firstRoundSets)
            });
        }

        tournament.bracket = [firstRound];
        let size = Math.ceil(firstRound.length / 2);
        let currentR = 1;

        while (size >= 1) {
            const setsCount = getSetsForRound(currentR, totalRoundsTemp);
            tournament.bracket.push(
                Array.from({ length: size }, () => ({
                    p1: null, p2: null,
                    sets: initSetsArray(setsCount)
                }))
            );
            if (size === 1) break;
            size = Math.ceil(size / 2);
            currentR++;
        }
    }
}

function updateSemifinalLosers() {
    if (tournament.bracket.length < 2) return;
    const semiRoundIdx = tournament.bracket.length - 2;
    const semis = tournament.bracket[semiRoundIdx];
    const maxSets = tournament.settings.setsSemis;

    let losers = [];
    if (semis && semis.length === 2) {
        semis.forEach(semi => {
            const res = getMatchWinnerLoser(semi, maxSets);
            losers.push(res.loser);
        });
    } else {
        losers = [null, null];
    }

    tournament.thirdPlaceMatch.p1 = losers[0];
    tournament.thirdPlaceMatch.p2 = losers[1];
    if (!losers[0] || !losers[1]) {
        tournament.thirdPlaceMatch.sets = initSetsArray(tournament.settings.setsThird);
    }
}

function updateBracketScore(rIdx, mIdx, inputElement) {
    if (!isAdmin) return;
    const matchDiv = inputElement.closest('.bracket-match');
    const match = tournament.bracket[rIdx][mIdx];
    const maxSets = getSetsForRound(rIdx, tournament.bracket.length);

    if (maxSets === 1) {
        const inputs = matchDiv.querySelectorAll('.score-input');
        match.sets[0].s1 = inputs[0].value !== "" ? parseInt(inputs[0].value) : null;
        match.sets[0].s2 = inputs[1].value !== "" ? parseInt(inputs[1].value) : null;
    } else {
        const rows = matchDiv.querySelectorAll('.player-row');
        const inputsP1 = rows[0].querySelectorAll('.score-input-final');
        const inputsP2 = rows[1].querySelectorAll('.score-input-final');

        for (let s = 0; s < 3; s++) {
            match.sets[s].s1 = inputsP1[s].value !== "" ? parseInt(inputsP1[s].value) : null;
            match.sets[s].s2 = inputsP2[s].value !== "" ? parseInt(inputsP2[s].value) : null;
        }
    }

    const res = getMatchWinnerLoser(match, maxSets);
    const finalizado = isMatchFinished(match, maxSets);

    if (finalizado && rIdx < tournament.bracket.length - 1) {
        const nextMatchIdx = Math.floor(mIdx / 2);
        const nextMatch = tournament.bracket[rIdx + 1][nextMatchIdx];
        if (mIdx % 2 === 0) nextMatch.p1 = res.winner;
        else nextMatch.p2 = res.winner;
    } else if (!finalizado && rIdx < tournament.bracket.length - 1) {
        limpiarAdelante(rIdx, mIdx);
    }

    updateSemifinalLosers();
    guardarTorneo();
    render();
}

function limpiarAdelante(rIdx, mIdx) {
    if (rIdx >= tournament.bracket.length - 1) return;
    const nextMatchIdx = Math.floor(mIdx / 2);
    const nextMatch = tournament.bracket[rIdx + 1][nextMatchIdx];
    if (mIdx % 2 === 0) nextMatch.p1 = null;
    else nextMatch.p2 = null;

    const nextMaxSets = getSetsForRound(rIdx + 1, tournament.bracket.length);
    nextMatch.sets = initSetsArray(nextMaxSets);

    limpiarAdelante(rIdx + 1, nextMatchIdx);
}

function actualizarPodio() {
    const box = document.getElementById('podium-box');
    const el1 = document.getElementById('podium-1');
    const el2 = document.getElementById('podium-2');
    const el3 = document.getElementById('podium-3');

    if (tournament.finalGroup) {
        const fg = tournament.finalGroup;
        const maxSets = tournament.settings.setsFinal;
        const allMatchesDone = fg.matches.every(m => isMatchFinished(m, maxSets));
        if (allMatchesDone && fg.players.length === 3) {
            el1.innerText = fg.players[0].name;
            el2.innerText = fg.players[1].name;
            el3.innerText = fg.players[2].name;
            box.style.display = "block";
        } else {
            box.style.display = "none";
        }
        return;
    }

    if (tournament.bracket.length === 0) {
        box.style.display = "none";
        return;
    }

    const finalRoundIdx = tournament.bracket.length - 1;
    const finalMatch = tournament.bracket[finalRoundIdx][0];
    const finalRes = getMatchWinnerLoser(finalMatch, tournament.settings.setsFinal);
    const finalDone = isMatchFinished(finalMatch, tournament.settings.setsFinal);

    let thirdPlace = "-";
    const tmRes = getMatchWinnerLoser(tournament.thirdPlaceMatch, tournament.settings.setsThird);
    if (isMatchFinished(tournament.thirdPlaceMatch, tournament.settings.setsThird)) {
        thirdPlace = tmRes.winner;
    }

    if (finalDone && finalRes.winner && finalRes.loser) {
        el1.innerText = finalRes.winner;
        el2.innerText = finalRes.loser;
        el3.innerText = thirdPlace;
        box.style.display = "block";
    } else {
        box.style.display = "none";
    }

// ===============================
// EXPORTACIÓN A EXCEL (.XLSX)
// ===============================
function exportarExcel() {
    if (tournament.groups.length === 0) {
        alert("No hay ningún torneo activo para exportar.");
        return;
    }

    const { ranking, maxScorer } = calcularEstadisticasGlobales();
    const wb = XLSX.utils.book_new();

    // Hoja 1: Ranking General y Estadísticas
    const rankingRows = ranking.map((p, idx) => ({
        "Posición": idx + 1,
        "Jugador": p.name,
        "Partidos Jugados (PJ)": p.pj,
        "Partidos Ganados (PG)": p.pg,
        "Partidos Perdidos (PP)": p.pp,
        "Juegos a Favor (JF)": p.jf,
        "Juegos en Contra (JC)": p.jc,
        "Diferencia Juegos": p.diff
    }));

    if (maxScorer) {
        rankingRows.push({});
        rankingRows.push({
            "Posición": "⭐ MÁXIMO ANOTADOR DE JUEGOS",
            "Jugador": maxScorer.name,
            "Juegos a Favor (JF)": maxScorer.jf
        });
    }

    const wsRanking = XLSX.utils.json_to_sheet(rankingRows);
    XLSX.utils.book_append_sheet(wb, wsRanking, "Ranking y Stats");

    // Hoja 2: Resultados de Grupos
    const gruposRows = [];
    tournament.groups.forEach(g => {
        gruposRows.push({ "Grupo / Partido": `--- GRUPO ${g.id} ---` });
        g.matches.forEach(m => {
            gruposRows.push({
                "Grupo / Partido": `${m.p1} vs ${m.p2}`,
                "Resultado": (m.s1 !== null && m.s2 !== null) ? `${m.s1} - ${m.s2}` : "Pendiente"
            });
        });
    });
    const wsGrupos = XLSX.utils.json_to_sheet(gruposRows);
    XLSX.utils.book_append_sheet(wb, wsGrupos, "Resultados Grupos");

    XLSX.writeFile(wb, "Torneo_Noches_En_La_Arena_2026.xlsx");
}

// NUEVO TORNEO
// ===============================

function nuevoTorneo() {
    if (!isAdmin) {
        alert("Debes activar el Modo Admin para reiniciar el torneo.");
        return;
    }

    const confirmar = confirm(
        "¿Seguro que quieres comenzar un nuevo torneo?\n\nSe borrarán todos los resultados y jugadores actuales."
    );

    if (!confirmar) return;

    localStorage.removeItem("torneoArena2026");

    torneoRef.remove()
        .then(() => {
            location.reload();
        })
        .catch(error => {
            console.error("Error al borrar el torneo compartido de Firebase:", error);
            alert("No se ha podido borrar el torneo compartido. Comprueba la conexión e inténtalo de nuevo.");
        });
}

function escapeHTML(str) {
    if (!str) return "";
    return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

// ===============================
// RECUPERAR TORNEO AL ABRIR
// ===============================

window.addEventListener("load", () => {
    if (cargarTorneo()) {
        document.getElementById('setup-panel').classList.add('hidden');
        document.getElementById('tournament-view').classList.remove('hidden');
        render();
    }

    torneoRef.on('value', snapshot => {
        const remote = snapshot.val();
        const eraLecturaInicial = !firebaseInitialised;
        firebaseInitialised = true;

        if (remote && typeof remote.estado === 'string') {
            const remoteJSON = remote.estado;
            lastRemoteJSON = remoteJSON;

            const localJSON = localStorage.getItem("torneoArena2026");
            if (remoteJSON !== localJSON) {
                try {
                    const estado = JSON.parse(remoteJSON);
                    firebaseApplyingRemote = true;
                    tournament = estado.tournament;

                    if (!tournament.thirdPlaceMatch) {
                        tournament.thirdPlaceMatch = { p1: null, p2: null, sets: [{s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null}] };
                    }
                    if (!tournament.settings) {
                        tournament.settings = { setsGroups: 1, setsOctavos: 3, setsCuartos: 3, setsSemis: 3, setsThird: 3, setsFinal: 3 };
                    }
                    if (!Object.prototype.hasOwnProperty.call(tournament, "semifinalA3")) {
                        tournament.semifinalA3 = null;
                    }
                    if (!tournament.bracket) tournament.bracket = [];
                    if (!tournament.groups) tournament.groups = [];

                    document.getElementById('tournament-name').value = tournament.name || "Torneo NOCHES EN LA ARENA 2026 Club de Tenis Legends Fuentes";
                    document.getElementById('num-groups').value = estado.numGroups ?? document.getElementById('num-groups').value;
                    document.getElementById('qualified-per-group').value = estado.qualified ?? document.getElementById('qualified-per-group').value;
                    document.getElementById('use-seeds').checked = !!estado.useSeeds;
                    document.getElementById('sets-groups').value = tournament.settings.setsGroups || 1;
                    document.getElementById('sets-octavos').value = tournament.settings.setsOctavos || 3;
                    document.getElementById('sets-cuartos').value = tournament.settings.setsCuartos || 3;
                    document.getElementById('sets-semis').value = tournament.settings.setsSemis || 3;
                    document.getElementById('sets-third').value = tournament.settings.setsThird || 3;
                    document.getElementById('sets-final').value = tournament.settings.setsFinal || 3;

                    localStorage.setItem("torneoArena2026", remoteJSON);
                    document.getElementById('setup-panel').classList.add('hidden');
                    document.getElementById('tournament-view').classList.remove('hidden');
                    render();
                } catch (e) {
                    console.error("Error al aplicar el estado recibido de Firebase:", e);
                } finally {
                    firebaseApplyingRemote = false;
                }
            }

            firebaseReady = true;

            if (pendingFirebaseSave && !firebaseApplyingRemote) {
                pendingFirebaseSave = false;
                guardarTorneo();
            }
        } else {
            firebaseReady = true;

            if (eraLecturaInicial) {
                const localJSON = localStorage.getItem("torneoArena2026");

                if (localJSON) {
                    pendingFirebaseSave = false;
                    torneoRef.set({
                        estado: localJSON,
                        actualizado: firebase.database.ServerValue.TIMESTAMP
                    }).then(() => {
                        lastRemoteJSON = localJSON;
                    }).catch(error => {
                        console.error("Error al publicar el torneo inicial en Firebase:", error);
                    });
                }
            } else {
                localStorage.removeItem("torneoArena2026");
                tournament = {
                    name: "Torneo NOCHES EN LA ARENA 2026 Club de Tenis Legends Fuentes",
                    groups: [],
                    bracket: [],
                    thirdPlaceMatch: { p1: null, p2: null, sets: [{s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null}] },
                    finalGroup: null,
                    semifinalA3: null,
                    settings: { setsGroups: 1, setsOctavos: 3, setsCuartos: 3, setsSemis: 3, setsThird: 3, setsFinal: 3 }
                };
                pendingFirebaseSave = false;
                lastRemoteJSON = null;

                document.getElementById('setup-panel').classList.remove('hidden');
                document.getElementById('tournament-view').classList.add('hidden');
            }
        }
    }, error => {
        console.error("Error de sincronización con Firebase Realtime Database:", error);
        firebaseReady = false;
    });
});
</script>

</body>
</html>
