<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
<title>NOCHES EN LA ARENA 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-dark: #1e1e1e;
        --clay-primary: #b04a2c;
        --clay-dark: #7a2a16;
        --zinc-700: #3f3f46;
        --zinc-800: #27272a;
        --gold: #e2b05f;
        --silver: #c0c0c0;
        --bronze: #cd7f32;
        --text-gray: #a1a1aa;
    }

    * { box-sizing: border-box; }

    body {
        background-color: #121212;
        background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
        color: #ffffff;
        font-family: 'Montserrat', sans-serif;
        margin: 0;
        padding: 20px;
        overflow-x: hidden;
    }

    header {
        text-align: center;
        background: linear-gradient(to right, transparent, rgba(176, 74, 44, 0.2), transparent);
        padding: 20px;
        border-bottom: 1px solid var(--clay-primary);
        margin-bottom: 30px;
    }

    h1 {
        font-family: 'Oswald', sans-serif;
        font-size: 3rem;
        margin: 0;
        letter-spacing: 2px;
        color: #ddd;
    }

    .subtitle {
        color: var(--gold);
        letter-spacing: 4px;
        text-transform: uppercase;
        font-size: 1rem;
    }

    .main-layout {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
    }

    .setup-panel {
        background: var(--zinc-800);
        border-radius: 12px;
        padding: 20px;
        width: 300px;
        border: 1px solid var(--clay-primary);
    }

    .groups-panel {
        flex: 1;
        min-width: 400px;
    }

    .group-card {
        background: #252525;
        border-radius: 8px;
        margin-bottom: 20px;
        border: 1px solid #444;
        overflow: hidden;
    }

    .group-header {
        background: #333;
        padding: 10px;
        color: var(--gold);
        font-weight: bold;
        text-align: center;
        border-bottom: 1px solid var(--clay-primary);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8rem;
    }

    th {
        background: #1a1a1a;
        padding: 8px;
        color: var(--text-gray);
    }

    td {
        padding: 8px;
        text-align: center;
        border-bottom: 1px solid #333;
    }

    .match-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
        border-bottom: 1px solid #222;
        gap: 8px;
    }

    .bracket-container {
        display: flex;
        gap: 30px;
        padding: 20px;
        background: rgba(0,0,0,0.3);
        border-radius: 15px;
        overflow-x: auto;
        position: relative;
        justify-content: flex-start;
    }

    .round-column {
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        gap: 20px;
        position: relative;
        min-width: 220px;
    }

    .round-column.is-final { min-width: 320px; }

    .round-title {
        text-align: center;
        color: var(--gold);
        font-family: 'Oswald';
        margin-bottom: 10px;
        letter-spacing: 1px;
    }

    .bracket-match {
        width: 220px;
        background: #2a2a2a;
        border-radius: 4px;
        border: 1px solid #444;
        position: relative;
        z-index: 2;
    }

    .round-column.is-final .bracket-match { width: 320px; }

    .player-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        height: 40px;
    }

    .player-row:first-child { border-bottom: 1px solid #333; }

    .player-name {
        font-size: 0.85rem;
        font-weight: bold;
        color: #e0e0e0;
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
    }

    .seed-label {
        background: var(--clay-primary);
        font-size: 0.65rem;
        padding: 2px 5px;
        border-radius: 2px;
    }

    .score-input {
        width: 45px;
        background: #000;
        border: 1px solid var(--zinc-700);
        color: var(--gold);
        text-align: center;
        border-radius: 3px;
        height: 28px;
    }

    .score-container-final { display: flex; gap: 4px; }

    .score-input-final {
        width: 32px;
        background: #000;
        border: 1px solid var(--zinc-700);
        color: var(--gold);
        text-align: center;
        border-radius: 3px;
        height: 28px;
        font-size: 0.8rem;
    }

    #podium-box {
        margin-top: 30px;
        padding: 30px;
        background: #252525;
        border: 2px solid var(--gold);
        text-align: center;
        border-radius: 12px;
        display: none;
    }

    .podium-title {
        color: var(--gold);
        font-weight: bold;
        letter-spacing: 2px;
        font-family: 'Oswald';
        font-size: 1.5rem;
        margin-bottom: 25px;
    }

    .podium-container {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 20px;
        padding-top: 20px;
    }

    .podium-step {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 130px;
    }

    .podium-trophy { font-size: 3rem; margin-bottom: 8px; position: relative; }
    .podium-trophy::after {
        content: attr(data-pos);
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -55%);
        font-size: 0.9rem;
        font-weight: 900;
        font-family: 'Oswald';
        color: #121212;
    }

    .podium-step.first .podium-trophy { font-size: 4rem; }
    .podium-step.first .podium-trophy::after { font-size: 1.1rem; top: 52%; }

    .podium-name {
        font-size: 0.9rem;
        font-weight: bold;
        color: #fff;
        margin-top: 8px;
        background: #1a1a1a;
        padding: 6px 10px;
        border-radius: 4px;
        width: 100%;
        border: 1px solid #444;
    }

    .podium-step.first .podium-name { border-color: var(--gold); color: var(--gold); }
    .podium-step.second .podium-name { border-color: var(--silver); }
    .podium-step.third .podium-name { border-color: var(--bronze); }

    textarea, select, input[type="number"] {
        background: #111;
        border: 1px solid #444;
        color: white;
        padding: 8px;
        border-radius: 4px;
        width: 100%;
    }

    button {
        background: var(--clay-primary);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
        text-transform: uppercase;
    }

    button:hover { background: var(--clay-dark); }
    .hidden { display: none; }

    @media (max-width: 768px) {
        body { padding: 10px; }
        h1 { font-size: 1.8rem; }
        .setup-panel, .groups-panel { width: 100%; min-width: 100%; }
        .bracket-container { flex-direction: column; gap: 20px; padding: 15px; }
        .round-column { min-width: 100%; }
        .bracket-match { width: 100%; }
    }
</style>
</head>

<body>

<header>
    <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto;">
        <div style="text-align: left;">
            <h1>NOCHES EN LA ARENA 2026</h1>
            <div class="subtitle">Club de Tenis Legends Fuentes</div>
        </div>
        <button onclick="nuevoTorneo()" style="width: auto; padding: 8px 15px;">🏆 Nuevo torneo</button>
    </div>
</header>

<div class="main-layout">
    <div id="setup-panel" class="setup-panel">
        <h3 style="margin-top:0;">Configuración</h3>
        <label style="font-size:0.8rem;">Jugadores (uno por línea)</label>
        <textarea id="player-names" rows="10">Nadal\nDjokovic\nAlcaraz\nSinner\nFederer\nZverev\nRuud\nTsitsipas</textarea>
        
        <label style="font-size:0.8rem; margin-top:15px; display:block;">Número de Grupos</label>
        <select id="num-groups">
            <option value="1">1 Grupo</option>
            <option value="2">2 Grupos</option>
            <option value="3">3 Grupos</option>
            <option value="4" selected>4 Grupos</option>
            <option value="5">5 Grupos</option>
            <option value="6">6 Grupos</option>
        </select>

        <label style="font-size:0.8rem; margin-top:15px; display:block;">Clasificados por Grupo</label>
        <select id="qualified-per-group">
            <option value="1">1 Jugador</option>
            <option value="2" selected>2 Jugadores</option>
            <option value="3">3 Jugadores</option>
        </select>
        
        <button onclick="iniciarTorneo()">Generar Cuadro</button>
    </div>

    <div id="tournament-view" class="hidden" style="width:100%;">
        <div class="main-layout">
            <div id="groups-area" class="groups-panel"></div>
            <div id="bracket-area" style="width:100%;">
                <div id="bracket-view" class="bracket-container"></div>
                <div id="podium-box">
                    <div class="podium-title">PODIO FINAL DEL TORNEO</div>
                    <div class="podium-container">
                        <div class="podium-step second">
                            <div class="podium-trophy" data-pos="2º">🏆</div>
                            <div style="font-size:0.75rem; color:var(--silver);">2º PUESTO</div>
                            <div id="podium-2" class="podium-name">-</div>
                        </div>
                        <div class="podium-step first">
                            <div class="podium-trophy" data-pos="1º">🏆</div>
                            <div style="font-size:0.75rem; color:var(--gold);">CAMPEÓN</div>
                            <div id="podium-1" class="podium-name">-</div>
                        </div>
                        <div class="podium-step third">
                            <div class="podium-trophy" data-pos="3º">🏆</div>
                            <div style="font-size:0.75rem; color:var(--bronze);">3º PUESTO</div>
                            <div id="podium-3" class="podium-name">-</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAZkMc3Df-NooEDgQl6-X6r226WUQ7cqzE",
        authDomain: "noches-en-la-arena.firebaseapp.com",
        projectId: "noches-en-la-arena",
        storageBucket: "noches-en-la-arena.firebasestorage.app",
        messagingSenderId: "903495284149",
        appId: "1:903495284149:web:d2c45e0bc038c3f16355fc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let tournament = {
        groups: [],
        bracket: [],
        thirdPlaceMatch: { p1: null, p2: null, s1: null, s2: null }
    };

    let syncRemoto = false;

    async function guardarTodo() {
        if (syncRemoto) return;
        try {
            const payload = JSON.parse(JSON.stringify({
                groups: tournament.groups,
                bracket: tournament.bracket,
                thirdPlaceMatch: tournament.thirdPlaceMatch,
                numGroups: document.getElementById('num-groups').value,
                qualified: document.getElementById('qualified-per-group').value
            }));
            await setDoc(doc(db, "torneos", "principal"), payload);
        } catch (err) {
            console.error("Fallo al sincronizar con Firebase:", err);
        }
    }

    function escucharRemoto() {
        onSnapshot(doc(db, "torneos", "principal"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                syncRemoto = true;
                tournament.groups = data.groups || [];
                tournament.bracket = data.bracket || [];
                tournament.thirdPlaceMatch = data.thirdPlaceMatch || { p1: null, p2: null, s1: null, s2: null };
                
                document.getElementById('num-groups').value = data.numGroups || 4;
                document.getElementById('qualified-per-group').value = data.qualified || 2;

                document.getElementById('setup-panel').classList.add('hidden');
                document.getElementById('tournament-view').classList.remove('hidden');

                render();
                syncRemoto = false;
            } else {
                document.getElementById('setup-panel').classList.remove('hidden');
                document.getElementById('tournament-view').classList.add('hidden');
            }
        });
    }

    window.iniciarTorneo = async function() {
        const names = document.getElementById('player-names').value.split('\n').map(n => n.trim()).filter(n => n);
        const nGroups = parseInt(document.getElementById('num-groups').value);
        const qualified = parseInt(document.getElementById('qualified-per-group').value);

        if (names.length < nGroups * qualified) {
            alert(`Mínimo ${nGroups * qualified} jugadores necesarios.`);
            return;
        }

        for (let i = names.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [names[i], names[j]] = [names[j], names[i]];
        }

        tournament.groups = Array.from({ length: nGroups }, (_, i) => ({
            id: String.fromCharCode(65 + i),
            players: [],
            matches: []
        }));

        names.forEach((name, i) => {
            tournament.groups[i % nGroups].players.push({ name, won: 0, gf: 0, gc: 0, diff: 0 });
        });

        tournament.groups.forEach(g => {
            for (let i = 0; i < g.players.length; i++) {
                for (let j = i + 1; j < g.players.length; j++) {
                    g.matches.push({ p1: g.players[i].name, p2: g.players[j].name, s1: null, s2: null });
                }
            }
        });

        tournament.bracket = [];
        tournament.thirdPlaceMatch = { p1: null, p2: null, s1: null, s2: null };

        document.getElementById('setup-panel').classList.add('hidden');
        document.getElementById('tournament-view').classList.remove('hidden');

        render();
        await guardarTodo();
    }

    window.nuevoTorneo = async function() {
        if (confirm("¿Borrar el torneo actual y crear uno nuevo?")) {
            await deleteDoc(doc(db, "torneos", "principal"));
            document.getElementById('setup-panel').classList.remove('hidden');
            document.getElementById('tournament-view').classList.add('hidden');
        }
    }

    window.updateGroupScore = async function(gIdx, mIdx, inputElement) {
        const matchDiv = inputElement.closest('.match-item');
        const inputs = matchDiv.querySelectorAll('.score-input');
        const s1 = inputs[0].value !== "" ? parseInt(inputs[0].value) : null;
        const s2 = inputs[1].value !== "" ? parseInt(inputs[1].value) : null;

        tournament.groups[gIdx].matches[mIdx].s1 = (s1 >= 0) ? s1 : null;
        tournament.groups[gIdx].matches[mIdx].s2 = (s2 >= 0) ? s2 : null;

        const group = tournament.groups[gIdx];
        group.players.forEach(p => { p.won = 0; p.gf = 0; p.gc = 0; p.diff = 0; });

        group.matches.forEach(m => {
            if (m.s1 !== null && m.s2 !== null) {
                const p1 = group.players.find(p => p.name === m.p1);
                const p2 = group.players.find(p => p.name === m.p2);
                p1.gf += m.s1; p1.gc += m.s2;
                p2.gf += m.s2; p2.gc += m.s1;
                if (m.s1 > m.s2) p1.won++;
                else if (m.s2 > m.s1) p2.won++;
                p1.diff = p1.gf - p1.gc;
                p2.diff = p2.gf - p2.gc;
            }
        });

        group.players.sort((a, b) => b.won - a.won || b.diff - a.diff || b.gf - a.gf);

        verificarFaseGruposTerminada();
        render();
        await guardarTodo();
    }

    function verificarFaseGruposTerminada() {
        const terminado = tournament.groups.every(g => g.matches.every(m => m.s1 !== null && m.s2 !== null));
        if (terminado && tournament.bracket.length === 0) {
            const qualified = parseInt(document.getElementById('qualified-per-group').value);
            let firstRound = [];

            for (let g = 0; g < tournament.groups.length; g += 2) {
                const gA = tournament.groups[g];
                const gB = tournament.groups[g + 1];
                if (gA && gB) {
                    if (gA.players[0] && gB.players[qualified - 1]) {
                        firstRound.push({ p1: gA.players[0].name, p2: gB.players[qualified - 1].name, s1: null, s2: null, label1: gA.id+"1", label2: gB.id+qualified });
                    }
                    if (qualified >= 2 && gA.players[1] && gB.players[0]) {
                        firstRound.push({ p1: gA.players[1].name, p2: gB.players[0].name, s1: null, s2: null, label1: gA.id+"2", label2: gB.id+"1" });
                    }
                }
            }

            if (firstRound.length > 0) {
                tournament.bracket = [firstRound];
                let size = Math.ceil(firstRound.length / 2);
                while (size >= 1) {
                    const isFinal = (size === 1);
                    tournament.bracket.push(Array.from({ length: size }, () => isFinal ? {
                        p1: null, p2: null, sets: [{s1:null,s2:null},{s1:null,s2:null},{s1:null,s2:null}]
                    } : { p1: null, p2: null, s1: null, s2: null }));
                    if (size === 1) break;
                    size = Math.ceil(size / 2);
                }
            }
        }
    }

    window.updateBracketScore = async function(rIdx, mIdx, inputElement) {
        const isFinal = (tournament.bracket.length - rIdx === 1);
        const matchDiv = inputElement.closest('.bracket-match');
        const match = tournament.bracket[rIdx][mIdx];

        if (isFinal) {
            if (!match.sets) match.sets = [{s1:null,s2:null},{s1:null,s2:null},{s1:null,s2:null}];
            const rows = matchDiv.querySelectorAll('.player-row');
            const inP1 = rows[0].querySelectorAll('.score-input-final');
            const inP2 = rows[1].querySelectorAll('.score-input-final');
            
            let w1 = 0, w2 = 0;
            for (let s = 0; s < 3; s++) {
                let v1 = inP1[s].value !== "" ? parseInt(inP1[s].value) : null;
                let v2 = inP2[s].value !== "" ? parseInt(inP2[s].value) : null;
                match.sets[s].s1 = v1; match.sets[s].s2 = v2;
                if (v1 !== null && v2 !== null) {
                    if (v1 > v2) w1++; else if (v2 > v1) w2++;
                    if (w1 === 2 || w2 === 2) break;
                } else break;
            }
        } else {
            const inputs = matchDiv.querySelectorAll('.score-input');
            const s1 = inputs[0].value !== "" ? parseInt(inputs[0].value) : null;
            const s2 = inputs[1].value !== "" ? parseInt(inputs[1].value) : null;
            match.s1 = s1; match.s2 = s2;

            if (match.s1 !== null && match.s2 !== null && match.s1 !== match.s2) {
                let winner = match.s1 > match.s2 ? match.p1 : match.p2;
                let nextIdx = Math.floor(mIdx / 2);
                let nextMatch = tournament.bracket[rIdx + 1][nextIdx];
                if (mIdx % 2 === 0) nextMatch.p1 = winner; else nextMatch.p2 = winner;
            }
        }

        actualizarPerdedoresSemifinal();
        render();
        await guardarTodo();
    }

    function actualizarPerdedoresSemifinal() {
        if (tournament.bracket.length < 2) return;
        const semis = tournament.bracket[tournament.bracket.length - 2];
        let perdedores = [null, null];
        semis.forEach((semi, idx) => {
            if (semi.s1 !== null && semi.s2 !== null && semi.s1 !== semi.s2) {
                perdedores[idx] = semi.s1 < semi.s2 ? semi.p1 : semi.p2;
            }
        });
        tournament.thirdPlaceMatch.p1 = perdedores[0];
        tournament.thirdPlaceMatch.p2 = perdedores[1];
    }

    window.updateThirdPlaceScore = async function(inputElement) {
        const inputs = inputElement.closest('.bracket-match').querySelectorAll('.score-input');
        tournament.thirdPlaceMatch.s1 = inputs[0].value !== "" ? parseInt(inputs[0].value) : null;
        tournament.thirdPlaceMatch.s2 = inputs[1].value !== "" ? parseInt(inputs[1].value) : null;
        render();
        await guardarTodo();
    }

    function render() {
        const groupsArea = document.getElementById('groups-area');
        groupsArea.innerHTML = '';

        tournament.groups.forEach((g, gIdx) => {
            let html = `<div class="group-card"><div class="group-header">GRUPO ${g.id}</div><table><thead><tr><th style="text-align:left;">Jugador</th><th>G</th><th>GF</th><th>GC</th><th>Dif</th></tr></thead><tbody>`;
            g.players.forEach(p => {
                html += `<tr><td style="text-align:left; font-weight:bold;">${p.name}</td><td>${p.won}</td><td>${p.gf}</td><td>${p.gc}</td><td>${p.diff > 0 ? '+' + p.diff : p.diff}</td></tr>`;
            });
            html += `</tbody></table><div style="padding:10px; background:#1e1e1e;">`;
            g.matches.forEach((m, mIdx) => {
                html += `<div class="match-item"><span class="player-name" style="width:35%; text-align:right;">${m.p1}</span><div style="display:flex; gap:4px;"><input type="number" class="score-input" value="${m.s1 !== null ? m.s1 : ''}" onchange="updateGroupScore(${gIdx}, ${mIdx}, this)"><span>-</span><input type="number" class="score-input" value="${m.s2 !== null ? m.s2 : ''}" onchange="updateGroupScore(${gIdx}, ${mIdx}, this)"></div><span class="player-name" style="width:35%; text-align:left;">${m.p2}</span></div>`;
            });
            html += `</div></div>`;
            groupsArea.insertAdjacentHTML('beforeend', html);
        });

        const bracketView = document.getElementById('bracket-view');
        bracketView.innerHTML = '';

        if (tournament.bracket.length > 0) {
            const nombresRondas = ["Octavos", "Cuartos", "Semifinales", "Gran Final"];
            tournament.bracket.forEach((round, rIdx) => {
                const isFinal = (rIdx === tournament.bracket.length - 1);
                let col = document.createElement('div');
                col.className = `round-column ${isFinal ? 'is-final' : ''}`;
                let titulo = isFinal ? "GRAN FINAL" : (nombresRondas[nombresRondas.length - tournament.bracket.length + rIdx] || `Ronda ${rIdx + 1}`);
                
                let html = `<div class="round-title">${titulo}</div>`;
                round.forEach((match, mIdx) => {
                    html += `<div class="bracket-match">`;
                    if (isFinal) {
                        if (!match.sets) match.sets = [{s1:null,s2:null},{s1:null,s2:null},{s1:null,s2:null}];
                        let sets1 = '', sets2 = '';
                        for (let s = 0; s < 3; s++) {
                            sets1 += `<input type="number" class="score-input-final" value="${match.sets[s].s1 !== null ? match.sets[s].s1 : ''}" onchange="updateBracketScore(${rIdx}, ${mIdx}, this)">`;
                            sets2 += `<input type="number" class="score-input-final" value="${match.sets[s].s2 !== null ? match.sets[s].s2 : ''}" onchange="updateBracketScore(${rIdx}, ${mIdx}, this)">`;
                        }
                        html += `<div class="player-row"><span class="player-name">${match.p1 || 'Por definir'}</span><div class="score-container-final">${sets1}</div></div><div class="player-row"><span class="player-name">${match.p2 || 'Por definir'}</span><div class="score-container-final">${sets2}</div></div>`;
                    } else {
                        html += `<div class="player-row"><span class="player-name">${match.label1 ? `<span class="seed-label">${match.label1}</span>` : ''} ${match.p1 || 'Por definir'}</span><input type="number" class="score-input" value="${match.s1 !== null ? match.s1 : ''}" onchange="updateBracketScore(${rIdx}, ${mIdx}, this)"></div>`;
                        html += `<div class="player-row"><span class="player-name">${match.label2 ? `<span class="seed-label">${match.label2}</span>` : ''} ${match.p2 || 'Por definir'}</span><input type="number" class="score-input" value="${match.s2 !== null ? match.s2 : ''}" onchange="updateBracketScore(${rIdx}, ${mIdx}, this)"></div>`;
                    }
                    html += `</div>`;
                });
                col.innerHTML = html;
                bracketView.appendChild(col);
            });

            if (tournament.bracket.length >= 2) {
                let tm = tournament.thirdPlaceMatch;
                let thirdCol = document.createElement('div');
                thirdCol.className = 'round-column';
                thirdCol.innerHTML = `<div class="round-title">3º PUESTO</div><div class="bracket-match"><div class="player-row"><span class="player-name">${tm.p1 || 'Perdedor Semi 1'}</span><input type="number" class="score-input" value="${tm.s1 !== null ? tm.s1 : ''}" onchange="updateThirdPlaceScore(this)"></div><div class="player-row"><span class="player-name">${tm.p2 || 'Perdedor Semi 2'}</span><input type="number" class="score-input" value="${tm.s2 !== null ? tm.s2 : ''}" onchange="updateThirdPlaceScore(this)"></div></div>`;
                bracketView.appendChild(thirdCol);
            }
        }

        actualizarPodio();
    }

    function actualizarPodio() {
        const box = document.getElementById('podium-box');
        if (tournament.bracket.length === 0) { box.style.display = "none"; return; }
        const finalMatch = tournament.bracket[tournament.bracket.length - 1][0];
        
        let c1 = 0, c2 = 0, fin = false;
        if (finalMatch && finalMatch.sets) {
            for (let s = 0; s < 3; s++) {
                let v1 = finalMatch.sets[s].s1, v2 = finalMatch.sets[s].s2;
                if (v1 !== null && v2 !== null) {
                    if (v1 > v2) c1++; else if (v2 > v1) c2++;
                    if (c1 === 2 || c2 === 2) { fin = true; break; }
                } else break;
            }
        }

        let tm = tournament.thirdPlaceMatch;
        let terceroOk = (tm.p1 && tm.p2 && tm.s1 !== null && tm.s2 !== null && tm.s1 !== tm.s2);

        if (fin && terceroOk) {
            document.getElementById('podium-1').textContent = c1 === 2 ? finalMatch.p1 : finalMatch.p2;
            document.getElementById('podium-2').textContent = c1 === 2 ? finalMatch.p2 : finalMatch.p1;
            document.getElementById('podium-3').textContent = tm.s1 > tm.s2 ? tm.p1 : tm.p2;
            box.style.display = "block";
        } else {
            box.style.display = "none";
        }
    }

    escucharRemoto();
</script>

</body>
</html>
