<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
<title id="page-title">NOCHES EN LA ARENA 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-dark: #1e1e1e;
        --clay-primary: #b04a2c;
        --clay-dark: #7a2a16;
        --zinc-700: #3f3f46;
        --zinc-800: #27272a;
        --gold: #e2b05f;
        --silver: #c0c0c0;
        --bronze: #cd7f32;
        --text-gray: #a1a1aa;
    }

    * {
        box-sizing: border-box;
    }

    body {
        background-color: #121212;
        background-image:
            linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
            url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
        color: #ffffff;
        font-family: 'Montserrat', sans-serif;
        margin: 0;
        padding: 20px;
        overflow-x: hidden;
    }

    header {
        text-align: center;
        background: linear-gradient(to right, transparent, rgba(176, 74, 44, 0.2), transparent);
        padding: 20px;
        border-bottom: 1px solid var(--clay-primary);
        margin-bottom: 30px;
    }

    .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }

    h1 {
        font-family: 'Oswald', sans-serif;
        font-size: 3rem;
        margin: 0;
        letter-spacing: 2px;
        color: #ddd;
    }

    .subtitle {
        color: var(--gold);
        letter-spacing: 4px;
        text-transform: uppercase;
        font-size: 1rem;
    }

    .main-layout {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
    }

    .setup-panel {
        background: var(--zinc-800);
        border-radius: 12px;
        padding: 20px;
        width: 320px;
        border: 1px solid var(--clay-primary);
    }

    .groups-panel {
        flex: 1;
        min-width: 400px;
    }

    .group-card {
        background: #252525;
        border-radius: 8px;
        margin-bottom: 20px;
        border: 1px solid #444;
        overflow: hidden;
    }

    .group-header {
        background: #333;
        padding: 10px;
        color: var(--gold);
        font-weight: bold;
        text-align: center;
        border-bottom: 1px solid var(--clay-primary);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8rem;
    }

    th {
        background: #1a1a1a;
        padding: 8px;
        color: var(--text-gray);
    }

    td {
        padding: 8px;
        text-align: center;
        border-bottom: 1px solid #333;
    }

    .match-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
        border-bottom: 1px solid #222;
        gap: 8px;
    }

    .bracket-container {
        display: flex;
        gap: 30px;
        padding: 20px;
        background: rgba(0,0,0,0.3);
        border-radius: 15px;
        overflow-x: auto;
        position: relative;
        justify-content: flex-start;
    }

    .round-column {
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        gap: 20px;
        position: relative;
        min-width: 220px;
    }

    .round-column.is-final, .round-column.multi-set {
        min-width: 320px;
    }

    .round-title {
        text-align: center;
        color: var(--gold);
        font-family: 'Oswald', sans-serif;
        margin-bottom: 10px;
        letter-spacing: 1px;
    }

    .bracket-match {
        width: 220px;
        background: #2a2a2a;
        border-radius: 4px;
        border: 1px solid #444;
        position: relative;
        z-index: 2;
    }

    .round-column.is-final .bracket-match, .round-column.multi-set .bracket-match {
        width: 320px;
    }

    .player-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        min-height: 40px;
    }

    .player-row:first-child {
        border-bottom: 1px solid #333;
    }

    .player-name {
        font-size: 0.85rem;
        font-weight: bold;
        color: #e0e0e0;
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
    }

    .seed-label {
        background: var(--clay-primary);
        font-size: 0.65rem;
        padding: 2px 5px;
        border-radius: 2px;
    }

    .score-input {
        width: 45px;
        background: #000;
        border: 1px solid var(--zinc-700);
        color: var(--gold);
        text-align: center;
        border-radius: 3px;
        height: 28px;
    }

    .score-container-multi {
        display: flex;
        gap: 4px;
    }

    .score-input-multi {
        width: 32px;
        background: #000;
        border: 1px solid var(--zinc-700);
        color: var(--gold);
        text-align: center;
        border-radius: 3px;
        height: 28px;
        font-size: 0.8rem;
    }

    .score-input-multi:focus, .score-input:focus {
        outline: 1px solid var(--gold);
    }

    .score-input-multi:disabled, .score-input:disabled {
        background: #1a1a1a;
        color: #555;
        cursor: not-allowed;
    }

    /* ESTILOS DEL PODIO */
    #podium-box {
        margin-top: 30px;
        padding: 30px;
        background: #252525;
        border: 2px solid var(--gold);
        text-align: center;
        border-radius: 12px;
        display: none;
    }

    .podium-title {
        color: var(--gold);
        font-weight: bold;
        letter-spacing: 2px;
        font-family: 'Oswald', sans-serif;
        font-size: 1.5rem;
        margin-bottom: 25px;
    }

    .podium-container {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 20px;
        padding-top: 20px;
    }

    .podium-step {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 130px;
        transition: transform 0.3s ease;
    }

    .podium-step:hover {
        transform: translateY(-5px);
    }

    .podium-trophy {
        font-size: 3rem;
        margin-bottom: 8px;
        position: relative;
    }

    .podium-trophy::after {
        content: attr(data-pos);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -55%);
        font-size: 0.9rem;
        font-weight: 900;
        font-family: 'Oswald', sans-serif;
        color: #121212;
    }

    .podium-step.first .podium-trophy {
        font-size: 4rem;
    }

    .podium-step.first .podium-trophy::after {
        font-size: 1.1rem;
        top: 52%;
    }

    .podium-name {
        font-size: 0.9rem;
        font-weight: bold;
        color: #fff;
        margin-top: 8px;
        word-break: break-word;
        background: #1a1a1a;
        padding: 6px 10px;
        border-radius: 4px;
        width: 100%;
        border: 1px solid #444;
    }

    .podium-step.first .podium-name {
        border-color: var(--gold);
        color: var(--gold);
    }

    .podium-step.second .podium-name {
        border-color: var(--silver);
    }

    .podium-step.third .podium-name {
        border-color: var(--bronze);
    }

    textarea,
    select,
    input[type="text"],
    input[type="number"] {
        background: #111;
        border: 1px solid #444;
        color: white;
        padding: 8px;
        border-radius: 4px;
        width: 100%;
    }

    .checkbox-container {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 15px;
        font-size: 0.8rem;
        cursor: pointer;
    }

    .checkbox-container input[type="checkbox"] {
        width: auto;
        cursor: pointer;
    }

    button {
        background: var(--clay-primary);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        margin-top: 15px;
        text-transform: uppercase;
        transition: 0.2s;
    }

    button:hover {
        background: var(--clay-dark);
    }

    #btnNuevoTorneo {
        width: auto;
        margin-top: 0;
    }

    .hidden {
        display: none !important;
    }

    @media (max-width: 768px) {
        body {
            padding: 10px;
        }
        
        h1 {
            font-size: 1.8rem;
        }
        
        .subtitle {
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .header-top {
            justify-content: center;
        }

        .setup-panel {
            width: 100%;
        }
        
        .groups-panel {
            min-width: 100%;
        }
        
        .match-item {
            font-size: 0.75rem;
            gap: 5px;
        }
        
        .match-item span {
            font-size: 0.7rem !important;
        }
        
        .score-input {
            width: 40px;
            font-size: 0.8rem;
        }

        .score-input-multi {
            width: 28px;
            font-size: 0.75rem;
        }
        
        table {
            font-size: 0.7rem;
        }
        
        th, td {
            padding: 5px;
        }
        
        .bracket-container {
            flex-direction: row;
            overflow-x: auto;
            gap: 20px;
            padding: 15px;
        }
        
        .round-column {
            min-width: 200px;
            gap: 15px;
        }

        .round-column.is-final, .round-column.multi-set {
            min-width: 260px;
        }
        
        .bracket-match {
            width: 100%;
        }

        .round-column.is-final .bracket-match, .round-column.multi-set .bracket-match {
            width: 260px;
        }
        
        .round-title {
            font-size: 0.9rem;
        }
        
        .player-name {
            font-size: 0.75rem;
        }
        
        #podium-box {
            padding: 20px;
        }

        .podium-container {
            gap: 10px;
        }

        .podium-step {
            width: 100px;
        }
    }
    
    @media (max-width: 480px) {
        .match-item {
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .player-name {
            font-size: 0.7rem;
        }
        
        .score-input {
            width: 35px;
            height: 30px;
        }

        .score-input-multi {
            width: 26px;
            height: 28px;
        }
        
        button {
            padding: 10px;
            font-size: 0.85rem;
        }
    }
</style>
</head>

<body>

<header>
    <div class="header-top">
        <div>
            <h1 id="tournament-title">Torneo NOCHES EN LA ARENA 2026</h1>
            <div class="subtitle">Club de Tenis Legends Fuentes</div>

<div class="main-layout">

    <div id="setup-panel" class="setup-panel">

        <label style="font-size:0.8rem;">Nombre del Torneo</label>
        <input type="text" id="tournament-name-input" value="Torneo NOCHES EN LA ARENA 2026 Club de Tenis Legends Fuentes" placeholder="Nombre del torneo">

        <label style="font-size:0.8rem; margin-top:12px; display:block;">Jugadores (uno por línea)</label>
        <textarea id="player-names" rows="8">Nadal
Djokovic
Alcaraz
Sinner
Federer
Zverev
Ruud
Tsitsipas</textarea>
        
        <label style="font-size:0.8rem; margin-top:12px; display:block;">Número de Grupos</label>

        </select>
        
        <button onclick="iniciarTorneo()">Generar Cuadro</button>
    </div>

    <div id="tournament-view" class="hidden" style="width:100%;">
        <div class="main-layout">
            <div id="groups-area" class="groups-panel"></div>
            <div id="bracket-area" style="width:100%;">
                <div id="bracket-view" class="bracket-container"></div>
                <div id="podium-box">
                    <div class="podium-title">PODIO FINAL DEL TORNEO</div>
                    <div class="podium-container">
                        <div class="podium-step second">
                            <div class="podium-trophy" data-pos="2º">🏆</div>
                            <div style="font-size:0.75rem; color:var(--silver);">2º PUESTO</div>
                            <div id="podium-2" class="podium-name">-</div>
                        </div>
                        <div class="podium-step first">
                            <div class="podium-trophy" data-pos="1º">🏆</div>
                            <div style="font-size:0.75rem; color:var(--gold);">CAMPEÓN</div>
                            <div id="podium-1" class="podium-name">-</div>
                        </div>
                        <div class="podium-step third">
                            <div class="podium-trophy" data-pos="3º">🏆</div>
                            <div style="font-size:0.75rem; color:var(--bronze);">3º PUESTO</div>
                            <div id="podium-3" class="podium-name">-</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>
<script>

// ===============================
// FIREBASE REALTIME DATABASE
// ===============================
const firebaseConfig = {
    apiKey: "AIzaSyChJBr9Sc400fQWAAUbD0GdkemqSen1wco",
    authDomain: "noches-en-la-arena-3.firebaseapp.com",
    databaseURL: "https://noches-en-la-arena-3-default-rtdb.firebaseio.com",
    projectId: "noches-en-la-arena-3",
    storageBucket: "noches-en-la-arena-3.firebasestorage.app",
    messagingSenderId: "61926357219",
    appId: "1:61926357219:web:40f9f362b0d1fc08fc6dd6"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const torneoRef = database.ref("torneoArena2026");
let firebaseReady = false;
let firebaseInitialised = false;
let firebaseApplyingRemote = false;
let pendingFirebaseSave = false;
let lastRemoteJSON = null;

let tournament = {
    name: "Torneo NOCHES EN LA ARENA 2026 Club de Tenis Legends Fuentes",
    groups: [],
    bracket: [],
    thirdPlaceMatch: { p1: null, p2: null, s1: null, s2: null, sets: [{s1:null,s2:null},{s1:null,s2:null},{s1:null,s2:null}] },
    finalGroup: null, // Para cuando hay 3 clasificados (Triangular Final)
    semifinalA3: null, // Para 3 grupos con 2 clasificados por grupo
    phaseSets: {
        groups: 1,
        knockout: 1,
        third: 1,
        final: 3
    }
};

// HELPER: Inicializa el objeto Match según el número de sets de la fase
function createMatchObj(p1, p2, maxSets, label1 = null, label2 = null) {
    if (maxSets === 3) {
        return {
            p1, p2, label1, label2,
            sets: [{s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null}]
        };
    } else {
        return {
            p1, p2, label1, label2,
            s1: null, s2: null
        };
    }
}

// HELPER: Evalúa el ganador de un partido (soporta 1 Set o 3 Sets)
function evaluateMatchWinner(match, maxSets) {
    if (!match.p1 || !match.p2) return null;

    if (maxSets === 3) {
        if (!match.sets) return null;
        let p1Won = 0, p2Won = 0;
        for (let s = 0; s < 3; s++) {
            const v1 = match.sets[s].s1;
            const v2 = match.sets[s].s2;
            if (v1 !== null && v2 !== null && v1 !== v2) {
                if (v1 > v2) p1Won++; else p2Won++;
                if (p1Won === 2) return { winner: match.p1, loser: match.p2 };
                if (p2Won === 2) return { winner: match.p2, loser: match.p1 };
            }
        }
        return null;
    } else {
        if (match.s1 !== null && match.s2 !== null && match.s1 !== match.s2) {
            return match.s1 > match.s2 ? { winner: match.p1, loser: match.p2 } : { winner: match.p2, loser: match.p1 };
        }
        return null;
    }
}

// ===============================
// GUARDADO AUTOMÁTICO
// ===============================

function guardarTorneo() {
    const estado = {
        tournament: tournament,
        numGroups: document.getElementById('num-groups').value,
        qualified: document.getElementById('qualified-per-group').value,
        useSeeds: document.getElementById('use-seeds').checked,
        tournamentName: document.getElementById('tournament-name-input').value
    };

    const estadoJSON = JSON.stringify(estado);
    localStorage.setItem("torneoArena2026", estadoJSON);

    if (!firebaseReady) {
        pendingFirebaseSave = true;
        return;
    }

    if (firebaseApplyingRemote) return;

    pendingFirebaseSave = false;
    torneoRef.set({
        estado: estadoJSON,
        actualizado: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
        lastRemoteJSON = estadoJSON;
    }).catch(error => {
        console.error("Error al guardar en Firebase Realtime Database:", error);
    });
}

function cargarTorneo() {
    const datos = localStorage.getItem("torneoArena2026");
    if (!datos) return false;

    try {
        const estado = JSON.parse(datos);
        tournament = estado.tournament;
        
        if (!tournament.thirdPlaceMatch) {
            tournament.thirdPlaceMatch = createMatchObj(null, null, tournament.phaseSets ? tournament.phaseSets.third : 1);
        }
        if (!Object.prototype.hasOwnProperty.call(tournament, "semifinalA3")) {
            tournament.semifinalA3 = null;
        }

        if (!tournament.phaseSets) {
            tournament.phaseSets = { groups: 1, knockout: 1, third: 1, final: 3 };
        }

        if (estado.tournamentName) {
            tournament.name = estado.tournamentName;
        }

        document.getElementById('tournament-name-input').value = tournament.name || "Torneo NOCHES EN LA ARENA 2026 Club de Tenis Legends Fuentes";
        document.getElementById('tournament-title').innerText = tournament.name || "Torneo NOCHES EN LA ARENA 2026 Club de Tenis Legends Fuentes";
        document.getElementById('num-groups').value = estado.numGroups;
        document.getElementById('qualified-per-group').value = estado.qualified;
        if (estado.useSeeds !== undefined) {
            document.getElementById('use-seeds').checked = estado.useSeeds;
        }
        
        document.getElementById('sets-groups').value = tournament.phaseSets.groups;
        document.getElementById('sets-knockout').value = tournament.phaseSets.knockout;
        document.getElementById('sets-third').value = tournament.phaseSets.third;
        document.getElementById('sets-final').value = tournament.phaseSets.final;

        return true;
    } catch (e) {
        console.error(e);
        return false;
    }
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function iniciarTorneo() {
    const names = document
        .getElementById('player-names')
        .value
        .split('\n')
        .map(n => n.trim())
        .filter(n => n);

    const nGroups = parseInt(document.getElementById('num-groups').value);
    const qualified = parseInt(document.getElementById('qualified-per-group').value);
    const useSeeds = document.getElementById('use-seeds').checked;
    const tournamentName = document.getElementById('tournament-name-input').value.trim() || "Torneo NOCHES EN LA ARENA 2026 Club de Tenis Legends Fuentes";

    tournament.name = tournamentName;
    document.getElementById('tournament-title').innerText = tournamentName;

    tournament.phaseSets = {
        groups: parseInt(document.getElementById('sets-groups').value),
        knockout: parseInt(document.getElementById('sets-knockout').value),
        third: parseInt(document.getElementById('sets-third').value),
        final: parseInt(document.getElementById('sets-final').value)
    };

    if (names.length < nGroups * qualified) {
        alert(`Se necesitan al menos ${nGroups * qualified} jugadores (${nGroups} grupos x ${qualified} clasificados). Actual: ${names.length}`);
        return;
    }

    tournament.groups = Array.from({ length: nGroups }, (_, i) => ({
        id: String.fromCharCode(65 + i),
        players: [],
        matches: []
    }));

    let seeds = [];
    let pool = [];

    if (useSeeds && names.length >= nGroups) {
        seeds = names.slice(0, nGroups);
        pool = names.slice(nGroups);
    } else {
        pool = [...names];
    }

    shuffle(pool);

    // Asignar cabezas de serie 1 por grupo
    seeds.forEach((seedName, idx) => {
        tournament.groups[idx].players.push({
            name: seedName,
            won: 0, setsWon: 0, gf: 0, gc: 0, diff: 0, isSeed: true
        });
    });

    // Reparto equitativo asimétrico de los jugadores restantes
    pool.forEach((name, i) => {
        const groupIndex = i % nGroups;
        tournament.groups[groupIndex].players.push({
            name,
            won: 0, setsWon: 0, gf: 0, gc: 0, diff: 0, isSeed: false
        });
    });

    // Generar partidos de cada grupo según el formato de sets seleccionado
    tournament.groups.forEach(group => {
        for (let i = 0; i < group.players.length; i++) {
            for (let j = i + 1; j < group.players.length; j++) {
                group.matches.push(
                    createMatchObj(group.players[i].name, group.players[j].name, tournament.phaseSets.groups)
                );
            }
        }
    });

    tournament.bracket = [];
    tournament.thirdPlaceMatch = createMatchObj(null, null, tournament.phaseSets.third);
    tournament.finalGroup = null;
    tournament.semifinalA3 = null;

    render();

    document.getElementById('setup-panel').classList.add('hidden');
    document.getElementById('tournament-view').classList.remove('hidden');

    guardarTorneo();
}

function updateGroupScore(gIdx, mIdx, inputElement) {
    const maxSets = tournament.phaseSets.groups;
    const match = tournament.groups[gIdx].matches[mIdx];
    const matchDiv = inputElement.closest('.match-item');
    
    if (maxSets === 3) {
        const inputsP1 = matchDiv.querySelectorAll('.score-input-p1');

        if (!match.sets) match.sets = [{s1:null,s2:null},{s1:null,s2:null},{s1:null,s2:null}];

        for (let s = 0; s < 3; s++) {
            const v1 = inputsP1[s].value !== "" ? parseInt(inputsP1[s].value) : null;
            const v2 = inputsP2[s].value !== "" ? parseInt(inputsP2[s].value) : null;

            if ((v1 !== null && (isNaN(v1) || v1 < 0)) || (v2 !== null && (isNaN(v2) || v2 < 0))) {
                alert("Puntuación inválida");
                render();
                return;
            }
            if (v1 !== null && v2 !== null && v1 === v2) {
                alert("No se permite empate en un set");
                render();
                return;
            }
            match.sets[s].s1 = v1;
            match.sets[s].s2 = v2;
        }
    } else {
        const inputs = matchDiv.querySelectorAll('.score-input');
        const s1Val = inputs[0].value === "" ? null : parseInt(inputs[0].value);
        const s2Val = inputs[1].value === "" ? null : parseInt(inputs[1].value);

        if ((s1Val !== null && (isNaN(s1Val) || s1Val < 0)) || (s2Val !== null && (isNaN(s2Val) || s2Val < 0))) {
            alert("Puntuación inválida");
            render();
            return;
        }
        match.s1 = s1Val;
        match.s2 = s2Val;
    }

    // Recalcular clasificación del grupo
    const group = tournament.groups[gIdx];
    group.players.forEach(p => {
        p.won = 0; p.setsWon = 0; p.gf = 0; p.gc = 0; p.diff = 0;
    });

    group.matches.forEach(m => {
        const p1 = group.players.find(p => p.name === m.p1);
        const p2 = group.players.find(p => p.name === m.p2);

        if (maxSets === 3 && m.sets) {
            let p1S = 0, p2S = 0;
            m.sets.forEach(s => {
                if (s.s1 !== null && s.s2 !== null && s.s1 !== s.s2) {
                    p1.gf += s.s1; p1.gc += s.s2;
                    p2.gf += s.s2; p2.gc += s.s1;
                    if (s.s1 > s.s2) p1S++; else p2S++;
                }
            });
            p1.setsWon += p1S; p2.setsWon += p2S;
            if (p1S === 2) p1.won++;
            else if (p2S === 2) p2.won++;
        } else {
            if (m.s1 !== null && m.s2 !== null) {
                p1.gf += m.s1; p1.gc += m.s2;
                p2.gf += m.s2; p2.gc += m.s1;
                if (m.s1 > m.s2) p1.won++;
                else if (m.s2 > m.s1) p2.won++;
            }
        }
        p1.diff = p1.gf - p1.gc;
        p2.diff = p2.gf - p2.gc;
    });

    group.players.sort((a, b) =>
        b.won - a.won ||
        (maxSets === 3 ? (b.setsWon - a.setsWon) : 0) ||
        b.diff - a.diff ||
        b.gf - a.gf
    );

    checkKnockoutStart();
    guardarTorneo();
    render();
}

function checkKnockoutStart() {
    const maxGroupSets = tournament.phaseSets.groups;
    const allDone = tournament.groups.every(group =>
        group.matches.every(match => evaluateMatchWinner(match, maxGroupSets) !== null)
    );
    
    if (allDone && tournament.bracket.length === 0 && !tournament.finalGroup && !tournament.semifinalA3) {
        const qualifiedCount = parseInt(document.getElementById('qualified-per-group').value);
        let qualifiedList = [];

        tournament.groups.forEach(group => {
            for (let i = 0; i < qualifiedCount; i++) {
                if (group.players[i]) {
                    qualifiedList.push({
                        name: group.players[i].name,
                        label: `${group.id}${i + 1}`
                    });
                }
            }
        });

        const totalQ = qualifiedList.length;
        if (totalQ === 0) return;

        // CASO ESPECIAL: 3 GRUPOS + 2 CLASIFICADOS = 6 JUGADORES
        if (tournament.groups.length === 3 && qualifiedCount === 2 && totalQ === 6) {
            const a = qualifiedList;
            const semiSets = tournament.phaseSets.knockout;
            tournament.semifinalA3 = {
                matches: [
                    createMatchObj(a[0].name, a[3].name, semiSets, a[0].label, a[3].label),
                    createMatchObj(a[2].name, a[5].name, semiSets, a[2].label, a[5].label),
                    createMatchObj(a[4].name, a[1].name, semiSets, a[4].label, a[1].label)
                ]
            };
            return;
        }

        // CASO 1: EXACTAMENTE 3 CLASIFICADOS -> TRIANGULAR FINAL
        if (totalQ === 3) {
            let players = qualifiedList.map(p => ({ name: p.name, won: 0, setsWon: 0, gf: 0, gc: 0, diff: 0 }));
            let matches = [];
            for (let i = 0; i < players.length; i++) {
                for (let j = i + 1; j < players.length; j++) {
                    matches.push(createMatchObj(players[i].name, players[j].name, tournament.phaseSets.final));
                }
            }
            tournament.finalGroup = { players, matches };
            return;
        }

        // CASO 2: EXACTAMENTE 2 CLASIFICADOS -> GRAN FINAL DIRECTA
        if (totalQ === 2) {
            tournament.bracket = [[
                createMatchObj(qualifiedList[0].name, qualifiedList[1].name, tournament.phaseSets.final, qualifiedList[0].label, qualifiedList[1].label)
            ]];
            return;
        }

        // CASO 3: 4 O MÁS CLASIFICADOS (ELIMINATORIA)
        let targetSize = 2;
        while (targetSize < totalQ) {
            targetSize *= 2;
        }

        let firstRound = [];
        let numMatches = targetSize / 2;

        for (let i = 0; i < numMatches; i++) {
            let p1Obj = qualifiedList[i] || null;
            let p2Obj = qualifiedList[targetSize - 1 - i] || null;

            firstRound.push(
                createMatchObj(
                    p1Obj ? p1Obj.name : null,
                    p2Obj ? p2Obj.name : null,
                    tournament.phaseSets.knockout,
                    p1Obj ? p1Obj.label : "BYE",
                    p2Obj ? p2Obj.label : "BYE"
                )
            );
        }

        tournament.bracket = [firstRound];
        let size = Math.ceil(firstRound.length / 2);

        while (size >= 1) {
            const isLastRound = (size === 1);
            const setsForRound = isLastRound ? tournament.phaseSets.final : tournament.phaseSets.knockout;

            tournament.bracket.push(
                Array.from({ length: size }, () => createMatchObj(null, null, setsForRound))
            );
            if (size === 1) break;
            size = Math.ceil(size / 2);
        }
    }
}

function updateSemifinalLosers() {
    if (tournament.bracket.length < 2) return;
    const semiRoundIdx = tournament.bracket.length - 2;
    const semis = tournament.bracket[semiRoundIdx];
    const semiSets = tournament.phaseSets.knockout;
    
    let losers = [];
    if (semis && semis.length === 2) {
        semis.forEach(semi => {
            const res = evaluateMatchWinner(semi, semiSets);
            if (res) {
                losers.push(res.loser);
            } else {
                losers.push(null);
            }
        });
    } else {
        losers = [null, null];
    }
    
    tournament.thirdPlaceMatch.p1 = losers[0];
    tournament.thirdPlaceMatch.p2 = losers[1];
    if (!losers[0] || !losers[1]) {
        if (tournament.phaseSets.third === 3) {
            tournament.thirdPlaceMatch.sets = [{s1:null,s2:null},{s1:null,s2:null},{s1:null,s2:null}];
        } else {
            tournament.thirdPlaceMatch.s1 = null;
            tournament.thirdPlaceMatch.s2 = null;
        }
    }
}

function updateBracketScore(rIdx, mIdx, inputElement) {
    const isFinal = (tournament.bracket.length - rIdx === 1);
    const maxSets = isFinal ? tournament.phaseSets.final : tournament.phaseSets.knockout;
    const matchDiv = inputElement.closest('.bracket-match');
    const match = tournament.bracket[rIdx][mIdx];
    
    if (maxSets === 3) {
        if (!match.sets) {
            match.sets = [ {s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null} ];
        }
        
        const rows = matchDiv.querySelectorAll('.player-row');
        const inputsP1 = rows[0].querySelectorAll('.score-input-multi');
        const inputsP2 = rows[1].querySelectorAll('.score-input-multi');
        
        let p1SetsWon = 0;
        let p2SetsWon = 0;
        let finalizado = false;
        
        for (let s = 0; s < 3; s++) {
            const v1Val = inputsP1[s].value !== "" ? parseInt(inputsP1[s].value) : null;
            const v2Val = inputsP2[s].value !== "" ? parseInt(inputsP2[s].value) : null;
            
            if (v1Val !== null && (isNaN(v1Val) || v1Val < 0)) { alert("Número inválido"); inputsP1[s].value = ""; render(); return; }
            if (v2Val !== null && (isNaN(v2Val) || v2Val < 0)) { alert("Número inválido"); inputsP2[s].value = ""; render(); return; }
            
            match.sets[s].s1 = v1Val;
            match.sets[s].s2 = v2Val;
            
            if (v1Val !== null && v2Val !== null) {
                if (v1Val === v2Val) { alert("No puede haber empate en un set"); match.sets[s].s1 = null; match.sets[s].s2 = null; render(); return; }
                if (v1Val > v2Val) p1SetsWon++; else p2SetsWon++;
                
                if (p1SetsWon === 2 || p2SetsWon === 2) {
                    finalizado = true;
                    let winner = p1SetsWon === 2 ? match.p1 : match.p2;
                    if (!isFinal) {
                        const nextMatchIdx = Math.floor(mIdx / 2);
                        const nextMatch = tournament.bracket[rIdx + 1][nextMatchIdx];
                        if (mIdx % 2 === 0) nextMatch.p1 = winner; else nextMatch.p2 = winner;
                    }
                    break;
                }
            } else if (v1Val !== null || v2Val !== null) {
                break;
            }
        }
        
        if (!finalizado && !isFinal) {
            limpiarAdelante(rIdx, mIdx);
        }
        
    } else {
        const inputs = matchDiv.querySelectorAll('.score-input');
        const s1Val = inputs[0] && inputs[0].value !== "" ? parseInt(inputs[0].value) : null;
        const s2Val = inputs[1] && inputs[1].value !== "" ? parseInt(inputs[1].value) : null;
        
        if (s1Val !== null && (isNaN(s1Val) || s1Val < 0)) { alert("Número inválido"); if (inputs[0]) inputs[0].value = ""; render(); return; }
        if (s2Val !== null && (isNaN(s2Val) || s2Val < 0)) { alert("Número inválido"); if (inputs[1]) inputs[1].value = ""; render(); return; }
        
        match.s1 = s1Val;
        match.s2 = s2Val;
        
        if (match.s1 !== null && match.s2 !== null) {
            if (match.s1 === match.s2) {
                alert("No puede haber empate en eliminatorias");
                match.s1 = null; match.s2 = null;
                render();
                return;
            }
            
            let winner = match.s1 > match.s2 ? match.p1 : match.p2;
            if (!isFinal) {
                const nextMatchIdx = Math.floor(mIdx / 2);
                const nextMatch = tournament.bracket[rIdx + 1][nextMatchIdx];
                if (mIdx % 2 === 0) nextMatch.p1 = winner; else nextMatch.p2 = winner;
            }
        } else if (!isFinal) {
            limpiarAdelante(rIdx, mIdx);
        }
    }

    updateSemifinalLosers();
    guardarTorneo();
    render();
}

function limpiarAdelante(rIdx, mIdx) {
    if (rIdx >= tournament.bracket.length - 1) return;
    const nextMatchIdx = Math.floor(mIdx / 2);
    const nextMatch = tournament.bracket[rIdx + 1][nextMatchIdx];
    if (mIdx % 2 === 0) nextMatch.p1 = null;
    else nextMatch.p2 = null;
    
    const nextIsFinal = (tournament.bracket.length - (rIdx + 1) === 1);
    const nextMaxSets = nextIsFinal ? tournament.phaseSets.final : tournament.phaseSets.knockout;

    if (nextMaxSets === 3) {
        nextMatch.sets = [ {s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null} ];
    } else {
        nextMatch.s1 = null;
        nextMatch.s2 = null;
    }
    
    limpiarAdelante(rIdx + 1, nextMatchIdx);
}

function actualizarPodio() {
    const box = document.getElementById('podium-box');
    const el1 = document.getElementById('podium-1');
    const el2 = document.getElementById('podium-2');
    const el3 = document.getElementById('podium-3');

    // CASO 1: TRIANGULAR FINAL
    if (tournament.finalGroup) {
        const fg = tournament.finalGroup;
        const maxSets = tournament.phaseSets.final;
        const allMatchesDone = fg.matches.every(m => evaluateMatchWinner(m, maxSets) !== null);
        if (allMatchesDone && fg.players.length === 3) {
            el1.innerText = fg.players[0].name;
            el2.innerText = fg.players[1].name;
            el3.innerText = fg.players[2].name;
            box.style.display = "block";
        } else {
            box.style.display = "none";
        }
        return;
    }

    if (tournament.bracket.length === 0) {
        box.style.display = "none";
        return;
    }

    // CASO 2: CUADRO ELIMINATORIO
    const finalRoundIdx = tournament.bracket.length - 1;
    const finalMatch = tournament.bracket[finalRoundIdx][0];
    const finalMaxSets = tournament.phaseSets.final;

    let champion = null;
    let runnerUp = null;
    let finalFinished = false;

    if (finalMatch) {
        const res = evaluateMatchWinner(finalMatch, finalMaxSets);
        if (res) {
            finalFinished = true;
            champion = res.winner;
            runnerUp = res.loser;
        }
    }

    let thirdPlace = "-";
    const tm = tournament.thirdPlaceMatch;
    const thirdMaxSets = tournament.phaseSets.third;
    if (tm) {
        const resThird = evaluateMatchWinner(tm, thirdMaxSets);
        if (resThird) {
            thirdPlace = resThird.winner;
        }
    }

    if (finalFinished && champion && runnerUp) {
        el1.innerText = champion;
        el2.innerText = runnerUp;
        el3.innerText = thirdPlace;
        box.style.display = "block";
    } else {
        box.style.display = "none";
    }
}

// ===============================
// NUEVO TORNEO
// ===============================

function nuevoTorneo() {
    const confirmar = confirm(
        "¿Seguro que quieres comenzar un nuevo torneo?\n\nSe borrarán todos los resultados y jugadores actuales."
    );

    if (!confirmar) return;

    localStorage.removeItem("torneoArena2026");

    torneoRef.remove()
        .then(() => {
            location.reload();
        })
        .catch(error => {
            console.error("Error al borrar el torneo compartido de Firebase:", error);
            alert("No se ha podido borrar el torneo compartido. Comprueba la conexión e inténtalo de nuevo.");
        });
}

function escapeHTML(str) {
    if (!str) return "";
    return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

// ===============================
// RECUPERAR TORNEO AL ABRIR
// ===============================

window.addEventListener("load", () => {
    if (cargarTorneo()) {
        document.getElementById('setup-panel').classList.add('hidden');
        document.getElementById('tournament-view').classList.remove('hidden');
        render();
    }

    torneoRef.on('value', snapshot => {
        const remote = snapshot.val();
        const eraLecturaInicial = !firebaseInitialised;
        firebaseInitialised = true;

        if (remote && typeof remote.estado === 'string') {
            const remoteJSON = remote.estado;
            lastRemoteJSON = remoteJSON;

            const localJSON = localStorage.getItem("torneoArena2026");
            if (remoteJSON !== localJSON) {
                try {
                    const estado = JSON.parse(remoteJSON);
                    firebaseApplyingRemote = true;
                    tournament = estado.tournament;

                    if (!tournament.thirdPlaceMatch) {
                        tournament.thirdPlaceMatch = createMatchObj(null, null, tournament.phaseSets ? tournament.phaseSets.third : 1);
                    }
                    if (!Object.prototype.hasOwnProperty.call(tournament, "semifinalA3")) {
                        tournament.semifinalA3 = null;
                    }
                    if (!tournament.bracket) tournament.bracket = [];
                    if (!tournament.groups) tournament.groups = [];
                    if (!tournament.phaseSets) {
                        tournament.phaseSets = { groups: 1, knockout: 1, third: 1, final: 3 };
                    }

                    if (estado.tournamentName) {
                        tournament.name = estado.tournamentName;
                    }

                    document.getElementById('tournament-name-input').value = tournament.name || "Torneo NOCHES EN LA ARENA 2026 Club de Tenis Legends Fuentes";
                    document.getElementById('tournament-title').innerText = tournament.name || "Torneo NOCHES EN LA ARENA 2026 Club de Tenis Legends Fuentes";
                    document.getElementById('num-groups').value = estado.numGroups ?? document.getElementById('num-groups').value;
                    document.getElementById('qualified-per-group').value = estado.qualified ?? document.getElementById('qualified-per-group').value;
                    if (estado.useSeeds !== undefined) {
                        document.getElementById('use-seeds').checked = estado.useSeeds;
                    }

                    document.getElementById('sets-groups').value = tournament.phaseSets.groups;
                    document.getElementById('sets-knockout').value = tournament.phaseSets.knockout;
                    document.getElementById('sets-third').value = tournament.phaseSets.third;
                    document.getElementById('sets-final').value = tournament.phaseSets.final;

                    localStorage.setItem("torneoArena2026", remoteJSON);
                    document.getElementById('setup-panel').classList.add('hidden');
                    document.getElementById('tournament-view').classList.remove('hidden');
                    render();
                } catch (e) {
                    console.error("Error al aplicar el estado recibido de Firebase:", e);
                } finally {
                    firebaseApplyingRemote = false;
                }
            }

            firebaseReady = true;

            if (pendingFirebaseSave && !firebaseApplyingRemote) {
                pendingFirebaseSave = false;
                guardarTorneo();
            }
        } else {
            firebaseReady = true;

            if (eraLecturaInicial) {
                const localJSON = localStorage.getItem("torneoArena2026");

                if (localJSON) {
                    pendingFirebaseSave = false;
                    torneoRef.set({
                        estado: localJSON,
                        actualizado: firebase.database.ServerValue.TIMESTAMP
                    }).then(() => {
                        lastRemoteJSON = localJSON;
                    }).catch(error => {
                        console.error("Error al publicar el torneo inicial en Firebase:", error);
                    });
                }
            } else {
                localStorage.removeItem("torneoArena2026");
                tournament = {
                    name: "Torneo NOCHES EN LA ARENA 2026 Club de Tenis Legends Fuentes",
                    groups: [],
                    bracket: [],
                    thirdPlaceMatch: { p1: null, p2: null, s1: null, s2: null },
                    finalGroup: null,
                    semifinalA3: null,
                    phaseSets: { groups: 1, knockout: 1, third: 1, final: 3 }
                };
                pendingFirebaseSave = false;
                lastRemoteJSON = null;

                document.getElementById('setup-panel').classList.remove('hidden');
                document.getElementById('tournament-view').classList.add('hidden');
            }
        }
    }, error => {
        console.error("Error de sincronización con Firebase Realtime Database:", error);
        firebaseReady = false;
    });
});
</script>

</body>
</html>
