<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Torneo de Pádel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #2c3e50;
            --accent: #27ae60;
            --danger: #e74c3c;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        h1 { margin: 0; font-size: 1.5rem; color: var(--primary); }

        .admin-panel {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { opacity: 0.9; }
        button.admin-btn { background-color: #8e44ad; }
        button.danger-btn { background-color: var(--danger); }
        button.success-btn { background-color: var(--accent); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .admin-on { background-color: #d4edda; color: #155724; }
        .admin-off { background-color: #f8d7da; color: #721c24; }

        .section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Alineación uniforme de partidos */
        .match-card {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            background: #fafafa;
        }

        .match-row {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .match-row:last-child { margin-bottom: 0; }

        .player-name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sets-container {
            display: flex;
            gap: 6px;
        }

        .set-input {
            width: 35px;
            height: 30px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .set-input:disabled {
            background-color: #eef;
            color: #333;
            border-color: #ddd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        th { background-color: #f0f3f5; color: var(--primary); }
        tr:nth-child(even) { background-color: #f9f9f9; }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Torneo de Pádel</h1>
        <div class="admin-panel">
            <span id="admin-status" class="status-badge admin-off">Modo Usuario</span>
            <button id="btn-toggle-admin" class="admin-btn" onclick="toggleAdmin()">Activar Modo Admin</button>
        </div>
    </header>

    <div class="section flex-between">
        <div>
            <strong>Opciones de Torneo</strong>
            <p style="margin: 5px 0 0 0; font-size: 0.85rem; color: #666;">
                Acciones reservadas para el administrador del torneo.
            </p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button id="btn-reset" class="danger-btn" onclick="resetTournament()" disabled>Reiniciar Torneo</button>
            <button id="btn-download" class="success-btn" onclick="downloadExcel()" disabled>Descargar Datos</button>
        </div>
    </div>

    <div class="section">
        <h2>Enfrentamientos (A 3 Sets)</h2>
        <div id="matches-container">
            <!-- Partidos generados dinámicamente -->
        </div>
    </div>

    <div class="section">
        <h2>Clasificación</h2>
        <table>
            <thead>
                <tr>
                    <th>Pos</th>
                    <th>Jugador/Pareja</th>
                    <th>PJ</th>
                    <th>PG</th>
                    <th>PP</th>
                    <th>SF</th>
                    <th>SC</th>
                    <th>JF</th>
                    <th>JC</th>
                    <th>DIF J</th>
                    <th>Pts</th>
                </tr>
            </thead>
            <tbody id="standings-body">
                <!-- Tabla generada dinámicamente -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let isAdmin = false;
    const DEFAULT_PASS = "1234";

    // Datos iniciales de prueba
    let state = {
        players: ["Pareja A", "Pareja B", "Pareja C", "Pareja D"],
        matches: [
            { id: 1, p1: "Pareja A", p2: "Pareja B", sets: [{s1: "", s2: ""}, {s1: "", s2: ""}, {s1: "", s2: ""}], finished: false },
            { id: 2, p1: "Pareja C", p2: "Pareja D", sets: [{s1: "", s2: ""}, {s1: "", s2: ""}, {s1: "", s2: ""}], finished: false },
            { id: 3, p1: "Pareja A", p2: "Pareja C", sets: [{s1: "", s2: ""}, {s1: "", s2: ""}, {s1: "", s2: ""}], finished: false },
            { id: 4, p1: "Pareja B", p2: "Pareja D", sets: [{s1: "", s2: ""}, {s1: "", s2: ""}, {s1: "", s2: ""}], finished: false }
        ]
    };

    function toggleAdmin() {
        if (!isAdmin) {
            const pass = prompt("Introduce la contraseña de administrador:");
            if (pass === DEFAULT_PASS) {
                isAdmin = true;
                document.getElementById("admin-status").textContent = "Modo Admin";
                document.getElementById("admin-status").className = "status-badge admin-on";
                document.getElementById("btn-toggle-admin").textContent = "Salir Modo Admin";
                document.getElementById("btn-reset").disabled = false;
            } else if (pass !== null) {
                alert("Contraseña incorrecta.");
            }
        } else {
            isAdmin = false;
            document.getElementById("admin-status").textContent = "Modo Usuario";
            document.getElementById("admin-status").className = "status-badge admin-off";
            document.getElementById("btn-toggle-admin").textContent = "Activar Modo Admin";
            document.getElementById("btn-reset").disabled = true;
        }
        render();
    }

    function updateScore(matchId, setIdx, playerNum, val) {
        if (!isAdmin) return;
        const match = state.matches.find(m => m.id === matchId);
        if (!match) return;

        const parsedVal = parseInt(val, 10);
        const score = isNaN(parsedVal) ? "" : parsedVal;

        if (playerNum === 1) {
            match.sets[setIdx].s1 = score;
        } else {
            match.sets[setIdx].s2 = score;
        }

        render();
    }

    function calculateStats() {
        const stats = {};
        state.players.forEach(p => {
            stats[p] = { name: p, pj: 0, pg: 0, pp: 0, sf: 0, sc: 0, jf: 0, jc: 0, difJ: 0, pts: 0 };
        });

        let allFinished = true;

        state.matches.forEach(m => {
            let setsP1 = 0;
            let setsP2 = 0;
            let gamesP1 = 0;
            let gamesP2 = 0;
            let played = false;

            m.sets.forEach(s => {
                if (s.s1 !== "" && s.s2 !== "") {
                    played = true;
                    gamesP1 += s.s1;
                    gamesP2 += s.s2;
                    if (s.s1 > s.s2) setsP1++;
                    else if (s.s2 > s.s1) setsP2++;
                }
            });

            if (played) {
                stats[m.p1].pj++;
                stats[m.p2].pj++;
                stats[m.p1].jf += gamesP1;
                stats[m.p1].jc += gamesP2;
                stats[m.p2].jf += gamesP2;
                stats[m.p2].jc += gamesP1;
                stats[m.p1].sf += setsP1;
                stats[m.p1].sc += setsP2;
                stats[m.p2].sf += setsP2;
                stats[m.p2].sc += setsP1;

                if (setsP1 >= 2 || setsP2 >= 2) {
                    if (setsP1 > setsP2) {
                        stats[m.p1].pg++;
                        stats[m.p1].pts += 3;
                        stats[m.p2].pp++;
                    } else {
                        stats[m.p2].pg++;
                        stats[m.p2].pts += 3;
                        stats[m.p1].pp++;
                    }
                }
            } else {
                allFinished = false;
            }
        });

        Object.values(stats).forEach(s => s.difJ = s.jf - s.jc);

        document.getElementById("btn-download").disabled = !(allFinished || (isAdmin && state.matches.some(m => m.sets.some(s => s.s1 !== ""))));

        return Object.values(stats).sort((a, b) => b.pts - a.pts || b.difJ - a.difJ || (b.sf - b.sc) - (a.sf - a.sc));
    }

    function renderMatches() {
        const container = document.getElementById("matches-container");
        container.innerHTML = "";

        state.matches.forEach(m => {
            const card = document.createElement("div");
            card.className = "match-card";

            card.innerHTML = `
                <div class="match-row">
                    <span class="player-name">${m.p1}</span>
                    <div class="sets-container">
                        ${m.sets.map((s, idx) => `
                            <input type="number" min="0" class="set-input" 
                                value="${s.s1}" 
                                ${!isAdmin ? 'disabled' : ''} 
                                onchange="updateScore(${m.id}, ${idx}, 1, this.value)">
                        `).join('')}
                    </div>
                </div>
                <div class="match-row">
                    <span class="player-name">${m.p2}</span>
                    <div class="sets-container">
                        ${m.sets.map((s, idx) => `
                            <input type="number" min="0" class="set-input" 
                                value="${s.s2}" 
                                ${!isAdmin ? 'disabled' : ''} 
                                onchange="updateScore(${m.id}, ${idx}, 2, this.value)">
                        `).join('')}
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function renderStandings(standings) {
        const tbody = document.getElementById("standings-body");
        tbody.innerHTML = "";

        standings.forEach((st, idx) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${idx + 1}</td>
                <td><strong>${st.name}</strong></td>
                <td>${st.pj}</td>
                <td>${st.pg}</td>
                <td>${st.pp}</td>
                <td>${st.sf}</td>
                <td>${st.sc}</td>
                <td>${st.jf}</td>
                <td>${st.jc}</td>
                <td>${st.difJ > 0 ? '+' + st.difJ : st.difJ}</td>
                <td><strong>${st.pts}</strong></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function render() {
        renderMatches();
        const standings = calculateStats();
        renderStandings(standings);
    }

    function resetTournament() {
        if (!isAdmin) return;
        if (confirm("¿Estás seguro de que deseas reiniciar todos los resultados del torneo?")) {
            state.matches.forEach(m => {
                m.sets = [{s1: "", s2: ""}, {s1: "", s2: ""}, {s1: "", s2: ""}];
                m.finished = false;
            });
            render();
        }
    }

    function downloadExcel() {
        const standings = calculateStats();
        
        // Hoja 1: Clasificación
        const standingsData = standings.map((st, i) => ({
            "Posición": i + 1,
            "Equipo/Jugador": st.name,
            "Partidos Jugados": st.pj,
            "Partidos Ganados": st.pg,
            "Partidos Perdidos": st.pp,
            "Sets a Favor": st.sf,
            "Sets en Contra": st.sc,
            "Diferencia Sets": st.sf - st.sc,
            "Juegos a Favor": st.jf,
            "Juegos en Contra": st.jc,
            "Diferencia Juegos": st.difJ,
            "Puntos": st.pts
        }));

        // Hoja 2: Partidos
        const matchesData = state.matches.map(m => {
            const s1 = m.sets[0].s1 !== "" ? `${m.sets[0].s1}-${m.sets[0].s2}` : "-";
            const s2 = m.sets[1].s1 !== "" ? `${m.sets[1].s1}-${m.sets[1].s2}` : "-";
            const s3 = m.sets[2].s1 !== "" ? `${m.sets[2].s1}-${m.sets[2].s2}` : "-";
            return {
                "ID Partido": m.id,
                "Equipo 1": m.p1,
                "Equipo 2": m.p2,
                "Set 1": s1,
                "Set 2": s2,
                "Set 3": s3
            };
        });

        const wb = XLSX.utils.book_new();
        const wsStandings = XLSX.utils.json_to_sheet(standingsData);
        const wsMatches = XLSX.utils.json_to_sheet(matchesData);

        XLSX.utils.book_append_sheet(wb, wsStandings, "Clasificación");
        XLSX.utils.book_append_sheet(wb, wsMatches, "Partidos");

        XLSX.writeFile(wb, "Estadisticas_Torneo_Padel.xlsx");
    }

    // Inicialización
    render();
</script>
</body>
</html>
