<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
<title>NOCHES EN LA ARENA 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500&display=swap" rel="stylesheet">

<!-- MÓDULOS DE FIREBASE EN TIEMPO REAL -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
    :root {
        --bg-dark: #1e1e1e;
        --clay-primary: #b04a2c;
        --clay-dark: #7a2a16;
        --zinc-700: #3f3f46;
        --zinc-800: #27272a;
        --gold: #e2b05f;
        --silver: #c0c0c0;
        --bronze: #cd7f32;
        --text-gray: #a1a1aa;
    }

    * {
        box-sizing: border-box;
    }

    body {
        background-color: #121212;
        background-image:
            linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
            url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
        color: #ffffff;
        font-family: 'Montserrat', sans-serif;
        margin: 0;
        padding: 20px;
        overflow-x: hidden;
    }

    header {
        text-align: center;
        background: linear-gradient(to right, transparent, rgba(176, 74, 44, 0.2), transparent);
        padding: 20px;
        border-bottom: 1px solid var(--clay-primary);
        margin-bottom: 30px;
    }

    .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }

    h1 {
        font-family: 'Oswald', sans-serif;
        font-size: 3rem;
        margin: 0;
        letter-spacing: 2px;
        color: #ddd;
    }

    .subtitle {
        color: var(--gold);
        letter-spacing: 4px;
        text-transform: uppercase;
        font-size: 1rem;
    }

    .main-layout {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
    }

    .setup-panel {
        background: var(--zinc-800);
        border-radius: 12px;
        padding: 20px;
        width: 300px;
        border: 1px solid var(--clay-primary);
    }

    .groups-panel {
        flex: 1;
        min-width: 400px;
    }

    .group-card {
        background: #252525;
        border-radius: 8px;
        margin-bottom: 20px;
        border: 1px solid #444;
        overflow: hidden;
    }

    .group-header {
        background: #333;
        padding: 10px;
        color: var(--gold);
        font-weight: bold;
        text-align: center;
        border-bottom: 1px solid var(--clay-primary);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8rem;
    }

    th {
        background: #1a1a1a;
        padding: 8px;
        color: var(--text-gray);
    }

    td {
        padding: 8px;
        text-align: center;
        border-bottom: 1px solid #333;
    }

    .match-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
        border-bottom: 1px solid #222;
        gap: 8px;
    }

    .bracket-container {
        display: flex;
        gap: 30px;
        padding: 20px;
        background: rgba(0,0,0,0.3);
        border-radius: 15px;
        overflow-x: auto;
        position: relative;
        justify-content: flex-start;
    }

    .round-column {
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        gap: 20px;
        position: relative;
        min-width: 220px;
    }

    .round-column.is-final {
        min-width: 320px;
    }

    .round-title {
        text-align: center;
        color: var(--gold);
        font-family: 'Oswald', sans-serif;
        margin-bottom: 10px;
        letter-spacing: 1px;
    }

    .bracket-match {
        width: 220px;
        background: #2a2a2a;
        border-radius: 4px;
        border: 1px solid #444;
        position: relative;
        z-index: 2;
    }

    .round-column.is-final .bracket-match {
        width: 320px;
    }

    .player-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        height: 40px;
    }

    .player-row:first-child {
        border-bottom: 1px solid #333;
    }

    .player-name {
        font-size: 0.85rem;
        font-weight: bold;
        color: #e0e0e0;
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
    }

    .seed-label {
        background: var(--clay-primary);
        font-size: 0.65rem;
        padding: 2px 5px;
        border-radius: 2px;
    }

    .score-input {
        width: 45px;
        background: #000;
        border: 1px solid var(--zinc-700);
        color: var(--gold);
        text-align: center;
        border-radius: 3px;
        height: 28px;
    }

    .score-container-final {
        display: flex;
        gap: 4px;
    }

    .score-input-final {
        width: 32px;
        background: #000;
        border: 1px solid var(--zinc-700);
        color: var(--gold);
        text-align: center;
        border-radius: 3px;
        height: 28px;
        font-size: 0.8rem;
    }

    .score-input-final:focus, .score-input:focus {
        outline: 1px solid var(--gold);
    }

    .score-input-final:disabled, .score-input:disabled {
        background: #1a1a1a;
        color: #555;
        cursor: not-allowed;
    }

    #podium-box {
        margin-top: 30px;
        padding: 30px;
        background: #252525;
        border: 2px solid var(--gold);
        text-align: center;
        border-radius: 12px;
        display: none;
    }

    .podium-title {
        color: var(--gold);
        font-weight: bold;
        letter-spacing: 2px;
        font-family: 'Oswald', sans-serif;
        font-size: 1.5rem;
        margin-bottom: 25px;
    }

    .podium-container {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 20px;
        padding-top: 20px;
    }

    .podium-step {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 130px;
        transition: transform 0.3s ease;
    }

    .podium-step:hover {
        transform: translateY(-5px);
    }

    .podium-trophy {
        font-size: 3rem;
        margin-bottom: 8px;
        position: relative;
    }

    .podium-trophy::after {
        content: attr(data-pos);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -55%);
        font-size: 0.9rem;
        font-weight: 900;
        font-family: 'Oswald', sans-serif;
        color: #121212;
    }

    .podium-step.first .podium-trophy {
        font-size: 4rem;
    }

    .podium-step.first .podium-trophy::after {
        font-size: 1.1rem;
        top: 52%;
    }

    .podium-name {
        font-size: 0.9rem;
        font-weight: bold;
        color: #fff;
        margin-top: 8px;
        word-break: break-word;
        background: #1a1a1a;
        padding: 6px 10px;
        border-radius: 4px;
        width: 100%;
        border: 1px solid #444;
    }

    .podium-step.first .podium-name {
        border-color: var(--gold);
        color: var(--gold);
    }

    .podium-step.second .podium-name {
        border-color: var(--silver);
    }

    .podium-step.third .podium-name {
        border-color: var(--bronze);
    }

    textarea,
    select,
    input[type="number"] {
        background: #111;
        border: 1px solid #444;
        color: white;
        padding: 8px;
        border-radius: 4px;
        width: 100%;
    }

    button {
        background: var(--clay-primary);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
        text-transform: uppercase;
        transition: 0.2s;
    }

    button:hover {
        background: var(--clay-dark);
    }

    #btnNuevoTorneo {
        width: auto;
        margin-top: 0;
    }

    .hidden {
        display: none !important;
    }

    @media (max-width: 768px) {
        body { padding: 10px; }
        h1 { font-size: 1.8rem; }
        .subtitle { font-size: 0.8rem; letter-spacing: 2px; }
        .header-top { justify-content: center; }
        .setup-panel { width: 100%; }
        .groups-panel { min-width: 100%; }
        .match-item { font-size: 0.75rem; gap: 5px; }
        .match-item span { font-size: 0.7rem !important; }
        .score-input { width: 40px; font-size: 0.8rem; }
        table { font-size: 0.7rem; }
        th, td { padding: 5px; }
        .bracket-container { flex-direction: row; overflow-x: auto; gap: 20px; padding: 15px; }
        .round-column { min-width: 200px; gap: 15px; }
        .bracket-match { width: 100%; }
        .round-title { font-size: 0.9rem; }
        .player-name { font-size: 0.75rem; }
        #podium-box { padding: 20px; }
        .podium-container { gap: 10px; }
        .podium-step { width: 100px; }
    }
    
    @media (max-width: 480px) {
        .match-item { flex-wrap: wrap; justify-content: center; }
        .player-name { font-size: 0.7rem; }
        .score-input { width: 35px; height: 30px; }
        button { padding: 10px; font-size: 0.85rem; }
    }
</style>
</head>

<body>

<header>
    <div class="header-top">
        <div>
            <h1>NOCHES EN LA ARENA 2026</h1>
            <div class="subtitle">Club de Tenis Legends Fuentes</div>
        </div>
        <button id="btnNuevoTorneo" onclick="nuevoTorneo()">
            🏆 Nuevo torneo
        </button>
    </div>
</header>

<div class="main-layout">

    <div id="setup-panel" class="setup-panel">
        <h3 style="margin-top:0;">Configuración</h3>
        <label style="font-size:0.8rem;">Jugadores (uno por línea)</label>
        <textarea id="player-names" rows="10">Nadal
Djokovic
Alcaraz
Sinner
Federer
Zverev
Ruud
Tsitsipas</textarea>
        
        <label style="font-size:0.8rem; margin-top:15px; display:block;">Número de Grupos</label>
        <select id="num-groups">
            <option value="1">1 Grupo</option>
            <option value="2">2 Grupos</option>

            <option value="2" selected>2 Jugadores</option>

        <button onclick="iniciarTorneo()">Generar Cuadro</button>

        <div class="main-layout">

                <div id="podium-box">

                            <div style="font-size:0.75rem; color:var(--silver);">2º PUESTO</div>
                            <div id="podium-2" class="podium-name">-</div>
                        </div>
                        <div class="podium-step first">
                            <div class="podium-trophy" data-pos="1º">🏆</div>
                            <div style="font-size:0.75rem; color:var(--gold);">CAMPEÓN</div>
                            <div id="podium-1" class="podium-name">-</div>
                        </div>

                            <div class="podium-trophy" data-pos="3º">🏆</div>

</div>

<script>
// ===============================
// CONFIGURACIÓN DE FIREBASE EN TIEMPO REAL
// ===============================

// PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE:
const firebaseConfig = {
  apiKey: "AIzaSyChJBr9Sc400fQWAAUbD0GdkemqSen1wco",
  authDomain: "noches-en-la-arena-3.firebaseapp.com",
  databaseURL: "https://noches-en-la-arena-3-default-rtdb.firebaseio.com",
  projectId: "noches-en-la-arena-3",
  storageBucket: "noches-en-la-arena-3.firebasestorage.app",
  messagingSenderId: "61926357219",
  appId: "1:61926357219:web:40f9f362b0d1fc08fc6dd6"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const tournamentRef = db.ref('torneoActual');

let tournament = {
    groups: [],
    bracket: [],
    thirdPlaceMatch: { p1: null, p2: null, s1: null, s2: null },
    finalGroup: null,
    knockoutSets: 1
};

// GUARDADO AUTOMÁTICO EN LA NUBE
function guardarTorneo() {
    const estado = {
        tournament: tournament,
        numGroups: document.getElementById('num-groups').value,
        qualified: document.getElementById('qualified-per-group').value
    };
    tournamentRef.set(estado);
}

// ESCUCHADOR EN TIEMPO REAL (SINCRONIZA TODOS LOS MÓVILES/NAVEGADORES)
tournamentRef.on('value', (snapshot) => {
    const estado = snapshot.val();
    if (estado && estado.tournament) {
        tournament = estado.tournament;
        if (!tournament.thirdPlaceMatch) {
            tournament.thirdPlaceMatch = { p1: null, p2: null, s1: null, s2: null };
        }
        document.getElementById('num-groups').value = estado.numGroups || 4;
        document.getElementById('qualified-per-group').value = estado.qualified || 2;

        document.getElementById('setup-panel').classList.add('hidden');
        document.getElementById('tournament-view').classList.remove('hidden');
        render();
    } else {
        document.getElementById('setup-panel').classList.remove('hidden');
        document.getElementById('tournament-view').classList.add('hidden');
    }
});

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function iniciarTorneo() {
    const names = document
        .getElementById('player-names')
        .value
        .split('\n')
        .map(n => n.trim())
        .filter(n => n);

    const nGroups = parseInt(document.getElementById('num-groups').value);
    const qualified = parseInt(document.getElementById('qualified-per-group').value);
    tournament.knockoutSets = 1;

    if (names.length < nGroups * qualified) {
        alert(`Se necesitan al menos ${nGroups * qualified} jugadores (${nGroups} grupos x ${qualified} clasificados). Actual: ${names.length}`);
        return;
    }

    shuffle(names);

    tournament.groups = Array.from({ length: nGroups }, (_, i) => ({
        id: String.fromCharCode(65 + i),
        players: [],
        matches: []
    }));

    names.forEach((name, i) => {
        tournament.groups[i % nGroups].players.push({
            name,
            won: 0,
            gf: 0,
            gc: 0,
            diff: 0
        });
    });

    tournament.groups.forEach(group => {
        for (let i = 0; i < group.players.length; i++) {
            for (let j = i + 1; j < group.players.length; j++) {
                group.matches.push({
                    p1: group.players[i].name,
                    p2: group.players[j].name,
                    s1: null,
                    s2: null
                });
            }
        }
    });

    tournament.bracket = [];
    tournament.thirdPlaceMatch = { p1: null, p2: null, s1: null, s2: null };
    tournament.finalGroup = null;

    guardarTorneo();
}

function updateGroupScore(gIdx, mIdx, inputElement) {
    const matchDiv = inputElement.closest('.match-item');
    const inputs = matchDiv.querySelectorAll('.score-input');
    const s1Val = inputs[0].value === "" ? null : parseInt(inputs[0].value);
    const s2Val = inputs[1].value === "" ? null : parseInt(inputs[1].value);
    
    let s1 = null;
    let s2 = null;
    
    if (s1Val !== null && !isNaN(s1Val)) {
        if (s1Val < 0) { alert("No se permiten puntuaciones negativas"); render(); return; }
        s1 = s1Val;
    }
    
    if (s2Val !== null && !isNaN(s2Val)) {
        if (s2Val < 0) { alert("No se permiten puntuaciones negativas"); render(); return; }
        s2 = s2Val;
    }
    
    const match = tournament.groups[gIdx].matches[mIdx];
    match.s1 = s1;
    match.s2 = s2;
    
    const group = tournament.groups[gIdx];
    
    group.players.forEach(player => {
        player.won = 0; player.gf = 0; player.gc = 0; player.diff = 0;
    });
    
    group.matches.forEach(m => {
        if (m.s1 !== null && m.s2 !== null) {
            const p1 = group.players.find(p => p.name === m.p1);
            const p2 = group.players.find(p => p.name === m.p2);
            
            p1.gf += m.s1; p1.gc += m.s2;
            p2.gf += m.s2; p2.gc += m.s1;
            
            if (m.s1 > m.s2) p1.won++;
            else if (m.s2 > m.s1) p2.won++;
            
            p1.diff = p1.gf - p1.gc;
            p2.diff = p2.gf - p2.gc;
        }
    });
    
    group.players.sort((a, b) => b.won - a.won || b.diff - a.diff || b.gf - a.gf);
    
    checkKnockoutStart();
    guardarTorneo();
}

function updateFinalGroupScore(mIdx, inputElement) {
    const matchDiv = inputElement.closest('.match-item');
    const inputs = matchDiv.querySelectorAll('.score-input');
    const s1Val = inputs[0].value === "" ? null : parseInt(inputs[0].value);
    const s2Val = inputs[1].value === "" ? null : parseInt(inputs[1].value);

    let s1 = (s1Val !== null && !isNaN(s1Val) && s1Val >= 0) ? s1Val : null;
    let s2 = (s2Val !== null && !isNaN(s2Val) && s2Val >= 0) ? s2Val : null;

    const match = tournament.finalGroup.matches[mIdx];
    match.s1 = s1;
    match.s2 = s2;

    const fg = tournament.finalGroup;
    fg.players.forEach(p => { p.won = 0; p.gf = 0; p.gc = 0; p.diff = 0; });

    fg.matches.forEach(m => {
        if (m.s1 !== null && m.s2 !== null) {
            const p1 = fg.players.find(p => p.name === m.p1);
            const p2 = fg.players.find(p => p.name === m.p2);

            p1.gf += m.s1; p1.gc += m.s2;
            p2.gf += m.s2; p2.gc += m.s1;

            if (m.s1 > m.s2) p1.won++;
            else if (m.s2 > m.s1) p2.won++;

            p1.diff = p1.gf - p1.gc;
            p2.diff = p2.gf - p2.gc;
        }
    });

    fg.players.sort((a, b) => b.won - a.won || b.diff - a.diff || b.gf - a.gf);

    guardarTorneo();
}

function checkKnockoutStart() {
    const allDone = tournament.groups.every(group =>
        group.matches.every(match => match.s1 !== null && match.s2 !== null)
    );
    
    if (allDone && tournament.bracket.length === 0 && !tournament.finalGroup) {
        const qualifiedCount = parseInt(document.getElementById('qualified-per-group').value);
        let qualifiedList = [];

        tournament.groups.forEach(group => {
            for (let i = 0; i < qualifiedCount; i++) {
                if (group.players[i]) {
                    qualifiedList.push({
                        name: group.players[i].name,
                        label: `${group.id}${i + 1}`
                    });
                }
            }
        });

        const totalQ = qualifiedList.length;
        if (totalQ === 0) return;

        if (totalQ === 3) {
            let players = qualifiedList.map(p => ({ name: p.name, won: 0, gf: 0, gc: 0, diff: 0 }));
            let matches = [];
            for (let i = 0; i < players.length; i++) {
                for (let j = i + 1; j < players.length; j++) {
                    matches.push({ p1: players[i].name, p2: players[j].name, s1: null, s2: null });
                }
            }
            tournament.finalGroup = { players, matches };
            return;
        }

        if (totalQ === 2) {
            tournament.bracket = [[
                {
                    p1: qualifiedList[0].name,
                    p2: qualifiedList[1].name,
                    label1: qualifiedList[0].label,
                    label2: qualifiedList[1].label,
                    sets: [{s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null}]
                }
            ]];
            return;
        }

        let targetSize = 2;
        while (targetSize < totalQ) { targetSize *= 2; }

        let firstRound = [];
        let numMatches = targetSize / 2;

        for (let i = 0; i < numMatches; i++) {
            let p1Obj = qualifiedList[i] || null;
            let p2Obj = qualifiedList[targetSize - 1 - i] || null;

            firstRound.push({
                p1: p1Obj ? p1Obj.name : null,
                p2: p2Obj ? p2Obj.name : null,
                s1: null,
                s2: null,
                label1: p1Obj ? p1Obj.label : "BYE",
                label2: p2Obj ? p2Obj.label : "BYE"
            });
        }

        tournament.bracket = [firstRound];
        let size = Math.ceil(firstRound.length / 2);

        while (size >= 1) {
            const isLastRound = (size === 1);
            tournament.bracket.push(
                Array.from({ length: size }, () => (isLastRound ? {
                    p1: null, p2: null,
                    sets: [{s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null}]
                } : {
                    p1: null, p2: null,
                    s1: null, s2: null
                }))
            );
            if (size === 1) break;
            size = Math.ceil(size / 2);
        }
    }
}

function updateSemifinalLosers() {
    if (tournament.bracket.length < 2) return;
    const semiRoundIdx = tournament.bracket.length - 2;
    const semis = tournament.bracket[semiRoundIdx];
    
    let losers = [];
    if (semis && semis.length === 2) {
        semis.forEach(semi => {
            if (semi.s1 !== null && semi.s2 !== null) {
                let loser = semi.s1 < semi.s2 ? semi.p1 : semi.p2;
                losers.push(loser);
            } else {
                losers.push(null);
            }
        });
    } else {
        losers = [null, null];
    }
    
    tournament.thirdPlaceMatch.p1 = losers[0];
    tournament.thirdPlaceMatch.p2 = losers[1];
    if (!losers[0] || !losers[1]) {
        tournament.thirdPlaceMatch.s1 = null;
        tournament.thirdPlaceMatch.s2 = null;
    }
}

function updateThirdPlaceScore(inputElement) {
    const matchDiv = inputElement.closest('.bracket-match');
    const inputs = matchDiv.querySelectorAll('.score-input');
    const s1Val = inputs[0] && inputs[0].value !== "" ? parseInt(inputs[0].value) : null;
    const s2Val = inputs[1] && inputs[1].value !== "" ? parseInt(inputs[1].value) : null;
    
    if (s1Val !== null && (isNaN(s1Val) || s1Val < 0)) { alert("Por favor ingrese un número válido"); render(); return; }
    if (s2Val !== null && (isNaN(s2Val) || s2Val < 0)) { alert("Por favor ingrese un número válido"); render(); return; }
    
    if (s1Val !== null && s2Val !== null && s1Val === s2Val) {
        alert("No puede haber empate en eliminatorias");
        tournament.thirdPlaceMatch.s1 = null;
        tournament.thirdPlaceMatch.s2 = null;
        render();
        return;
    }
    
    tournament.thirdPlaceMatch.s1 = s1Val;
    tournament.thirdPlaceMatch.s2 = s2Val;
    
    guardarTorneo();
}

function updateBracketScore(rIdx, mIdx, inputElement) {
    const isFinal = (tournament.bracket.length - rIdx === 1);
    const matchDiv = inputElement.closest('.bracket-match');
    const match = tournament.bracket[rIdx][mIdx];
    
    if (isFinal) {
        if (!match.sets) {
            match.sets = [ {s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null} ];
        }
        
        const rows = matchDiv.querySelectorAll('.player-row');
        const inputsP1 = rows[0].querySelectorAll('.score-input-final');
        const inputsP2 = rows[1].querySelectorAll('.score-input-final');
        
        let p1SetsWon = 0;
        let p2SetsWon = 0;
        let finalizado = false;
        
        for (let s = 0; s < 3; s++) {
            const v1Val = inputsP1[s].value !== "" ? parseInt(inputsP1[s].value) : null;
            const v2Val = inputsP2[s].value !== "" ? parseInt(inputsP2[s].value) : null;
            
            if (v1Val !== null && (isNaN(v1Val) || v1Val < 0)) { alert("Por favor ingrese un número válido"); render(); return; }
            if (v2Val !== null && (isNaN(v2Val) || v2Val < 0)) { alert("Por favor ingrese un número válido"); render(); return; }
            
            match.sets[s].s1 = v1Val;
            match.sets[s].s2 = v2Val;
            
            if (v1Val !== null && v2Val !== null) {
                if (v1Val === v2Val) { alert("No puede haber empate en un set"); match.sets[s].s1 = null; match.sets[s].s2 = null; render(); return; }
                if (v1Val > v2Val) p1SetsWon++; else p2SetsWon++;
                
                if (p1SetsWon === 2 || p2SetsWon === 2) {
                    finalizado = true;
                    break;
                }
            } else if (v1Val !== null || v2Val !== null) {
                break;
            }
        }
        
        if (!finalizado) {
            limpiarAdelante(rIdx, mIdx);
        }
        
    } else {
        const inputs = matchDiv.querySelectorAll('.score-input');
        const s1Val = inputs[0] && inputs[0].value !== "" ? parseInt(inputs[0].value) : null;
        const s2Val = inputs[1] && inputs[1].value !== "" ? parseInt(inputs[1].value) : null;
        
        if (s1Val !== null && (isNaN(s1Val) || s1Val < 0)) { alert("Número inválido"); render(); return; }
        if (s2Val !== null && (isNaN(s2Val) || s2Val < 0)) { alert("Número inválido"); render(); return; }
        
        match.s1 = s1Val;
        match.s2 = s2Val;
        
        if (match.s1 !== null && match.s2 !== null) {
            if (match.s1 === match.s2) {
                alert("No puede haber empate en eliminatorias");
                match.s1 = null; match.s2 = null;
                render();
                return;
            }
            
            let winner = match.s1 > match.s2 ? match.p1 : match.p2;
            const nextMatchIdx = Math.floor(mIdx / 2);
            const nextMatch = tournament.bracket[rIdx + 1][nextMatchIdx];
            if (mIdx % 2 === 0) nextMatch.p1 = winner;
            else nextMatch.p2 = winner;
        } else {
            limpiarAdelante(rIdx, mIdx);
        }
    }

    updateSemifinalLosers();
    guardarTorneo();
}

function limpiarAdelante(rIdx, mIdx) {
    if (rIdx >= tournament.bracket.length - 1) return;
    const nextMatchIdx = Math.floor(mIdx / 2);
    const nextMatch = tournament.bracket[rIdx + 1][nextMatchIdx];
    if (mIdx % 2 === 0) nextMatch.p1 = null;
    else nextMatch.p2 = null;
    
    if (tournament.bracket.length - (rIdx + 1) === 1) {
        nextMatch.sets = [ {s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null} ];
    } else {
        nextMatch.s1 = null;
        nextMatch.s2 = null;
    }
    
    limpiarAdelante(rIdx + 1, nextMatchIdx);
}

function actualizarPodio() {
    const box = document.getElementById('podium-box');
    const el1 = document.getElementById('podium-1');
    const el2 = document.getElementById('podium-2');
    const el3 = document.getElementById('podium-3');

    if (tournament.finalGroup) {
        const fg = tournament.finalGroup;
        const allMatchesDone = fg.matches.every(m => m.s1 !== null && m.s2 !== null);
        if (allMatchesDone && fg.players.length === 3) {
            el1.innerText = fg.players[0].name;
            el2.innerText = fg.players[1].name;
            el3.innerText = fg.players[2].name;
            box.style.display = "block";
        } else {
            box.style.display = "none";
        }
        return;
    }

    if (tournament.bracket.length === 0) {
        box.style.display = "none";
        return;
    }

    const finalRoundIdx = tournament.bracket.length - 1;
    const finalMatch = tournament.bracket[finalRoundIdx][0];

    let champion = null;
    let runnerUp = null;
    let finalFinished = false;

    if (finalMatch && finalMatch.sets) {
        let p1SetsWon = 0;
        let p2SetsWon = 0;

        for (let s = 0; s < 3; s++) {
            const v1 = finalMatch.sets[s].s1;
            const v2 = finalMatch.sets[s].s2;
            if (v1 !== null && v2 !== null) {
                if (v1 > v2) p1SetsWon++;
                else if (v2 > v1) p2SetsWon++;

                if (p1SetsWon === 2 || p2SetsWon === 2) {
                    finalFinished = true;
                    break;
                }
            } else {
                break;
            }
        }

        if (finalFinished) {
            if (p1SetsWon === 2) {
                champion = finalMatch.p1;
                runnerUp = finalMatch.p2;
            } else {
                champion = finalMatch.p2;
                runnerUp = finalMatch.p1;
            }
        }
    }

    let thirdPlace = "-";
    const tm = tournament.thirdPlaceMatch;
    if (tm && tm.p1 && tm.p2 && tm.s1 !== null && tm.s2 !== null && tm.s1 !== tm.s2) {
        thirdPlace = tm.s1 > tm.s2 ? tm.p1 : tm.p2;
    }

    if (finalFinished && champion && runnerUp) {
        el1.innerText = champion;
        el2.innerText = runnerUp;
        el3.innerText = thirdPlace;
        box.style.display = "block";
    } else {
        box.style.display = "none";
    }
}

function render() {
    const gArea = document.getElementById('groups-area');
    gArea.innerHTML = "";
    
    tournament.groups.forEach((group, gIdx) => {
        const div = document.createElement('div');
        div.className = "group-card";
        
        div.innerHTML = `
            <div class="group-header">GRUPO ${group.id}</div>
            <table>
                <tr><th>Pos</th><th style="text-align:left;">Jugador</th><th>V</th><th>Dif</th></tr>
                ${group.players.map((p, i) => `
                    <tr><td style="text-align:center;">${i+1}</td><td style="text-align:left;">${escapeHTML(p.name)}</td><td style="text-align:center;">${p.won}</td><td style="text-align:center;">${p.diff}</td></tr>
                    `).join('')}
            </table>
        `;
        
        const matchesDiv = document.createElement('div');
        group.matches.forEach((m, mIdx) => {
            const matchItem = document.createElement('div');
            matchItem.className = "match-item";
            matchItem.innerHTML = `
                <span style="font-size:0.7rem; width:70px;">${escapeHTML(m.p1)}</span>
                <input type="number" min="0" class="score-input" value="${m.s1 !== null ? m.s1 : ''}" data-group="${gIdx}" data-match="${mIdx}">
                <span>-</span>
                <input type="number" min="0" class="score-input" value="${m.s2 !== null ? m.s2 : ''}" data-group="${gIdx}" data-match="${mIdx}">
                <span style="font-size:0.7rem; width:70px; text-align:right;">${escapeHTML(m.p2)}</span>
            `;
            matchesDiv.appendChild(matchItem);
        });
        
        div.appendChild(matchesDiv);
        gArea.appendChild(div);
    });
    
    document.querySelectorAll('#groups-area .score-input').forEach(input => {
        const groupIdx = parseInt(input.dataset.group);
        const matchIdx = parseInt(input.dataset.match);
        input.onchange = function() { updateGroupScore(groupIdx, matchIdx, this); };
    });
    
    const bView = document.getElementById('bracket-view');
    bView.innerHTML = "";
    
    if (tournament.finalGroup) {
        const fg = tournament.finalGroup;
        const div = document.createElement('div');
        div.className = "group-card";
        div.style.width = "100%";
        div.style.maxWidth = "500px";
        div.style.margin = "0 auto";

        div.innerHTML = `
            <div class="group-header">TRIANGULAR FINAL</div>
            <table>
                <tr><th>Pos</th><th style="text-align:left;">Jugador</th><th>V</th><th>Dif</th></tr>
                ${fg.players.map((p, i) => `
                    <tr><td style="text-align:center;">${i+1}</td><td style="text-align:left;">${escapeHTML(p.name)}</td><td style="text-align:center;">${p.won}</td><td style="text-align:center;">${p.diff}</td></tr>
                `).join('')}
            </table>
        `;

        const matchesDiv = document.createElement('div');
        fg.matches.forEach((m, mIdx) => {
            const matchItem = document.createElement('div');
            matchItem.className = "match-item";
            matchItem.innerHTML = `
                <span style="font-size:0.75rem; width:80px;">${escapeHTML(m.p1)}</span>
                <input type="number" min="0" class="score-input" value="${m.s1 !== null ? m.s1 : ''}" data-fgmatch="${mIdx}">
                <span>-</span>
                <input type="number" min="0" class="score-input" value="${m.s2 !== null ? m.s2 : ''}" data-fgmatch="${mIdx}">
                <span style="font-size:0.75rem; width:80px; text-align:right;">${escapeHTML(m.p2)}</span>
            `;
            matchesDiv.appendChild(matchItem);
        });

        div.appendChild(matchesDiv);
        bView.appendChild(div);

        document.querySelectorAll('#bracket-view .score-input').forEach(input => {
            const mIdx = parseInt(input.dataset.fgmatch);
            input.onchange = function() { updateFinalGroupScore(mIdx, this); };
        });

    } else {
        updateSemifinalLosers();

        tournament.bracket.forEach((round, rIdx) => {
            const col = document.createElement('div');
            const diff = tournament.bracket.length - rIdx;
            const isFinal = (diff === 1);
            
            if (!isFinal) {
                col.className = "round-column";
                let title = diff === 2 ? "SEMIFINAL" : diff === 3 ? "CUARTOS" : "RONDA " + (diff + 1);
                col.innerHTML = `<div class="round-title">${title}</div>`;
                
                round.forEach((m, mIdx) => {
                    const matchDiv = document.createElement('div');
                    matchDiv.className = "bracket-match";
                    matchDiv.setAttribute('data-r-idx', rIdx);
                    matchDiv.setAttribute('data-m-idx', mIdx);
                    const name1 = m.p1 ? escapeHTML(m.p1) : "";
                    const name2 = m.p2 ? escapeHTML(m.p2) : "";
                    
                    matchDiv.innerHTML = `
                        <div class="player-row">
                            <span class="player-name">${m.label1 ? `<span class="seed-label">${m.label1}</span>` : ''}${name1}</span>
                            <input type="number" min="0" class="score-input" value="${m.s1 !== null ? m.s1 : ''}" ${!m.p1 || !m.p2 ? 'disabled' : ''}>
                        </div>
                        <div class="player-row">
                            <span class="player-name">${m.label2 ? `<span class="seed-label">${m.label2}</span>` : ''}${name2}</span>
                            <input type="number" min="0" class="score-input" value="${m.s2 !== null ? m.s2 : ''}" ${!m.p1 || !m.p2 ? 'disabled' : ''}>
                        </div>
                    `;
                    col.appendChild(matchDiv);
                });
                bView.appendChild(col);
            }
        });

        if (tournament.bracket.length >= 2) {
            const col3 = document.createElement('div');
            col3.className = "round-column";
            col3.innerHTML = `<div class="round-title">3º Y 4º PUESTO</div>`;
            
            const matchDiv = document.createElement('div');
            matchDiv.className = "bracket-match";
            matchDiv.setAttribute('data-type', 'third-place');
            const tm = tournament.thirdPlaceMatch;
            const name1 = tm.p1 ? escapeHTML(tm.p1) : "(Perd. Semifinal)";
            const name2 = tm.p2 ? escapeHTML(tm.p2) : "(Perd. Semifinal)";
            
            matchDiv.innerHTML = `
                <div class="player-row">
                    <span class="player-name">${name1}</span>
                    <input type="number" min="0" class="score-input" value="${tm.s1 !== null ? tm.s1 : ''}" ${!tm.p1 || !tm.p2 ? 'disabled' : ''}>
                </div>
                <div class="player-row">
                    <span class="player-name">${name2}</span>
                    <input type="number" min="0" class="score-input" value="${tm.s2 !== null ? tm.s2 : ''}" ${!tm.p1 || !tm.p2 ? 'disabled' : ''}>
                </div>
            `;
            col3.appendChild(matchDiv);
            bView.appendChild(col3);
        }

        if (tournament.bracket.length > 0) {
            const finalRoundIdx = tournament.bracket.length - 1;
            const finalRound = tournament.bracket[finalRoundIdx];
            const colFinal = document.createElement('div');
            colFinal.className = "round-column is-final";
            colFinal.innerHTML = `<div class="round-title">GRAN FINAL</div>`;
            
            finalRound.forEach((m, mIdx) => {
                const matchDiv = document.createElement('div');
                matchDiv.className = "bracket-match";
                matchDiv.setAttribute('data-r-idx', finalRoundIdx);
                matchDiv.setAttribute('data-m-idx', mIdx);
                matchDiv.setAttribute('data-type', 'final');
                const name1 = m.p1 ? escapeHTML(m.p1) : "";
                const name2 = m.p2 ? escapeHTML(m.p2) : "";
                
                if (!m.sets) {
                    m.sets = [ {s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null} ];
                }
                matchDiv.innerHTML = `
                    <div class="player-row">
                        <span class="player-name">${m.label1 ? `<span class="seed-label">${m.label1}</span>` : ''}${name1}</span>
                        <div class="score-container-final">
                            <input type="number" min="0" placeholder="S1" class="score-input-final" value="${m.sets[0].s1 !== null ? m.sets[0].s1 : ''}" ${!m.p1 || !m.p2 ? 'disabled' : ''}>
                            <input type="number" min="0" placeholder="S2" class="score-input-final" value="${m.sets[1].s1 !== null ? m.sets[1].s1 : ''}" ${!m.p1 || !m.p2 ? 'disabled' : ''}>
                            <input type="number" min="0" placeholder="S3" class="score-input-final" value="${m.sets[2].s1 !== null ? m.sets[2].s1 : ''}" ${!m.p1 || !m.p2 ? 'disabled' : ''}>
                        </div>
                    </div>
                    <div class="player-row">
                        <span class="player-name">${m.label2 ? `<span class="seed-label">${m.label2}</span>` : ''}${name2}</span>
                        <div class="score-container-final">
                            <input type="number" min="0" placeholder="S1" class="score-input-final" value="${m.sets[0].s2 !== null ? m.sets[0].s2 : ''}" ${!m.p1 || !m.p2 ? 'disabled' : ''}>
                            <input type="number" min="0" placeholder="S2" class="score-input-final" value="${m.sets[1].s2 !== null ? m.sets[1].s2 : ''}" ${!m.p1 || !m.p2 ? 'disabled' : ''}>
                            <input type="number" min="0" placeholder="S3" class="score-input-final" value="${m.sets[2].s2 !== null ? m.sets[2].s2 : ''}" ${!m.p1 || !m.p2 ? 'disabled' : ''}>
                        </div>
                    </div>
                `;
                colFinal.appendChild(matchDiv);
            });
            bView.appendChild(colFinal);
        }
        
        document.querySelectorAll('.bracket-match').forEach((matchDiv) => {
            const type = matchDiv.getAttribute('data-type');
            
            if (type === "third-place") {
                const inputs = matchDiv.querySelectorAll('.score-input');
                if (inputs[0] && !inputs[0].disabled) {
                    inputs[0].onchange = function() { updateThirdPlaceScore(this); };
                    if (inputs[1]) inputs[1].onchange = function() { updateThirdPlaceScore(this); };
                }
            } else if (type === "final") {
                const finalInputs = matchDiv.querySelectorAll('.score-input-final');
                finalInputs.forEach(input => {
                    input.onchange = function() { updateBracketScore(tournament.bracket.length - 1, 0, this); };
                });
            } else {
                const rIdx = parseInt(matchDiv.getAttribute('data-r-idx'));
                const mIdx = parseInt(matchDiv.getAttribute('data-m-idx'));
                const inputs = matchDiv.querySelectorAll('.score-input');
                if (inputs[0] && !inputs[0].disabled) {
                    inputs[0].onchange = function() { updateBracketScore(rIdx, mIdx, this); };
                    if (inputs[1]) inputs[1].onchange = function() { updateBracketScore(rIdx, mIdx, this); };
                }
            }
        });
    }

    actualizarPodio();
}

function nuevoTorneo() {
    const confirmar = confirm(
        "¿Seguro que quieres comenzar un nuevo torneo?\n\nSe borrarán todos los resultados de la nube para todos los dispositivos."
    );

    if (!confirmar) return;

    tournamentRef.remove();
}

function escapeHTML(str) {
    if (!str) return "";
    return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
