<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
<title>NOCHES EN LA ARENA 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-dark: #1e1e1e;
        --clay-primary: #b04a2c;
        --clay-dark: #7a2a16;
        --zinc-700: #3f3f46;
        --zinc-800: #27272a;
        --gold: #e2b05f;
        --silver: #c0c0c0;
        --bronze: #cd7f32;
        --text-gray: #a1a1aa;
    }

    * {
        box-sizing: border-box;
    }

    body {
        background-color: #121212;
        background-image:
            linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
            url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
        color: #ffffff;
        font-family: 'Montserrat', sans-serif;
        margin: 0;
        padding: 20px;
        overflow-x: hidden;
    }

    header {
        text-align: center;
        background: linear-gradient(to right, transparent, rgba(176, 74, 44, 0.2), transparent);
        padding: 20px;
        border-bottom: 1px solid var(--clay-primary);
        margin-bottom: 30px;
    }

    .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
        flex-wrap: wrap;
        gap: 15px;
    }

    #btnNuevoTorneo {
        width: auto;
        padding: 8px 16px;
        margin: 0;
    }

    h1 {
        font-family: 'Oswald', sans-serif;
        font-size: 3rem;
        margin: 0;
        letter-spacing: 2px;
        color: #ddd;
    }

    .subtitle {
        color: var(--gold);
        letter-spacing: 4px;
        text-transform: uppercase;
        font-size: 1rem;
    }

    .main-layout {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
    }

    .setup-panel {
        background: var(--zinc-800);
        border-radius: 12px;
        padding: 20px;
        width: 300px;
        border: 1px solid var(--clay-primary);
    }

    .groups-panel {
        flex: 1;
        min-width: 400px;
    }

    .group-card {
        background: #252525;
        border-radius: 8px;
        margin-bottom: 20px;
        border: 1px solid #444;
        overflow: hidden;
    }

    .group-header {
        background: #333;
        padding: 10px;
        color: var(--gold);
        font-weight: bold;
        text-align: center;
        border-bottom: 1px solid var(--clay-primary);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8rem;
    }

    th {
        background: #1a1a1a;
        padding: 8px;
        color: var(--text-gray);
    }

    td {
        padding: 8px;
        text-align: center;
        border-bottom: 1px solid #333;
    }

    .match-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
        border-bottom: 1px solid #222;
        gap: 8px;
    }

    .bracket-container {
        display: flex;
        gap: 30px;
        padding: 20px;
        background: rgba(0,0,0,0.3);
        border-radius: 15px;
        overflow-x: auto;
        position: relative;
        justify-content: flex-start;
    }

    .round-column {
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        gap: 20px;
        position: relative;
        min-width: 220px;
    }

    .round-column.is-final {
        min-width: 320px;
    }

    .round-title {
        text-align: center;
        color: var(--gold);
        font-family: 'Oswald';
        margin-bottom: 10px;
        letter-spacing: 1px;
    }

    .bracket-match {
        width: 220px;
        background: #2a2a2a;
        border-radius: 4px;
        border: 1px solid #444;
        position: relative;
        z-index: 2;
    }

    .round-column.is-final .bracket-match {
        width: 320px;
    }

    .player-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 10px;
        height: 40px;
    }

    .player-row:first-child {
        border-bottom: 1px solid #333;
    }

    .player-name {
        font-size: 0.85rem;
        font-weight: bold;
        color: #e0e0e0;
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
    }

    .seed-label {
        background: var(--clay-primary);
        font-size: 0.65rem;
        padding: 2px 5px;
        border-radius: 2px;
    }

    .score-input {
        width: 45px;
        background: #000;
        border: 1px solid var(--zinc-700);
        color: var(--gold);
        text-align: center;
        border-radius: 3px;
        height: 28px;
    }

    .score-container-final {
        display: flex;
        gap: 4px;
    }

    .score-input-final {
        width: 32px;
        background: #000;
        border: 1px solid var(--zinc-700);
        color: var(--gold);
        text-align: center;
        border-radius: 3px;
        height: 28px;
        font-size: 0.8rem;
    }

    .score-input-final:focus, .score-input:focus {
        outline: 1px solid var(--gold);
    }

    .score-input-final:disabled, .score-input:disabled {
        background: #1a1a1a;
        color: #555;
        cursor: not-allowed;
    }

    /* ESTILOS DEL PODIO */
    #podium-box {
        margin-top: 30px;
        padding: 30px;
        background: #252525;
        border: 2px solid var(--gold);
        text-align: center;
        border-radius: 12px;
        display: none;
    }

    .podium-title {
        color: var(--gold);
        font-weight: bold;
        letter-spacing: 2px;
        font-family: 'Oswald';
        font-size: 1.5rem;
        margin-bottom: 25px;
    }

    .podium-container {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 20px;
        padding-top: 20px;
    }

    .podium-step {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 130px;
        transition: transform 0.3s ease;
    }

    .podium-step:hover {
        transform: translateY(-5px);
    }

    .podium-trophy {
        font-size: 3rem;
        margin-bottom: 8px;
        position: relative;
    }

    .podium-trophy::after {
        content: attr(data-pos);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -55%);
        font-size: 0.9rem;
        font-weight: 900;
        font-family: 'Oswald';
        color: #121212;
    }

    .podium-step.first .podium-trophy {
        font-size: 4rem;
    }

    .podium-step.first .podium-trophy::after {
        font-size: 1.1rem;
        top: 52%;
    }

    .podium-name {
        font-size: 0.9rem;
        font-weight: bold;
        color: #fff;
        margin-top: 8px;
        word-break: break-word;
        background: #1a1a1a;
        padding: 6px 10px;
        border-radius: 4px;
        width: 100%;
        border: 1px solid #444;
    }

    .podium-step.first .podium-name {
        border-color: var(--gold);
        color: var(--gold);
    }

    .podium-step.second .podium-name {
        border-color: var(--silver);
    }

    .podium-step.third .podium-name {
        border-color: var(--bronze);
    }

    textarea,
    select,
    input[type="number"] {
        background: #111;
        border: 1px solid #444;
        color: white;
        padding: 8px;
        border-radius: 4px;
        width: 100%;
    }

    button {
        background: var(--clay-primary);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
        text-transform: uppercase;
        transition: 0.2s;
    }

    button:hover {
        background: var(--clay-dark);
    }

    .hidden {
        display: none;
    }

    @media (max-width: 768px) {
        body {
            padding: 10px;
        }
        
        h1 {
            font-size: 1.8rem;
        }
        
        .subtitle {
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
        
        .setup-panel {
            width: 100%;
        }
        
        .groups-panel {
            min-width: 100%;
        }
        
        .match-item {
            font-size: 0.75rem;
            gap: 5px;
        }
        
        .match-item span {
            font-size: 0.7rem !important;
        }
        
        .score-input {
            width: 40px;
            font-size: 0.8rem;
        }
        
        table {
            font-size: 0.7rem;
        }
        
        th, td {
            padding: 5px;
        }
        
        .bracket-container {
            flex-direction: column;
            gap: 20px;
            padding: 15px;
        }
        
        .round-column {
            min-width: 100%;
            gap: 15px;
        }
        
        .bracket-match {
            width: 100%;
            max-width: 100%;
        }
        
        .round-title {
            font-size: 0.9rem;
        }
        
        .player-name {
            font-size: 0.75rem;
        }
        
        #podium-box {
            padding: 20px;
        }

        .podium-container {
            gap: 10px;
        }

        .podium-step {
            width: 100px;
        }
    }
    
    @media (max-width: 480px) {
        .match-item {
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .player-name {
            font-size: 0.7rem;
        }
        
        .score-input {
            width: 35px;
            height: 30px;
        }
        
        button {
            padding: 10px;
            font-size: 0.85rem;
        }
    }
</style>
</head>

<body>

<header>
    <div class="header-top">
        <div>
            <h1>NOCHES EN LA ARENA 2026</h1>
            <div class="subtitle">Club de Tenis Legends Fuentes</div>
        </div>
        <button id="btnNuevoTorneo" onclick="nuevoTorneo()">
            🏆 Nuevo torneo
        </button>
    </div>
</header>

<div class="main-layout">
    <div id="setup-panel" class="setup-panel">
        <h3 style="margin-top:0;">Configuración</h3>
        <label style="font-size:0.8rem;">Jugadores (uno por línea)</label>
        <textarea id="player-names" rows="10">Nadal
Djokovic
Alcaraz
Sinner
Federer
Zverev
Ruud
Tsitsipas</textarea>
        
        <label style="font-size:0.8rem; margin-top:15px; display:block;">Número de Grupos</label>
        <select id="num-groups">
            <option value="1">1 Grupo</option>
            <option value="2">2 Grupos</option>
            <option value="3">3 Grupos</option>
            <option value="4" selected>4 Grupos</option>
            <option value="5">5 Grupos</option>
            <option value="6">6 Grupos</option>
        </select>

        <label style="font-size:0.8rem; margin-top:15px; display:block;">Clasificados por Grupo</label>
        <select id="qualified-per-group">
            <option value="1">1 Jugador</option>
            <option value="2" selected>2 Jugadores</option>
            <option value="3">3 Jugadores</option>
        </select>
        
        <button onclick="iniciarTorneo()">Generar Cuadro</button>
    </div>

    <div id="tournament-view" class="hidden" style="width:100%;">
        <div class="main-layout">
            <div id="groups-area" class="groups-panel"></div>
            <div id="bracket-area" style="width:100%;">
                <div id="bracket-view" class="bracket-container"></div>
                <div id="podium-box">
                    <div class="podium-title">PODIO FINAL DEL TORNEO</div>
                    <div class="podium-container">
                        <div class="podium-step second">
                            <div class="podium-trophy" data-pos="2º">🏆</div>
                            <div style="font-size:0.75rem; color:var(--silver);">2º PUESTO</div>
                            <div id="podium-2" class="podium-name">-</div>
                        </div>
                        <div class="podium-step first">
                            <div class="podium-trophy" data-pos="1º">🏆</div>
                            <div style="font-size:0.75rem; color:var(--gold);">CAMPEÓN</div>
                            <div id="podium-1" class="podium-name">-</div>
                        </div>
                        <div class="podium-step third">
                            <div class="podium-trophy" data-pos="3º">🏆</div>
                            <div style="font-size:0.75rem; color:var(--bronze);">3º PUESTO</div>
                            <div id="podium-3" class="podium-name">-</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAZkMc3Df-NooEDgQl6-X6r226WUQ7cqzE",
        authDomain: "noches-en-la-arena.firebaseapp.com",
        projectId: "noches-en-la-arena",
        storageBucket: "noches-en-la-arena.firebasestorage.app",
        messagingSenderId: "903495284149",
        appId: "1:903495284149:web:d2c45e0bc038c3f16355fc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let tournament = {
        groups: [],
        bracket: [],
        thirdPlaceMatch: { p1: null, p2: null, s1: null, s2: null },
        knockoutSets: 1
    };

    let actualizandoDesdeRemoto = false;

    async function guardarTorneo() {
        if (actualizandoDesdeRemoto) return;
        const estado = {
            tournament: tournament,
            numGroups: document.getElementById('num-groups').value,
            qualified: document.getElementById('qualified-per-group').value,
            knockoutSets: 1
        };
        try {
            await setDoc(doc(db, "torneos", "principal"), estado);
        } catch (e) {
            console.error("Error al guardar en la nube:", e);
        }
    }

    function escucharTorneoEnTiempoReal() {
        onSnapshot(doc(db, "torneos", "principal"), (docSnap) => {
            if (docSnap.exists()) {
                const estado = docSnap.data();
                actualizandoDesdeRemoto = true;
                tournament = estado.tournament;
                if (!tournament.thirdPlaceMatch) {
                    tournament.thirdPlaceMatch = { p1: null, p2: null, s1: null, s2: null };
                }
                document.getElementById('num-groups').value = estado.numGroups;
                document.getElementById('qualified-per-group').value = estado.qualified;

                document.getElementById('setup-panel').classList.add('hidden');
                document.getElementById('tournament-view').classList.remove('hidden');

                render();
                actualizandoDesdeRemoto = false;
            } else {
                document.getElementById('setup-panel').classList.remove('hidden');
                document.getElementById('tournament-view').classList.add('hidden');
            }
        });
    }

    window.shuffle = function(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    window.iniciarTorneo = async function() {
        const names = document
            .getElementById('player-names')
            .value
            .split('\n')
            .map(n => n.trim())
            .filter(n => n);

        const nGroups = parseInt(document.getElementById('num-groups').value);
        const qualified = parseInt(document.getElementById('qualified-per-group').value);
        tournament.knockoutSets = 1;

        if (names.length < nGroups * qualified) {
            alert(`Se necesitan al menos ${nGroups * qualified} jugadores (${nGroups} grupos x ${qualified} clasificados). Actual: ${names.length}`);
            return;
        }

        window.shuffle(names);

        tournament.groups = Array.from({ length: nGroups }, (_, i) => ({
            id: String.fromCharCode(65 + i),
            players: [],
            matches: []
        }));

        names.forEach((name, i) => {
            tournament.groups[i % nGroups].players.push({
                name,
                won: 0,
                gf: 0,
                gc: 0,
                diff: 0
            });
        });

        tournament.groups.forEach(group => {
            for (let i = 0; i < group.players.length; i++) {
                for (let j = i + 1; j < group.players.length; j++) {
                    group.matches.push({
                        p1: group.players[i].name,
                        p2: group.players[j].name,
                        s1: null,
                        s2: null
                    });
                }
            }
        });

        tournament.bracket = [];
        tournament.thirdPlaceMatch = { p1: null, p2: null, s1: null, s2: null };

        document.getElementById('setup-panel').classList.add('hidden');
        document.getElementById('tournament-view').classList.remove('hidden');

        await guardarTorneo();
        render();
    }

    window.nuevoTorneo = async function() {
        if (confirm("¿Estás seguro de que deseas iniciar un nuevo torneo? Se borrarán todos los datos actuales.")) {
            try {
                await deleteDoc(doc(db, "torneos", "principal"));
            } catch (e) {
                console.error("Error al borrar en la nube:", e);
            }
            tournament = { groups: [], bracket: [], thirdPlaceMatch: { p1: null, p2: null, s1: null, s2: null }, knockoutSets: 1 };
            document.getElementById('setup-panel').classList.remove('hidden');
            document.getElementById('tournament-view').classList.add('hidden');
            render();
        }
    }

    window.updateGroupScore = function(gIdx, mIdx, inputElement, isLeft) {
        const matchDiv = inputElement.closest('.match-item');
        const inputs = matchDiv.querySelectorAll('.score-input');
        const s1Val = inputs[0].value === "" ? null : parseInt(inputs[0].value);
        const s2Val = inputs[1].value === "" ? null : parseInt(inputs[1].value);
        
        let s1 = null;
        let s2 = null;
        
        if (s1Val !== null && !isNaN(s1Val)) {
            if (s1Val < 0) {
                alert("No se permiten puntuaciones negativas");
                inputs[0].value = "";
                render();
                return;
            }
            s1 = s1Val;
        }
        
        if (s2Val !== null && !isNaN(s2Val)) {
            if (s2Val < 0) {
                alert("No se permiten puntuaciones negativas");
                inputs[1].value = "";
                render();
                return;
            }
            s2 = s2Val;
        }
        
        const match = tournament.groups[gIdx].matches[mIdx];
        match.s1 = s1;
        match.s2 = s2;
        
        const group = tournament.groups[gIdx];
        
        group.players.forEach(player => {
            player.won = 0;
            player.gf = 0;
            player.gc = 0;
            player.diff = 0;
        });
        
        group.matches.forEach(m => {
            if (m.s1 !== null && m.s2 !== null) {
                const p1 = group.players.find(p => p.name === m.p1);
                const p2 = group.players.find(p => p.name === m.p2);
                
                p1.gf += m.s1;
                p1.gc += m.s2;
                p2.gf += m.s2;
                p2.gc += m.s1;
                
                if (m.s1 > m.s2) {
                    p1.won++;
                } else if (m.s2 > m.s1) {
                    p2.won++;
                }
                
                p1.diff = p1.gf - p1.gc;
                p2.diff = p2.gf - p2.gc;
            }
        });
        
        group.players.sort((a, b) =>
            b.won - a.won ||
            b.diff - a.diff ||
            b.gf - a.gf
        );
        
        checkKnockoutStart();
        guardarTorneo();
        render();
    }

    function checkKnockoutStart() {
        const allDone = tournament.groups.every(group =>
            group.matches.every(match =>
                match.s1 !== null && match.s2 !== null
            )
        );
        
        if (allDone && tournament.bracket.length === 0) {
            const qualified = parseInt(document.getElementById('qualified-per-group').value);
            
            let firstRound = [];
            
            for (let g = 0; g < tournament.groups.length; g += 2) {
                const groupA = tournament.groups[g];
                const groupB = tournament.groups[g + 1];
                
                if (groupA && groupB) {
                    if (groupA.players[0] && groupB.players[qualified - 1]) {
                        firstRound.push({
                            p1: groupA.players[0].name,
                            p2: groupB.players[qualified - 1].name,
                            s1: null,
                            s2: null,
                            label1: groupA.id + "1",
                            label2: groupB.id + qualified
                        });
                    }
                    
                    if (qualified >= 2 && groupA.players[1] && groupB.players[0]) {
                        firstRound.push({
                            p1: groupA.players[1].name,
                            p2: groupB.players[0].name,
                            s1: null,
                            s2: null,
                            label1: groupA.id + "2",
                            label2: groupB.id + "1"
                        });
                    }
                    
                    if (qualified >= 3) {
                        if (groupA.players[2] && groupB.players[2]) {
                            firstRound.push({
                                p1: groupA.players[2].name,
                                p2: groupB.players[2].name,
                                s1: null,
                                s2: null,
                                label1: groupA.id + "3",
                                label2: groupB.id + "3"
                            });
                        }
                    }
                } else if (groupA) {
                    for (let pos = 1; pos <= qualified; pos++) {
                        const player = groupA.players[pos - 1];
                        if (player) {
                            firstRound.push({
                                p1: player.name,
                                p2: null,
                                s1: null,
                                s2: null,
                                label1: groupA.id + pos,
                                label2: "BYE"
                            });
                        }
                    }
                }
            }
            
            if (firstRound.length === 0) {
                return;
            }
            
            tournament.bracket = [firstRound];
            let size = Math.ceil(firstRound.length / 2);
            
            while (size >= 1) {
                const isLastRound = (size === 1);
                tournament.bracket.push(
                    Array.from({ length: size }, () => (isLastRound ? {
                        p1: null, p2: null,
                        sets: [ {s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null} ]
                    } : {
                        p1: null, p2: null,
                        s1: null, s2: null
                    }))
                );
                if (size === 1) break;
                size = Math.ceil(size / 2);
            }
        }
    }

    function updateSemifinalLosers() {
        if (tournament.bracket.length < 2) return;
        const semiRoundIdx = tournament.bracket.length - 2;
        const semis = tournament.bracket[semiRoundIdx];
        
        let losers = [];
        if (semis && semis.length === 2) {
            semis.forEach(semi => {
                if (semi.s1 !== null && semi.s2 !== null) {
                    let loser = semi.s1 < semi.s2 ? semi.p1 : semi.p2;
                    losers.push(loser);
                } else {
                    losers.push(null);
                }
            });
        } else {
            losers = [null, null];
        }
        
        tournament.thirdPlaceMatch.p1 = losers[0];
        tournament.thirdPlaceMatch.p2 = losers[1];
        if (!losers[0] || !losers[1]) {
            tournament.thirdPlaceMatch.s1 = null;
            tournament.thirdPlaceMatch.s2 = null;
        }
    }

    window.updateThirdPlaceScore = function(inputElement) {
        const matchDiv = inputElement.closest('.bracket-match');
        const inputs = matchDiv.querySelectorAll('.score-input');
        const s1Val = inputs[0] && inputs[0].value !== "" ? parseInt(inputs[0].value) : null;
        const s2Val = inputs[1] && inputs[1].value !== "" ? parseInt(inputs[1].value) : null;
        
        if (s1Val !== null && (isNaN(s1Val) || s1Val < 0)) { alert("Por favor ingrese un número válido"); inputs[0].value = ""; render(); return; }
        if (s2Val !== null && (isNaN(s2Val) || s2Val < 0)) { alert("Por favor ingrese un número válido"); inputs[1].value = ""; render(); return; }
        
        if (s1Val !== null && s2Val !== null && s1Val === s2Val) {
            alert("No puede haber empate en eliminatorias");
            tournament.thirdPlaceMatch.s1 = null;
            tournament.thirdPlaceMatch.s2 = null;
            render();
            return;
        }
        
        tournament.thirdPlaceMatch.s1 = s1Val;
        tournament.thirdPlaceMatch.s2 = s2Val;
        
        guardarTorneo();
        render();
    }

    window.updateBracketScore = function(rIdx, mIdx, inputElement, isLeft) {
        const isFinal = (tournament.bracket.length - rIdx === 1);
        const matchDiv = inputElement.closest('.bracket-match');
        const match = tournament.bracket[rIdx][mIdx];
        
        if (isFinal) {
            if (!match.sets) {
                match.sets = [ {s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null} ];
            }
            
            const rows = matchDiv.querySelectorAll('.player-row');
            const inputsP1 = rows[0].querySelectorAll('.score-input-final');
            const inputsP2 = rows[1].querySelectorAll('.score-input-final');
            
            let p1SetsWon = 0;
            let p2SetsWon = 0;
            let finalizado = false;
            
            for (let s = 0; s < 3; s++) {
                const v1Val = inputsP1[s].value !== "" ? parseInt(inputsP1[s].value) : null;
                const v2Val = inputsP2[s].value !== "" ? parseInt(inputsP2[s].value) : null;
                
                if (v1Val !== null && (isNaN(v1Val) || v1Val < 0)) { alert("Por favor ingrese un número válido (0 o mayor)"); inputsP1[s].value = ""; render(); return; }
                if (v2Val !== null && (isNaN(v2Val) || v2Val < 0)) { alert("Por favor ingrese un número válido (0 o mayor)"); inputsP2[s].value = ""; render(); return; }
                
                match.sets[s].s1 = v1Val;
                match.sets[s].s2 = v2Val;
                
                if (v1Val !== null && v2Val !== null) {
                    if (v1Val === v2Val) { alert("No puede haber empate en un set de eliminatorias"); match.sets[s].s1 = null; match.sets[s].s2 = null; render(); return; }
                    if (v1Val > v2Val) p1SetsWon++; else p2SetsWon++;
                    
                    if (p1SetsWon === 2 || p2SetsWon === 2) {
                        finalizado = true;
                        break;
                    }
                } else if (v1Val !== null || v2Val !== null) {
                    break;
                }
            }
            
            if (!finalizado) {
                limpiarAdelante(rIdx, mIdx);
            }
            
        } else {
            const inputs = matchDiv.querySelectorAll('.score-input');
            const s1Val = inputs[0] && inputs[0].value !== "" ? parseInt(inputs[0].value) : null;
            const s2Val = inputs[1] && inputs[1].value !== "" ? parseInt(inputs[1].value) : null;
            
            if (s1Val !== null && (isNaN(s1Val) || s1Val < 0)) {
                alert("Por favor ingrese un número válido (0 o mayor)");
                if (inputs[0]) inputs[0].value = "";
                render();
                return;
            }
            
            if (s2Val !== null && (isNaN(s2Val) || s2Val < 0)) {
                alert("Por favor ingrese un número válido (0 o mayor)");
                if (inputs[1]) inputs[1].value = "";
                return;
            }
            
            match.s1 = s1Val;
            match.s2 = s2Val;
            
            if (match.s1 !== null && match.s2 !== null) {
                if (match.s1 === match.s2) {
                    alert("No puede haber empate en eliminatorias");
                    match.s1 = null;
                    match.s2 = null;
                    render();
                    return;
                }
                
                let winner = match.s1 > match.s2 ? match.p1 : match.p2;
                
                const nextMatchIdx = Math.floor(mIdx / 2);
                const nextMatch = tournament.bracket[rIdx + 1][nextMatchIdx];
                if (mIdx % 2 === 0) {
                    nextMatch.p1 = winner;
                } else {
                    nextMatch.p2 = winner;
                }
           } else {
                limpiarAdelante(rIdx, mIdx);
            }
        }

        updateSemifinalLosers();
        guardarTorneo();
        render();
    }

    function limpiarAdelante(rIdx, mIdx) {
        if (rIdx >= tournament.bracket.length - 1) return;
        const nextMatchIdx = Math.floor(mIdx / 2);
        const nextMatch = tournament.bracket[rIdx + 1][nextMatchIdx];
        if (mIdx % 2 === 0) {
            nextMatch.p1 = null;
        } else {
            nextMatch.p2 = null;
        }
        
        if (tournament.bracket.length - (rIdx + 1) === 1) {
            nextMatch.sets = [ {s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null} ];
        } else {
            nextMatch.s1 = null;
            nextMatch.s2 = null;
        }
        
        limpiarAdelante(rIdx + 1, nextMatchIdx);
    }

    function actualizarPodio() {
        const box = document.getElementById('podium-box');
        const el1 = document.getElementById('podium-1');
        const el2 = document.getElementById('podium-2');
        const el3 = document.getElementById('podium-3');

        if (tournament.bracket.length === 0) {
            box.style.display = "none";
            return;
        }

        const finalRoundIdx = tournament.bracket.length - 1;
        const finalMatch = tournament.bracket[finalRoundIdx][0];

        let champion = null;
        let runnerUp = null;
        let finalFinished = false;

        if (finalMatch && finalMatch.sets) {
            let p1SetsWon = 0;
            let p2SetsWon = 0;

            for (let s = 0; s < 3; s++) {
                const v1 = finalMatch.sets[s].s1;
                const v2 = finalMatch.sets[s].s2;
                if (v1 !== null && v2 !== null) {
                    if (v1 > v2) p1SetsWon++;
                    else if (v2 > v1) p2SetsWon++;

                    if (p1SetsWon === 2 || p2SetsWon === 2) {
                        finalFinished = true;
                        break;
                    }
                } else {
                    break;
                }
            }

            if (finalFinished) {
                if (p1SetsWon === 2) {
                    champion = finalMatch.p1;
                    runnerUp = finalMatch.p2;
                } else {
                    champion = finalMatch.p2;
                    runnerUp = finalMatch.p1;
                }
            }
        }

        let thirdPlace = null;
        let thirdFinished = false;
        const tm = tournament.thirdPlaceMatch;
        if (tm && tm.p1 && tm.p2 && tm.s1 !== null && tm.s2 !== null && tm.s1 !== tm.s2) {
            thirdFinished = true;
            thirdPlace = tm.s1 > tm.s2 ? tm.p1 : tm.p2;
        }

        if (champion || runnerUp || thirdPlace) {
            box.style.display = "block";
            el1.textContent = champion || "-";
            el2.textContent = runnerUp || "-";
            el3.textContent = thirdPlace || "-";
        } else {
            box.style.display = "none";
        }
    }

    function render() {
        const groupsArea = document.getElementById('groups-area');
        groupsArea.innerHTML = '';

        tournament.groups.forEach((group, gIdx) => {
            let html = `
                <div class="group-card">
                    <div class="group-header">GRUPO ${group.id}</div>
                    <table>
                        <thead>
                            <tr>
                                <th style="text-align:left;">Jugador</th>
                                <th>V</th>
                                <th>GF</th>
                                <th>GC</th>
                                <th>Dif</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            group.players.forEach(p => {
                html += `
                    <tr>
                        <td style="text-align:left; font-weight:bold;">${p.name}</td>
                        <td>${p.won}</td>
                        <td>${p.gf}</td>
                        <td>${p.gc}</td>
                        <td>${p.diff > 0 ? '+' + p.diff : p.diff}</td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                    <div style="background:#1e1e1e; padding:5px; font-size:0.75rem; color:var(--text-gray); text-align:center; font-weight:bold;">PARTIDOS</div>
            `;

            group.matches.forEach((m, mIdx) => {
                html += `
                    <div class="match-item">
                        <span style="flex:1; text-align:right; font-weight:bold; font-size:0.8rem;">${m.p1}</span>
                        <input type="number" class="score-input" value="${m.s1 !== null ? m.s1 : ''}" oninput="updateGroupScore(${gIdx}, ${mIdx}, this, true)">
                        <span>-</span>
                        <input type="number" class="score-input" value="${m.s2 !== null ? m.s2 : ''}" oninput="updateGroupScore(${gIdx}, ${mIdx}, this, false)">
                        <span style="flex:1; text-align:left; font-weight:bold; font-size:0.8rem;">${m.p2}</span>
                    </div>
                `;
            });

            html += `</div>`;
            groupsArea.innerHTML += html;
        });

        const bracketView = document.getElementById('bracket-view');
        bracketView.innerHTML = '';

        if (tournament.bracket.length > 0) {
            const roundNames = ["Cuartos de Final", "Semifinales", "Gran Final"];
            
            tournament.bracket.forEach((round, rIdx) => {
                const isFinal = (rIdx === tournament.bracket.length - 1);
                const rName = roundNames[rIdx] || `Ronda ${rIdx + 1}`;
                
                let rHtml = `<div class="round-column ${isFinal ? 'is-final' : ''}">`;
                rHtml += `<div class="round-title">${rName}</div>`;
                
                round.forEach((match, mIdx) => {
                    rHtml += `<div class="bracket-match">`;
                    
                    if (isFinal) {
                        if (!match.sets) {
                            match.sets = [ {s1:null, s2:null}, {s1:null, s2:null}, {s1:null, s2:null} ];
                        }
                        
                        let p1Sets = 0;
                        let p2Sets = 0;
                        match.sets.forEach(s => {
                            if (s.s1 !== null && s.s2 !== null) {
                                if (s.s1 > s.s2) p1Sets++;
                                else if (s.s2 > s.s1) p2Sets++;
                            }
                        });
                        
                        const p1Disabled = !match.p1 || !match.p2;
                        const p2Disabled = !match.p1 || !match.p2;
                        
                        rHtml += `
                            <div class="player-row">
                                <span class="player-name">${match.p1 ? match.p1 : 'Por definir'}</span>
                                <div class="score-container-final">
                                    <input type="number" class="score-input-final" ${p1Disabled ? 'disabled' : ''} value="${match.sets[0].s1 !== null ? match.sets[0].s1 : ''}" oninput="updateBracketScore(${rIdx}, ${mIdx}, this, true)">
                                    <input type="number" class="score-input-final" ${p1Disabled ? 'disabled' : ''} value="${match.sets[1].s1 !== null ? match.sets[1].s1 : ''}" oninput="updateBracketScore(${rIdx}, ${mIdx}, this, true)">
                                    <input type="number" class="score-input-final" ${p1Disabled ? 'disabled' : ''} value="${match.sets[2].s1 !== null ? match.sets[2].s1 : ''}" oninput="updateBracketScore(${rIdx}, ${mIdx}, this, true)">
                                </div>
                            </div>
                            <div class="player-row">
                                <span class="player-name">${match.p2 ? match.p2 : 'Por definir'}</span>
                                <div class="score-container-final">
                                    <input type="number" class="score-input-final" ${p2Disabled ? 'disabled' : ''} value="${match.sets[0].s2 !== null ? match.sets[0].s2 : ''}" oninput="updateBracketScore(${rIdx}, ${mIdx}, this, false)">
                                    <input type="number" class="score-input-final" ${p2Disabled ? 'disabled' : ''} value="${match.sets[1].s2 !== null ? match.sets[1].s2 : ''}" oninput="updateBracketScore(${rIdx}, ${mIdx}, this, false)">
                                    <input type="number" class="score-input-final" ${p2Disabled ? 'disabled' : ''} value="${match.sets[2].s2 !== null ? match.sets[2].s2 : ''}" oninput="updateBracketScore(${rIdx}, ${mIdx}, this, false)">
                                </div>
                            </div>
                        `;
                    } else {
                        const p1Disabled = !match.p1 || !match.p2;
                        const p2Disabled = !match.p1 || !match.p2;
                        
                        rHtml += `
                            <div class="player-row">
                                <span class="player-name">
                                    ${match.label1 ? `<span class="seed-label">${match.label1}</span>` : ''}
                                    ${match.p1 ? match.p1 : 'Por definir'}
                                </span>
                                <input type="number" class="score-input" ${p1Disabled ? 'disabled' : ''} value="${match.s1 !== null ? match.s1 : ''}" oninput="updateBracketScore(${rIdx}, ${mIdx}, this, true)">
                            </div>
                            <div class="player-row">
                                <span class="player-name">
                                    ${match.label2 ? `<span class="seed-label">${match.label2}</span>` : ''}
                                    ${match.p2 ? match.p2 : 'Por definir'}
                                </span>
                                <input type="number" class="score-input" ${p2Disabled ? 'disabled' : ''} value="${match.s2 !== null ? match.s2 : ''}" oninput="updateBracketScore(${rIdx}, ${mIdx}, this, false)">
                            </div>
                        `;
                    }
                    
                    rHtml += `</div>`;
                });
                
                rHtml += `</div>`;
                bracketView.innerHTML += rHtml;
            });

            if (tournament.bracket.length >= 2) {
                const tm = tournament.thirdPlaceMatch;
                const tpDisabled = !tm.p1 || !tm.p2;
                
                let thirdHtml = `
                    <div class="round-column">
                        <div class="round-title">3º y 4º Puesto</div>
                        <div class="bracket-match">
                            <div class="player-row">
                                <span class="player-name">${tm.p1 ? tm.p1 : 'Perdedor Semifinal'}</span>
                                <input type="number" class="score-input" ${tpDisabled ? 'disabled' : ''} value="${tm.s1 !== null ? tm.s1 : ''}" oninput="updateThirdPlaceScore(this)">
                            </div>
                            <div class="player-row">
                                <span class="player-name">${tm.p2 ? tm.p2 : 'Perdedor Semifinal'}</span>
                                <input type="number" class="score-input" ${tpDisabled ? 'disabled' : ''} value="${tm.s2 !== null ? tm.s2 : ''}" oninput="updateThirdPlaceScore(this)">
                            </div>
                        </div>
                    </div>
                `;
                bracketView.innerHTML += thirdHtml;
            }
        }

        actualizarPodio();
    }

    escucharTorneoEnTiempoReal();
</script>

</body>
</html>
