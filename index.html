<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Torneos Profesional</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clay: { 600: '#C85A32', 700: '#A6421E', 800: '#7A2E13' },
                        gold: { 400: '#FACC15', 500: '#EAB308', 600: '#CA8A04' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #121212;
            background-image: radial-gradient(#242424 1px, transparent 1px);
            background-size: 16px 16px;
        }
    </style>
</head>
<body class="text-gray-200 font-sans min-h-screen pb-12">

    <!-- Encabezado -->
    <header class="bg-stone-900 border-b border-stone-800 p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gold-400 tracking-wider">🏆 TORNEO LIVE</h1>
            <button id="btn-reset" class="bg-red-900/40 hover:bg-red-800 text-red-200 text-xs px-3 py-2 rounded border border-red-700 transition">
                🗑️ Reiniciar Torneo
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 space-y-8 mt-4">

        <!-- CONFIGURACIÓN INICIAL -->
        <section id="sec-config" class="bg-stone-900 border border-stone-800 rounded-xl p-6 shadow-xl">
            <h2 class="text-xl font-bold text-clay-600 mb-4 border-b border-stone-800 pb-2">Configuración del Torneo</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Lista de Jugadores / Equipos (uno por línea)</label>
                    <textarea id="cfg-players" rows="6" class="w-full bg-stone-800 border border-stone-700 rounded p-2 text-sm focus:border-clay-600 focus:outline-none" placeholder="Jugador 1&#10;Jugador 2&#10;Jugador 3&#10;Jugador 4"></textarea>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Número de Grupos</label>
                        <select id="cfg-groups" class="w-full bg-stone-800 border border-stone-700 rounded p-2 text-sm">
                            <option value="1">1 Grupo</option>
                            <option value="2" selected>2 Grupos</option>
                            <option value="4">4 Grupos</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Clasificados por Grupo a Eliminatorias</label>
                        <select id="cfg-advancing" class="w-full bg-stone-800 border border-stone-700 rounded p-2 text-sm">
                            <option value="1">1 por grupo</option>
                            <option value="2" selected>2 por grupo</option>
                        </select>
                    </div>
                    <button id="btn-start" class="w-full bg-clay-600 hover:bg-clay-700 text-white font-bold py-3 rounded-lg shadow-lg transition transform active:scale-95">
                        🚀 Generar Torneo
                    </button>
                </div>
            </div>
        </section>

        <!-- PODIO FINAL (Oculto por defecto) -->
        <section id="sec-podium" class="hidden bg-stone-900 border border-gold-500/30 rounded-xl p-6 text-center shadow-2xl relative overflow-hidden">
            <h2 class="text-2xl font-black text-gold-400 mb-6">🏆 ¡PODIO DEL TORNEO! 🏆</h2>
            <div class="flex justify-center items-end gap-4 h-48">
                <!-- 2º Lugar -->
                <div class="flex flex-col items-center w-1/3 max-w-[120px]">
                    <span id="podium-2" class="font-bold text-gray-300 text-sm mb-1">--</span>
                    <div class="w-full bg-stone-700 h-28 rounded-t-lg flex items-center justify-center font-bold text-2xl text-stone-400 border-t-2 border-stone-400">2</div>
                </div>
                <!-- 1º Lugar -->
                <div class="flex flex-col items-center w-1/3 max-w-[120px]">
                    <span id="podium-1" class="font-bold text-gold-400 text-base mb-1">--</span>
                    <div class="w-full bg-gold-600 h-36 rounded-t-lg flex items-center justify-center font-bold text-3xl text-stone-900 border-t-2 border-gold-300">1</div>
                </div>
                <!-- 3º Lugar -->
                <div class="flex flex-col items-center w-1/3 max-w-[120px]">
                    <span id="podium-3" class="font-bold text-amber-700 text-sm mb-1">--</span>
                    <div class="w-full bg-amber-900/60 h-20 rounded-t-lg flex items-center justify-center font-bold text-xl text-amber-600 border-t-2 border-amber-700">3</div>
                </div>
            </div>
        </section>

        <!-- FASE DE GRUPOS -->
        <section id="sec-groups" class="space-y-6"></section>

        <!-- CUADRO ELIMINATORIO -->
        <section id="sec-playoffs" class="bg-stone-900 border border-stone-800 rounded-xl p-6 shadow-xl hidden">
            <h2 class="text-xl font-bold text-gold-400 mb-6 border-b border-stone-800 pb-2">Fase Eliminatoria</h2>
            <div id="playoffs-tree" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </section>

    </main>

    <!-- Script de Firebase e Lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIGURACIÓN DE FIREBASE (Reemplaza con tus datos)
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO_ID",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "NUMERO",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "torneos", "actual");

        let tournamentData = null;

        // Escuchar cambios en Firestore
        onSnapshot(docRef, (snap) => {
            if (snap.exists()) {
                tournamentData = snap.data();
                renderApp();
            } else {
                tournamentData = null;
                renderApp();
            }
        });

        // Eventos
        document.getElementById('btn-start').addEventListener('click', createTournament);
        document.getElementById('btn-reset').addEventListener('click', async () => {
            if (confirm("¿Seguro que quieres borrar el torneo actual?")) {
                await deleteDoc(docRef);
            }
        });

        async function saveData() {
            await setDoc(docRef, tournamentData);
        }

        // Crear Torneo
        function createTournament() {
            const rawPlayers = document.getElementById('cfg-players').value.split('\n').map(p => p.trim()).filter(p => p !== '');
            const numGroups = parseInt(document.getElementById('cfg-groups').value);
            const advPerGroup = parseInt(document.getElementById('cfg-advancing').value);

            if (rawPlayers.length < numGroups * 2) {
                alert(`Necesitas al menos ${numGroups * 2} jugadores.`);
                return;
            }

            const groups = Array.from({ length: numGroups }, () => []);
            rawPlayers.forEach((p, idx) => groups[idx % numGroups].push(p));

            const groupData = groups.map((players, gIdx) => {
                const matches = [];
                for (let i = 0; i < players.length; i++) {
                    for (let j = i + 1; j < players.length; j++) {
                        matches.push({ p1: players[i], p2: players[j], s1: '', s2: '' });
                    }
                }
                return { name: `Grupo ${String.fromCharCode(65 + gIdx)}`, players, matches };
            });

            tournamentData = {
                config: { advPerGroup },
                groups: groupData,
                playoffs: null
            };

            saveData();
        }

        // Renderizar la app
        function renderApp() {
            const secConfig = document.getElementById('sec-config');
            const secGroups = document.getElementById('sec-groups');
            const secPlayoffs = document.getElementById('sec-playoffs');
            const secPodium = document.getElementById('sec-podium');

            if (!tournamentData) {
                secConfig.classList.remove('hidden');
                secGroups.innerHTML = '';
                secPlayoffs.classList.add('hidden');
                secPodium.classList.add('hidden');
                return;
            }

            secConfig.classList.add('hidden');
            renderGroups();
            renderPlayoffs();
        }

        // Renderizar Grupos y Tablas
        function renderGroups() {
            const container = document.getElementById('sec-groups');
            container.innerHTML = '';

            tournamentData.groups.forEach((g, gIdx) => {
                const stats = calculateStats(g);
                
                let matchesHtml = g.matches.map((m, mIdx) => `
                    <div class="flex items-center justify-between text-sm py-1 border-b border-stone-800">
                        <span class="w-1/3 truncate text-right ${m.s1 > m.s2 ? 'font-bold text-clay-600' : ''}">${m.p1}</span>
                        <div class="flex items-center gap-1 mx-2">
                            <input type="number" min="0" value="${m.s1}" data-g="${gIdx}" data-m="${mIdx}" data-p="1" class="ipt-score w-10 text-center bg-stone-800 border border-stone-700 rounded text-amber-500 font-bold">
                            <span>-</span>
                            <input type="number" min="0" value="${m.s2}" data-g="${gIdx}" data-m="${mIdx}" data-p="2" class="ipt-score w-10 text-center bg-stone-800 border border-stone-700 rounded text-amber-500 font-bold">
                        </div>
                        <span class="w-1/3 truncate text-left ${m.s2 > m.s1 ? 'font-bold text-clay-600' : ''}">${m.p2}</span>
                    </div>
                `).join('');

                let tableHtml = stats.map((st, i) => `
                    <tr class="border-b border-stone-800 ${i < tournamentData.config.advPerGroup ? 'bg-clay-600/10' : ''}">
                        <td class="p-2 font-bold text-xs">${i + 1}</td>
                        <td class="p-2 text-sm font-semibold">${st.name}</td>
                        <td class="p-2 text-center text-xs text-gray-400">${st.pj}</td>
                        <td class="p-2 text-center text-xs text-gray-400">${st.pg}</td>
                        <td class="p-2 text-center text-xs text-gray-400">${st.dif >= 0 ? '+' + st.dif : st.dif}</td>
                        <td class="p-2 text-center font-bold text-gold-400">${st.pts}</td>
                    </tr>
                `).join('');

                container.innerHTML += `
                    <div class="bg-stone-900 border border-stone-800 rounded-xl p-5 shadow-xl grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div>
                            <h3 class="text-lg font-bold text-clay-600 mb-3">${g.name} - Partidos</h3>
                            <div class="space-y-1">${matchesHtml}</div>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-gold-400 mb-3">Clasificación</h3>
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="text-xs text-gray-500 border-b border-stone-800">
                                        <th class="p-2">#</th><th class="p-2">Jugador</th><th class="p-2 text-center">PJ</th><th class="p-2 text-center">PG</th><th class="p-2 text-center">DIF</th><th class="p-2 text-center">PTS</th>
                                    </tr>
                                </thead>
                                <tbody>${tableHtml}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            });

            // Event Listeners para inputs de score
            document.querySelectorAll('.ipt-score').forEach(input => {
                input.addEventListener('change', (e) => {
                    const g = e.target.dataset.g;
                    const m = e.target.dataset.m;
                    const p = e.target.dataset.p;
                    const val = e.target.value === '' ? '' : parseInt(e.target.value);

                    tournamentData.groups[g].matches[m][`s${p}`] = val;
                    
                    // Si todos los partidos de grupos han terminado, generar Eliminatorias automáticamente si no existen
                    checkAndGeneratePlayoffs();
                    saveData();
                });
            });
        }

        // Calcular Estadísticas
        function calculateStats(group) {
            const stats = {};
            group.players.forEach(p => stats[p] = { name: p, pj: 0, pg: 0, dif: 0, pts: 0 });

            group.matches.forEach(m => {
                if (m.s1 !== '' && m.s2 !== '') {
                    const s1 = parseInt(m.s1);
                    const s2 = parseInt(m.s2);

                    stats[m.p1].pj++;
                    stats[m.p2].pj++;
                    stats[m.p1].dif += (s1 - s2);
                    stats[m.p2].dif += (s2 - s1);

                    if (s1 > s2) {
                        stats[m.p1].pg++;
                        stats[m.p1].pts += 3;
                    } else if (s2 > s1) {
                        stats[m.p2].pg++;
                        stats[m.p2].pts += 3;
                    } else {
                        stats[m.p1].pts += 1;
                        stats[m.p2].pts += 1;
                    }
                }
            });

            return Object.values(stats).sort((a, b) => b.pts - a.pts || b.dif - a.dif || b.pg - a.pg);
        }

        // Comprobar y Generar Cuadro Eliminatorio
        function checkAndGeneratePlayoffs() {
            const allFinished = tournamentData.groups.every(g => g.matches.every(m => m.s1 !== '' && m.s2 !== ''));
            if (!allFinished) return;

            if (!tournamentData.playoffs) {
                const qualified = [];
                tournamentData.groups.forEach(g => {
                    const sorted = calculateStats(g);
                    for (let i = 0; i < tournamentData.config.advPerGroup; i++) {
                        if (sorted[i]) qualified.push(sorted[i].name);
                    }
                });

                // Crear semifinales (soporta 4 clasificados en total)
                if (qualified.length >= 4) {
                    tournamentData.playoffs = {
                        semi: [
                            { p1: qualified[0], p2: qualified[3], s1: '', s2: '' },
                            { p1: qualified[1], p2: qualified[2], s1: '', s2: '' }
                        ],
                        thirdPlace: { p1: 'Perdedor Semi 1', p2: 'Perdedor Semi 2', s1: '', s2: '' },
                        final: { p1: 'Ganador Semi 1', p2: 'Ganador Semi 2', sets1: ['', '', ''], sets2: ['', '', ''] }
                    };
                }
            }
        }

        // Renderizar Cuadro Eliminatorio
        function renderPlayoffs() {
            const secPlayoffs = document.getElementById('sec-playoffs');
            const container = document.getElementById('playoffs-tree');
            if (!tournamentData.playoffs) {
                secPlayoffs.classList.add('hidden');
                return;
            }

            secPlayoffs.classList.remove('hidden');
            const po = tournamentData.playoffs;

            // Actualizar cruces según semifinales
            if (po.semi[0].s1 !== '' && po.semi[0].s2 !== '') {
                const win1 = parseInt(po.semi[0].s1) > parseInt(po.semi[0].s2) ? po.semi[0].p1 : po.semi[0].p2;
                const lose1 = parseInt(po.semi[0].s1) > parseInt(po.semi[0].s2) ? po.semi[0].p2 : po.semi[0].p1;
                po.final.p1 = win1;
                po.thirdPlace.p1 = lose1;
            }
            if (po.semi[1].s1 !== '' && po.semi[1].s2 !== '') {
                const win2 = parseInt(po.semi[1].s1) > parseInt(po.semi[1].s2) ? po.semi[1].p1 : po.semi[1].p2;
                const lose2 = parseInt(po.semi[1].s1) > parseInt(po.semi[1].s2) ? po.semi[1].p2 : po.semi[1].p1;
                po.final.p2 = win2;
                po.thirdPlace.p2 = lose2;
            }

            container.innerHTML = `
                <!-- Semifinales -->
                <div class="space-y-4">
                    <h3 class="font-bold text-gray-400 text-sm">Semifinales</h3>
                    ${po.semi.map((m, idx) => `
                        <div class="bg-stone-800 p-3 rounded-lg border border-stone-700">
                            <div class="flex justify-between items-center text-sm mb-2">
                                <span>${m.p1}</span>
                                <input type="number" value="${m.s1}" data-po="semi" data-idx="${idx}" data-p="1" class="ipt-po w-10 text-center bg-stone-900 border border-stone-700 rounded font-bold text-amber-500">
                            </div>
                            <div class="flex justify-between items-center text-sm">
                                <span>${m.p2}</span>
                                <input type="number" value="${m.s2}" data-po="semi" data-idx="${idx}" data-p="2" class="ipt-po w-10 text-center bg-stone-900 border border-stone-700 rounded font-bold text-amber-500">
                            </div>
                        </div>
                    `).join('')}

                    <h3 class="font-bold text-amber-700 text-sm mt-6">3º y 4º Puesto</h3>
                    <div class="bg-stone-800 p-3 rounded-lg border border-stone-700">
                        <div class="flex justify-between items-center text-sm mb-2">
                            <span>${po.thirdPlace.p1}</span>
                            <input type="number" value="${po.thirdPlace.s1}" data-po="third" data-p="1" class="ipt-po w-10 text-center bg-stone-900 border border-stone-700 rounded font-bold text-amber-500">
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span>${po.thirdPlace.p2}</span>
                            <input type="number" value="${po.thirdPlace.s2}" data-po="third" data-p="2" class="ipt-po w-10 text-center bg-stone-900 border border-stone-700 rounded font-bold text-amber-500">
                        </div>
                    </div>
                </div>

                <!-- Gran Final al Mejor de 3 Sets -->
                <div class="space-y-4">
                    <h3 class="font-bold text-gold-400 text-sm">Gran Final (Mejor de 3 Sets)</h3>
                    <div class="bg-stone-800 p-4 rounded-lg border-2 border-gold-500/50 shadow-lg">
                        <div class="text-xs text-gray-400 mb-2 grid grid-cols-5 text-center">
                            <span class="col-span-2 text-left">Jugador</span><span>Set 1</span><span>Set 2</span><span>Set 3</span>
                        </div>
                        
                        <!-- Jugador 1 -->
                        <div class="grid grid-cols-5 items-center gap-1 mb-3 text-sm">
                            <span class="col-span-2 font-bold text-gold-400 truncate">${po.final.p1}</span>
                            <input type="number" value="${po.final.sets1[0]}" data-set="0" data-p="1" class="ipt-final w-full text-center bg-stone-900 border border-stone-700 rounded py-1 font-bold">
                            <input type="number" value="${po.final.sets1[1]}" data-set="1" data-p="1" class="ipt-final w-full text-center bg-stone-900 border border-stone-700 rounded py-1 font-bold">
                            <input type="number" value="${po.final.sets1[2]}" data-set="2" data-p="1" class="ipt-final w-full text-center bg-stone-900 border border-stone-700 rounded py-1 font-bold">
                        </div>
                        <!-- Jugador 2 -->
                        <div class="grid grid-cols-5 items-center gap-1 text-sm">
                            <span class="col-span-2 font-bold text-gold-400 truncate">${po.final.p2}</span>
                            <input type="number" value="${po.final.sets2[0]}" data-set="0" data-p="2" class="ipt-final w-full text-center bg-stone-900 border border-stone-700 rounded py-1 font-bold">
                            <input type="number" value="${po.final.sets2[1]}" data-set="1" data-p="2" class="ipt-final w-full text-center bg-stone-900 border border-stone-700 rounded py-1 font-bold">
                            <input type="number" value="${po.final.sets2[2]}" data-set="2" data-p="2" class="ipt-final w-full text-center bg-stone-900 border border-stone-700 rounded py-1 font-bold">
                        </div>
                    </div>
                </div>
            `;

            // Escuchar cambios en eliminatorias
            document.querySelectorAll('.ipt-po').forEach(ipt => {
                ipt.addEventListener('change', (e) => {
                    const type = e.target.dataset.po;
                    const p = e.target.dataset.p;
                    const val = e.target.value;

                    if (type === 'semi') {
                        const idx = e.target.dataset.idx;
                        po.semi[idx][`s${p}`] = val;
                    } else if (type === 'third') {
                        po.thirdPlace[`s${p}`] = val;
                    }
                    saveData();
                });
            });

            // Escuchar cambios en la Final por Sets
            document.querySelectorAll('.ipt-final').forEach(ipt => {
                ipt.addEventListener('change', (e) => {
                    const setIdx = e.target.dataset.set;
                    const p = e.target.dataset.p;
                    po.final[`sets${p}`][setIdx] = e.target.value;
                    saveData();
                });
            });

            checkPodium();
        }

        // Determinar Podio Final
        function checkPodium() {
            const po = tournamentData.playoffs;
            if (!po) return;

            let champion = null;
            let runnerUp = null;
            let third = null;

            // Ganador del 3er puesto
            if (po.thirdPlace.s1 !== '' && po.thirdPlace.s2 !== '') {
                third = parseInt(po.thirdPlace.s1) > parseInt(po.thirdPlace.s2) ? po.thirdPlace.p1 : po.thirdPlace.p2;
            }

            // Ganador de la Final (al mejor de 3)
            let setsP1 = 0;
            let setsP2 = 0;
            for (let i = 0; i < 3; i++) {
                const s1 = parseInt(po.final.sets1[i]);
                const s2 = parseInt(po.final.sets2[i]);
                if (!isNaN(s1) && !isNaN(s2)) {
                    if (s1 > s2) setsP1++;
                    else if (s2 > s1) setsP2++;
                }
            }

            if (setsP1 >= 2) {
                champion = po.final.p1;
                runnerUp = po.final.p2;
            } else if (setsP2 >= 2) {
                champion = po.final.p2;
                runnerUp = po.final.p1;
            }

            if (champion && runnerUp && third) {
                document.getElementById('sec-podium').classList.remove('hidden');
                document.getElementById('podium-1').innerText = champion;
                document.getElementById('podium-2').innerText = runnerUp;
                document.getElementById('podium-3').innerText = third;
            }
        }
    </script>
</body>
</html>
